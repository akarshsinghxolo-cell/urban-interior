name: Agent final audit rerun v2

on:
  push:
    branches: [agent/page-entity-egress-architecture]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Rerun final audit corrections v2'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/page-entity-egress-architecture
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Apply final audited corrections with mechanical fixes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          # Reuse the exact corrected patch body from the prior safe runner.
          workflow = Path('.github/workflows/agent-reaudit-final-rerun.yml').read_text()
          start_marker = "          python <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = workflow[start:end]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in script.splitlines())
          exec(compile(script, 'corrected-final-audit-patch.py', 'exec'), {})

          # The collection predicate refactor moved bootstrap detection into the
          # helper, but mergeWorkspaceSnapshot still needs the same local boolean
          # for foundation metadata bookkeeping.
          path = Path('src/lib/rdash/workspace-session-merge.ts')
          text = path.read_text()
          old = '''  const incomingMeta = metadata(incoming);\n  const represented = representedCollections(incoming);'''
          new = '''  const incomingMeta = metadata(incoming);\n  const scope = String(incomingMeta._workspace_read_scope || "");\n  const mode = String(incomingMeta._workspace_read_mode || "");\n  const bootstrap = scope === "bootstrap" || mode === "bootstrap";\n  const represented = representedCollections(incoming);'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected merge bootstrap insertion point once, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))

          # Use the existing test fixture constructor; no separate empty() helper exists.
          path = Path('tests/workspace-session-merge.test.ts')
          text = path.read_text()
          if text.count('const current = empty();') != 1 or text.count('const complete = empty();') != 1:
              raise SystemExit('Expected the two generated tombstone fixture calls exactly once.')
          text = text.replace('const current = empty();', 'const current = createEmptyWorkspaceDatabase();', 1)
          text = text.replace('const complete = empty();', 'const complete = createEmptyWorkspaceDatabase();', 1)
          path.write_text(text)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Run focused regressions
        run: npx vitest run tests/workspace-session-merge.test.ts tests/runtime-efficiency-hardening.test.ts tests/workspace-navigation-revalidation.test.ts tests/workspace-client-delta-sync.test.ts tests/workspace-delta-sync.test.ts tests/workspace-entity-scoped-read.test.ts tests/workspace-module-scoped-read.test.ts tests/workspace-bootstrap-scoped-flow.test.ts tests/phase2b-targeted-commit.test.ts
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Commit validated corrections
        shell: bash
        run: |
          git config user.name "akarshsinghxolo-cell"
          git config user.email "akarshsinghxolo@gmail.com"
          git add src tests
          if git diff --cached --quiet; then
            echo "No application changes to commit"
            exit 0
          fi
          git commit -m "Close final workspace lifecycle audit gaps"
          git push origin HEAD:agent/page-entity-egress-architecture
