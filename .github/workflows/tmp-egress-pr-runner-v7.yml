name: Run PostgREST egress hardening patch v7

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Execute final egress patch
        shell: python
        run: |
          from pathlib import Path
          import base64
          import re

          old_health = base64.b64decode("").decode("utf-8")
          new_health = base64.b64decode("").decode("utf-8")
          health_path = Path("src/app/api/health/summary/route.ts")
          health = health_path.read_text(encoding="utf-8")
          if health.count(old_health) != 1:
              raise SystemExit(f"Health response anchor count: {health.count(old_health)}")
          health_path.write_text(health.replace(old_health, new_health, 1), encoding="utf-8")

          embedded_path = Path(".github/workflows/tmp-egress-hardening.yml")
          embedded = embedded_path.read_text(encoding="utf-8")
          embedded, removed = re.subn(
              r"\n          # Add response-byte telemetry to the two egress-heavy routes\..*?\n          # Workspace success payload helper avoids double serialization while reporting bytes\.",
              "\n          # Workspace success payload helper avoids double serialization while reporting bytes.",
              embedded,
              count=1,
              flags=re.S,
          )
          if removed != 1:
              raise SystemExit(f"Embedded health telemetry block removal count: {removed}")
          embedded_path.write_text(embedded, encoding="utf-8")

          runner = Path(".github/workflows/tmp-egress-pr-runner-v6.yml").read_text(encoding="utf-8").splitlines()
          run_line = next(i for i, line in enumerate(runner) if line.strip() == "run: |")
          end = next(i for i in range(run_line + 1, len(runner)) if runner[i].strip() == "- name: Commit implementation")
          script = [line[10:] if line.startswith("          ") else line for line in runner[run_line + 1:end]]
          exec(compile("\n".join(script) + "\n", "egress-runner-v6.py", "exec"), {"__name__": "__main__"})
          for name in ("tmp-egress-pr-runner-v5.yml", "tmp-egress-pr-runner-v6.yml", "tmp-egress-pr-runner-v7.yml"):
              Path(".github/workflows", name).unlink(missing_ok=True)

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Eliminate repeated PostgREST workspace egress"
          git push origin HEAD:${{ github.head_ref }}
