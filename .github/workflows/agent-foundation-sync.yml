name: Agent foundation sync validation

on:
  push:
    branches:
      - agent/page-entity-egress-architecture
    paths:
      - .github/workflows/agent-foundation-sync.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/page-entity-egress-architecture
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Wire foundation synchronizer and guardrails
        run: |
          python - <<'PY'
          from pathlib import Path

          def patch(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one patch anchor, found {text.count(old)}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          foundation = Path('src/components/urban-castle/WorkspaceFoundationSync.tsx')
          source = foundation.read_text(encoding='utf-8')
          source = source.replace(
              'workspaceFoundationRevisionState.advance(delta.currentRevision);',
              'workspaceFoundationRevisionState.advance(delta.revision);',
          )
          foundation.write_text(source, encoding='utf-8')

          patch(
              'src/components/urban-castle/UrbanCastleApp.tsx',
              'import { WorkspaceDeltaSync } from "./WorkspaceDeltaSync";\nimport { WorkspaceScopedReadBoundary } from "./WorkspaceScopedReadBoundary";',
              'import { WorkspaceDeltaSync } from "./WorkspaceDeltaSync";\nimport { WorkspaceFoundationSync } from "./WorkspaceFoundationSync";\nimport { WorkspaceScopedReadBoundary } from "./WorkspaceScopedReadBoundary";',
          )
          patch(
              'src/components/urban-castle/UrbanCastleApp.tsx',
              '        <WorkspaceScopedReadBoundary />\n        <WorkspaceDeltaSync />',
              '        <WorkspaceScopedReadBoundary />\n        <WorkspaceFoundationSync />\n        <WorkspaceDeltaSync />',
          )

          p = Path('tests/runtime-efficiency-hardening.test.ts')
          test = p.read_text(encoding='utf-8')
          anchor = '\n});\n'
          guard = '''\n  test("keeps the bootstrap Master foundation revision-safe without retransmitting it on module reads", async () => {\n    const foundationSync = await read("src/components/urban-castle/WorkspaceFoundationSync.tsx");\n    const moduleReader = await read("src/lib/rdash/server/module-scoped-read.ts");\n    const appShell = await read("src/components/urban-castle/UrbanCastleApp.tsx");\n    expect(appShell).toContain("<WorkspaceFoundationSync />");\n    expect(foundationSync).toContain("WORKSPACE_SESSION_BOOTSTRAP_COLLECTIONS.join");\n    expect(foundationSync).toContain('fetch(`/api/changes?${params.toString()}`');\n    expect(foundationSync).toContain('"X-UC-Delta-Client": "workspace-foundation"');\n    expect(foundationSync).toContain("workspaceFoundationRevisionState");\n    expect(foundationSync).toContain("acceptWorkspaceServerRevision");\n    expect(foundationSync).toContain("applyWorkspaceDelta");\n    expect(foundationSync).toContain('fetch("/api/bootstrap"');\n    expect(foundationSync).not.toContain("setInterval");\n    expect(moduleReader).toContain("!FOUNDATION_COLLECTIONS.has(collection)");\n  });\n'''
          idx = test.rfind(anchor)
          if idx < 0:
              raise SystemExit('runtime efficiency describe end missing')
          p.write_text(test[:idx] + guard + test[idx:], encoding='utf-8')

          p = Path('tests/workspace-client-delta-sync.test.ts')
          test = p.read_text(encoding='utf-8')
          test = test.replace(
              'import { workspaceDeltaSyncIsSafe } from "@/lib/rdash/workspace-delta-sync-policy";\n',
              'import { workspaceDeltaSyncIsSafe } from "@/lib/rdash/workspace-delta-sync-policy";\nimport { workspaceFoundationRevisionState } from "@/lib/rdash/workspace-foundation-revision-state";\n',
              1,
          )
          test = test.replace(
              'afterEach(() => workspaceRowVersionState.resetForTests());',
              'afterEach(() => {\n  workspaceRowVersionState.resetForTests();\n  workspaceFoundationRevisionState.reset();\n});',
              1,
          )
          marker = 'describe("collection-filtered server deltas", () => {'
          addition = '''describe("foundation revision state", () => {\n  test("advances monotonically and can reset for a new authenticated session", () => {\n    workspaceFoundationRevisionState.replace(10);\n    workspaceFoundationRevisionState.advance(8);\n    expect(workspaceFoundationRevisionState.get()).toBe(10);\n    workspaceFoundationRevisionState.advance(12);\n    expect(workspaceFoundationRevisionState.get()).toBe(12);\n    workspaceFoundationRevisionState.reset();\n    expect(workspaceFoundationRevisionState.get()).toBe(0);\n  });\n});\n\n'''
          if marker not in test:
              raise SystemExit('delta test insertion marker missing')
          p.write_text(test.replace(marker, addition + marker, 1), encoding='utf-8')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Run focused regressions
        run: npx vitest run tests/runtime-efficiency-hardening.test.ts tests/workspace-client-delta-sync.test.ts tests/workspace-bootstrap-scoped-flow.test.ts tests/workspace-navigation-revalidation.test.ts
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Commit validated application changes
        run: |
          git config user.name "akarshsinghxolo-cell"
          git config user.email "akarshsinghxolo@gmail.com"
          git add src tests
          git commit -m "Keep shared Master foundation revision-safe"
          git push origin HEAD:agent/page-entity-egress-architecture
