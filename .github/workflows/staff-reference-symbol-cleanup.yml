name: Staff reference symbol cleanup

on:
  push:
    branches:
      - agent/staff-reference-integrity

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/staff-reference-integrity
      - name: Rename stale Staff profile helper symbols
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "enrichStaffProfiles": "enrichStaffRecords",
              "createSeedStaffProfiles": "createSeedStaffRecords",
          }
          for path in Path("src").rglob("*"):
              if not path.is_file() or path.suffix not in {".ts", ".tsx", ".js", ".jsx"}:
                  continue
              text = path.read_text(encoding="utf-8")
              updated = text
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding="utf-8")
          PY
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Rename stale Staff profile helper symbols"
          git push origin HEAD:agent/staff-reference-integrity
