name: Manual Vercel Preview

on:
  workflow_dispatch:
  push:
    branches:
      - agent/integrate-hidden-workflows

concurrency:
  group: manual-vercel-preview
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_ruGxpkMnpHt7EwtHJrj8VRIz
      VERCEL_PROJECT_ID: prj_5j1k1qwBvnsRdOsLQVSBmGgRWwEG
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Verify Vercel token
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}" || {
            echo "Missing required secret: VERCEL_TOKEN" >&2
            exit 1
          }
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Copy required production variables to Preview
        shell: bash
        run: |
          set -euo pipefail
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          set -a
          source .vercel/.env.production.local
          set +a

          test -n "${SUPABASE_URL:-}" || { echo "Production SUPABASE_URL is missing." >&2; exit 1; }
          test -n "${SUPABASE_PUBLISHABLE_KEY:-${SUPABASE_ANON_KEY:-}}" || { echo "Production Supabase publishable key is missing." >&2; exit 1; }
          test -n "${SUPABASE_SECRET_KEY:-${SUPABASE_SERVICE_ROLE_KEY:-}}" || { echo "Production Supabase server key is missing." >&2; exit 1; }
          test -n "${UC_SESSION_SECRET:-}" || { echo "Production UC_SESSION_SECRET is missing." >&2; exit 1; }

          copy_preview_env() {
            local name="$1"
            local value="${!name:-}"
            if [ -n "$value" ]; then
              printf '%s\n' "$value" | vercel env add "$name" preview --force --token="$VERCEL_TOKEN" >/dev/null
              echo "Configured ${name} for Preview."
            fi
          }

          for name in \
            SUPABASE_URL \
            SUPABASE_PUBLISHABLE_KEY \
            SUPABASE_ANON_KEY \
            SUPABASE_SECRET_KEY \
            SUPABASE_SERVICE_ROLE_KEY \
            UC_SESSION_SECRET \
            UC_WORKSPACE_ID; do
            copy_preview_env "$name"
          done
      - name: Pull preview environment
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
      - name: Install application dependencies
        run: bun install --frozen-lockfile
      - name: Verify live Supabase read plans
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source .vercel/.env.preview.local
          set +a
          bun run scripts/verify-preview-read-plans.ts
      - name: Build preview in GitHub Actions
        run: vercel build --token="$VERCEL_TOKEN"
      - name: Deploy prebuilt preview
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          url="$(vercel deploy --prebuilt --archive=tgz --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Vercel preview" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
      - name: Print preview URL
        run: echo "Preview URL: ${{ steps.deploy.outputs.url }}"
