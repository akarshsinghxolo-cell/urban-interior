name: WhatsApp QR lockfile refresh

on:
  push:
    branches:
      - fix/whatsapp-qr-pairing
    paths:
      - package.json
      - .github/workflows/whatsapp-qr-lockfile.yml

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: "!contains(github.event.head_commit.message, '[qr-lock]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/whatsapp-qr-pairing
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Refresh package lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit package lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current."
            exit 0
          fi
          git commit -m "Refresh QR dependency lockfile [qr-lock]"
          git push origin HEAD:fix/whatsapp-qr-pairing
