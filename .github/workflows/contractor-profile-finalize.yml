name: Contractor profile finalizer

on:
  push:
    branches:
      - agent/contractor-profile-unification
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contractor-profile-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/contractor-profile-unification
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Apply final contractor patches
        run: python scripts/apply-contractor-profile-finalize.py
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Auto-fix touched files
        run: |
          bunx eslint --fix \
            src/components/rdash/ContractorFormDialog.tsx \
            src/components/rdash/PartnerFormDialog.tsx \
            src/components/rdash/modules/Partner360Module.tsx \
            src/lib/rdash/contractor-profile.ts \
            src/lib/rdash/contractor-store-policy.ts \
            src/lib/rdash/partner-form-store-bridge.ts \
            src/lib/rdash/store.ts \
            src/lib/rdash/types.ts \
            tests/contractor-profile.test.ts || true
      - name: Verify contractor regression suite
        run: bun run test:contractor-profile
      - name: Commit finalized implementation
        run: |
          rm scripts/apply-contractor-profile-finalize.py
          rm .github/workflows/contractor-profile-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize unified Contractor profile workflow"
          git push origin HEAD:agent/contractor-profile-unification
