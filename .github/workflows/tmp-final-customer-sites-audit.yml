name: Final Customer and Sites audit

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  audit:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Apply final correctness audit
        run: python scripts/finalize-customer-sites-audit.py
      - name: Preserve workflow files for connector cleanup
        run: git restore .github/workflows/application-ci.yml .github/workflows/tmp-final-customer-sites-audit.yml
      - name: Validate complete application
        run: |
          bun install --frozen-lockfile
          bun run test:customer-sites-save
          bun run test:customer-sites-legacy
          bun run test:phase2b
          bun run lint
          bun run build
      - name: Commit audited application changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git diff --cached --quiet && exit 0
          git commit -m "Harden unified Customer and Sites workflow"
          git push origin HEAD:${{ github.head_ref }}
