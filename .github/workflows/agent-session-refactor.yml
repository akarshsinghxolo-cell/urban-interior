name: Agent session hydration refactor

on:
  push:
    branches:
      - agent/page-entity-egress-architecture
    paths:
      - .github/workflows/agent-session-refactor.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/page-entity-egress-architecture
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Correct duplicate-safe patch helper
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/agent-session-refactor.py')
          text = p.read_text(encoding='utf-8')
          old = """    count = text.count(old)\n    if count != 1:\n        raise SystemExit(f'{path}: expected one occurrence, found {count}: {old[:100]!r}')\n    write(path, text.replace(old, new, 1))\n"""
          new = """    count = text.count(old)\n    if count < 1:\n        raise SystemExit(f'{path}: expected an occurrence, found {count}: {old[:100]!r}')\n    write(path, text.replace(old, new, 1))\n"""
          if old not in text:
              raise SystemExit('replace_once helper shape changed unexpectedly')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Apply foundation-first session refactor
        run: python .github/agent-session-refactor.py
      - name: Correct refactor integration details
        run: |
          python - <<'PY'
          from pathlib import Path

          store_path = Path('src/lib/rdash/raw-store.ts')
          store = store_path.read_text(encoding='utf-8')
          store = store.replace(
              'restoreAcceptedWorkspace(payload.error || "The server rejected the workspace reset. The last confirmed workspace was restored.", payload);',
              'restoreAcceptedWorkspace(payload.error || "The server rejected the workspace reset. The last confirmed workspace was restored.");',
          )
          store = store.replace(
              'const accepted = normalizeWorkspaceSession(payload.data));',
              'const accepted = normalizeWorkspaceSession(payload.data);',
          )
          if 'prepareWorkspaceDatabase(' in store or 'buildSeedDatabase' in store:
              raise SystemExit('impure/seed hydration path still exists in raw-store')
          store_path.write_text(store, encoding='utf-8')

          test_path = Path('tests/runtime-efficiency-hardening.test.ts')
          test = test_path.read_text(encoding='utf-8')
          old = '''    const rawStore = await read("src/lib/rdash/raw-store.ts");\n    const outbox = await read("src/lib/uploads/workspace-outbox.ts");\n    expect(workCategory).toContain("...(db as RDashDatabase)");\n    expect(rawStore).toContain("prepareWorkspaceData({ ...input })");\n    expect(rawStore).toContain("...base");\n'''
          new = '''    const rawStore = await read("src/lib/rdash/raw-store.ts");\n    const sessionMerge = await read("src/lib/rdash/workspace-session-merge.ts");\n    const outbox = await read("src/lib/uploads/workspace-outbox.ts");\n    expect(workCategory).toContain("...(db as RDashDatabase)");\n    expect(rawStore).toContain("mergeWorkspaceSnapshot(current.db, db)");\n    expect(sessionMerge).toContain("prepareWorkspaceData(structuredClone(input) as RDashDatabase)");\n    expect(sessionMerge).toContain("structuredClone(current || createEmptyWorkspaceDatabase())");\n'''
          if old not in test:
              raise SystemExit('pagination metadata regression test shape changed unexpectedly')
          test_path.write_text(test.replace(old, new, 1), encoding='utf-8')

          merge_test_path = Path('tests/workspace-session-merge.test.ts')
          merge_test = merge_test_path.read_text(encoding='utf-8')
          merge_test = merge_test.replace(
              '] as RDashDatabase["tasks"];',
              '] as unknown as RDashDatabase["tasks"];',
          )
          merge_test = merge_test.replace(
              '] as RDashDatabase["customers"];',
              '] as unknown as RDashDatabase["customers"];',
          )
          merge_test_path.write_text(merge_test, encoding='utf-8')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Run focused lifecycle regressions
        run: npx vitest run tests/workspace-session-merge.test.ts tests/workspace-bootstrap-scoped-flow.test.ts tests/workspace-navigation-revalidation.test.ts tests/runtime-efficiency-hardening.test.ts
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Commit validated application changes
        run: |
          git config user.name "akarshsinghxolo-cell"
          git config user.email "akarshsinghxolo@gmail.com"
          git add src tests
          if git diff --cached --quiet; then
            echo "No application changes to commit."
            exit 0
          fi
          git commit -m "Make workspace hydration foundation-first and persistent"
          git push origin HEAD:agent/page-entity-egress-architecture
