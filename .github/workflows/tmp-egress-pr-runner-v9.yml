name: Run PostgREST egress hardening patch v9

on:
  pull_request:
    branches: [main]
    types: [reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Execute corrected egress patch
        shell: python
        run: |
          from pathlib import Path
          import re

          runner_path = Path(".github/workflows/tmp-egress-pr-runner-v8.yml")
          lines = runner_path.read_text(encoding="utf-8").splitlines()
          run_line = next(i for i, line in enumerate(lines) if line.strip() == "run: |")
          end = next(i for i in range(run_line + 1, len(lines)) if lines[i].strip() == "- name: Commit implementation")
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in lines[run_line + 1:end]) + "\n"

          brittle = re.compile(
              r"embedded, removed = re\.subn\(.*?embedded_path\.write_text\(embedded, encoding=\"utf-8\"\)",
              re.S,
          )
          deterministic = '''start_marker = "          # Add response-byte telemetry to the two egress-heavy routes."
          end_marker = "          # Store the migration in the repository."
          start = embedded.find(start_marker)
          end = embedded.find(end_marker, start + 1)
          if start < 0 or end < 0:
            raise SystemExit(f"Embedded telemetry markers not found: start={start}, end={end}")
          embedded = embedded[:start] + embedded[end:]
          embedded_path.write_text(embedded, encoding="utf-8")'''
          script, count = brittle.subn(deterministic, script, count=1)
          if count != 1:
              raise SystemExit(f"Could not replace brittle embedded-workflow rewrite: {count}")

          exec(compile(script, "egress-runner-v8-corrected.py", "exec"), {"__name__": "__main__"})
          Path(".github/workflows/tmp-egress-pr-runner-v9.yml").unlink(missing_ok=True)

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Eliminate repeated PostgREST workspace egress"
          git push origin HEAD:feature/eliminate-postgrest-egress-leaks
