          # Store the migration in the repository.
          Path("supabase/migrations/20260729030000_workspace_health_aggregate.sql").write_text(r'''create table if not exists public.workspace_health_snapshot (
  workspace_id text primary key,
  workspace_revision bigint not null default 0,
  health_score integer not null default 100,
  total_issues integer not null default 0,
  critical_count integer not null default 0,
  warning_count integer not null default 0,
  info_count integer not null default 0,
  total_records bigint not null default 0,
  total_references bigint not null default 0,
  business_rule_issues integer not null default 0,
