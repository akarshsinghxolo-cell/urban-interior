name: Finalize Convergence Fix

on:
  push:
    branches:
      - agent/supabase-data-convergence

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/supabase-data-convergence
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Apply permanent fixes and remove temporary machinery
        shell: bash
        run: |
          python scripts/patch-contractor-form-lint.py
          python - <<'PY'
          from pathlib import Path
          types = Path('src/lib/rdash/types.ts')
          text = types.read_text()
          old = '        status?: "onboarding" | "active" | "on_hold" | "blacklisted" | "inactive";\n'
          new = '        status?: "active" | "inactive";\n'
          if old not in text and new not in text:
              raise SystemExit('contractor capability status type anchor not found')
          text = text.replace(old, new, 1)
          types.write_text(text)

          workflow = Path('.github/workflows/application-ci.yml')
          text = workflow.read_text()
          text = text.replace('      - name: Apply Contractor form lint fix\n        if: github.event_name == \'pull_request\' && github.head_ref == \'agent/supabase-data-convergence\'\n        run: python scripts/patch-contractor-form-lint.py\n', '')
          commit_block = '''      - name: Commit verified Contractor form lint fix
        if: success() && github.event_name == 'pull_request' && github.head_ref == 'agent/supabase-data-convergence'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/rdash/ContractorFormDialog.tsx
          if git diff --cached --quiet; then
            echo "Contractor form lint fix is already committed."
            exit 0
          fi
          git commit -m "Fix Contractor form hydration lint"
          git push origin HEAD:agent/supabase-data-convergence
'''
          if commit_block not in text:
              raise SystemExit('temporary Contractor CI commit block not found')
          text = text.replace(commit_block, '')
          workflow.write_text(text)
          PY
          rm -f scripts/patch-contractor-form-lint.py
          rm -f .github/workflows/convergence-build-diagnostic.yml
          rm -f .github/workflows/finalize-convergence-fix.yml
      - run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Build
        run: bun run build
      - name: Commit verified permanent fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize Supabase convergence build fixes"
          git push origin HEAD:agent/supabase-data-convergence
