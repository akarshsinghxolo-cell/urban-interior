name: Application CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: application-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test Phase 2B commit policy
        run: bun run test:phase2b
      - name: Test workspace route registry
        run: bun test tests/workspace-route-registry.test.ts --reporter=junit --reporter-outfile=route-test.xml
      - name: Upload route test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: route-test-diagnostics
          path: route-test.xml
          if-no-files-found: ignore
          retention-days: 1
      - name: Build application
        run: bun run build
