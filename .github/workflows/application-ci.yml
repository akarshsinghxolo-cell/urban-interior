name: Application CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: application-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Apply public Google Drive visibility
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/public-drive-files-v2'
        run: |
          python - <<'PY'
          from pathlib import Path

          manager = Path('src/components/rdash/modules/GoogleDriveManagerCoreModule.tsx')
          s = manager.read_text()
          s = s.replace('type AccessPolicy = "internal" | "customer" | "vendor" | "contractor";\n', '')
          s = s.replace('  const [accessPolicy, setAccessPolicy] = React.useState<AccessPolicy>("internal");\n', '')
          s = s.replace('body: JSON.stringify({ accountId: writeDestination.id, accessPolicy })', 'body: JSON.stringify({ accountId: writeDestination.id })')
          s = s.replace('            <div className="mt-4 grid gap-2 md:grid-cols-5">', '            <div className="mt-4 grid gap-2 md:grid-cols-4">')
          old_field = '              <Field label="File Access"><select value={accessPolicy} onChange={(e) => setAccessPolicy(e.target.value as AccessPolicy)} className="h-9 w-full rounded-md border border-input bg-card px-2 text-sm outline-none focus:border-ring focus:ring-2 focus:ring-ring/20"><option value="internal">Private - Google account only</option><option value="customer">Customer-shareable</option><option value="vendor">Vendor restricted</option><option value="contractor">Contractor restricted</option></select></Field>\n'
          if old_field not in s:
              raise SystemExit('File Access selector pattern not found')
          s = s.replace(old_field, '')
          manager.write_text(s)

          test_upload = Path('src/app/api/google-drive/test-upload/route.ts')
          s = test_upload.read_text()
          s = s.replace('const DRIVE_UPLOAD_API = "https://www.googleapis.com/upload/drive/v3/files";\n', 'const DRIVE_API = "https://www.googleapis.com/drive/v3";\nconst DRIVE_UPLOAD_API = "https://www.googleapis.com/upload/drive/v3/files";\n')
          s = s.replace('    const input = await request.json().catch(() => ({})) as {\n      accountId?: string;\n      accessPolicy?: "internal" | "customer" | "vendor" | "contractor";\n    };', '    const input = await request.json().catch(() => ({})) as { accountId?: string };')
          s = s.replace('      `Access policy: ${input.accessPolicy || "internal"}`,', '      "Visibility: Public - anyone with the link can view",')
          marker = '    if (!upload.ok || !payload.id || !payload.webViewLink) {\n      return NextResponse.json({ error: payload.error?.message || "Google Drive test upload failed." }, { status: 422 });\n    }\n\n'
          permission = '''    if (!upload.ok || !payload.id || !payload.webViewLink) {\n      return NextResponse.json({ error: payload.error?.message || "Google Drive test upload failed." }, { status: 422 });\n    }\n\n    const permission = await fetch(`${DRIVE_API}/files/${encodeURIComponent(payload.id)}/permissions?supportsAllDrives=true`, {\n      method: "POST",\n      headers: {\n        Authorization: `Bearer ${accessToken}`,\n        "Content-Type": "application/json",\n      },\n      body: JSON.stringify({ type: "anyone", role: "reader", allowFileDiscovery: false }),\n      cache: "no-store",\n    });\n    if (!permission.ok) {\n      const permissionPayload = await permission.json().catch(() => ({})) as { error?: { message?: string } };\n      await fetch(`${DRIVE_API}/files/${encodeURIComponent(payload.id)}`, {\n        method: "DELETE",\n        headers: { Authorization: `Bearer ${accessToken}` },\n        cache: "no-store",\n      }).catch(() => undefined);\n      return NextResponse.json({ error: permissionPayload.error?.message || "Google Drive could not make the test file public." }, { status: 422 });\n    }\n\n'''
          if marker not in s:
              raise SystemExit('Test upload success marker not found')
          s = s.replace(marker, permission)
          s = s.replace('      tags: ["drive-test", input.accessPolicy || "internal"],', '      tags: ["drive-test", "public"],')
          test_upload.write_text(s)

          finalize = Path('src/lib/rdash/server/direct-upload-finalize-core.ts')
          s = finalize.read_text()
          insertion = 'function requiredString(value: unknown, label: string): string {\n  const result = String(value || "").trim();\n  if (!result) throw new Error(`${label} is missing from the pending upload.`);\n  return result;\n}\n\n'
          helper = '''function requiredString(value: unknown, label: string): string {\n  const result = String(value || "").trim();\n  if (!result) throw new Error(`${label} is missing from the pending upload.`);\n  return result;\n}\n\nasync function makeDriveFilePublic(accessToken: string, fileId: string): Promise<void> {\n  const existing = await driveFetch(\n    accessToken,\n    `${DRIVE_API}/files/${encodeURIComponent(fileId)}/permissions?fields=permissions(id,type,role)`,\n  );\n  const existingPayload = await existing.json().catch(() => ({})) as {\n    permissions?: Array<{ id?: string; type?: string; role?: string }>;\n    error?: { message?: string };\n  };\n  if (!existing.ok) throw new Error(existingPayload.error?.message || "Google Drive could not read file sharing permissions.");\n  if (existingPayload.permissions?.some((permission) => permission.type === "anyone" && permission.role === "reader")) return;\n\n  const created = await driveFetch(\n    accessToken,\n    `${DRIVE_API}/files/${encodeURIComponent(fileId)}/permissions?supportsAllDrives=true`,\n    {\n      method: "POST",\n      headers: { "Content-Type": "application/json" },\n      body: JSON.stringify({ type: "anyone", role: "reader", allowFileDiscovery: false }),\n    },\n  );\n  if (!created.ok) {\n    const payload = await created.json().catch(() => ({})) as { error?: { message?: string } };\n    throw new Error(payload.error?.message || "Google Drive could not make the uploaded file public.");\n  }\n}\n\n'''
          if insertion not in s:
              raise SystemExit('Finalize helper insertion point not found')
          s = s.replace(insertion, helper)
          marker = '    Object.assign(file, movedFile);\n  }\n\n  const timestamp = nowIso();'
          if marker not in s:
              raise SystemExit('Finalize permission insertion point not found')
          s = s.replace(marker, '    Object.assign(file, movedFile);\n  }\n\n  await makeDriveFilePublic(accessToken, file.id);\n\n  const timestamp = nowIso();')
          finalize.write_text(s)

          test = Path('tests/google-drive-public-access.test.ts')
          test.write_text('''import { describe, expect, test } from "bun:test";\nimport { readFile } from "node:fs/promises";\n\ndescribe("public Google Drive files", () => {\n  test("removes configurable Drive file-access policy", async () => {\n    const manager = await readFile("src/components/rdash/modules/GoogleDriveManagerCoreModule.tsx", "utf8");\n    expect(manager).not.toContain("type AccessPolicy");\n    expect(manager).not.toContain('label="File Access"');\n    expect(manager).not.toContain("Private - Google account only");\n    expect(manager).not.toContain("Customer-shareable");\n    expect(manager).not.toContain("Vendor restricted");\n    expect(manager).not.toContain("Contractor restricted");\n  });\n\n  test("publishes managed and test uploads as anyone-reader links", async () => {\n    const finalize = await readFile("src/lib/rdash/server/direct-upload-finalize-core.ts", "utf8");\n    const testUpload = await readFile("src/app/api/google-drive/test-upload/route.ts", "utf8");\n    for (const source of [finalize, testUpload]) {\n      expect(source).toContain('type: "anyone"');\n      expect(source).toContain('role: "reader"');\n      expect(source).toContain("allowFileDiscovery: false");\n    }\n    expect(finalize).toContain("await makeDriveFilePublic(accessToken, file.id)");\n    expect(testUpload).toContain('["drive-test", "public"]');\n  });\n});\n''')
          PY
      - name: Check out Vendor cleanup branch head
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/vendor-module-cleanup-no-legacy'
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Apply Vendor cleanup
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/vendor-module-cleanup-no-legacy'
        run: |
          python scripts/apply-vendor-module-cleanup.py
          python scripts/finalize-vendor-module-cleanup.py
          rm scripts/apply-vendor-module-cleanup.py
          rm scripts/finalize-vendor-module-cleanup.py
          rm scripts/.vendor-cleanup-trigger
          rm .github/workflows/vendor-module-cleanup-runner.yml
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test Vendor module cleanup
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/vendor-module-cleanup-no-legacy'
        run: bun run test:vendor-module
      - name: Test Phase 2B commit policy
        run: bun run test:phase2b
      - name: Test workspace route registry
        run: bun run test:routing
      - name: Test workspace route adapter
        run: bun run test:route-adapter
      - name: Test core entity routes
        run: bun run test:entity-routes
      - name: Test workspace history URLs
        run: bun run test:history-urls
      - name: Test workspace detail tabs
        run: bun run test:detail-tabs
      - name: Test workspace customer tabs
        run: bun run test:customer-tabs
      - name: Test workspace task scope
        run: bun run test:task-scope
      - name: Test workspace location presentation
        run: bun run test:location-presentation
      - name: Test workspace share links
        run: bun run test:share-links
      - name: Test workspace exit guard
        run: bun run test:exit-guard
      - name: Test dirty form navigation guard
        run: bun run test:dirty-form-guard
      - name: Test module-scoped workspace reads
        run: bun run test:module-scoped-reads
      - name: Test Staff data minimization
        run: bun test tests/staff-data-minimization.test.ts
      - name: Test Staff reference integrity
        run: bun test tests/staff-reference-integrity.test.ts
      - name: Test public Google Drive access
        run: bun test tests/google-drive-public-access.test.ts
      - name: Test exact module read plans
        run: bun run test:module-read-plans
      - name: Test bootstrap and scoped client reads
        run: bun run test:bootstrap-scoped-flow
      - name: Test entity-scoped workspace reads
        run: bun run test:entity-scoped-reads
      - name: Test workspace revision delta synchronization
        run: bun run test:delta-sync
      - name: Test Supabase persistence convergence
        run: bun test tests/supabase-data-convergence*.test.ts
      - name: Test client workspace delta synchronization
        run: bun run test:client-delta-sync
      - name: Test workspace auth return paths
        run: bun run test:auth-return
      - name: Test workspace route access
        run: bun run test:route-access
      - name: Test authentication source security
        run: bun run test:auth-security
      - name: Test runtime efficiency hardening
        run: bun run test:runtime-efficiency
      - name: Test vendor landed-rate averages
        run: bun run test:vendor-rate-average
      - name: Test unified Customer and Sites saves
        run: bun run test:customer-sites-save
      - name: Test Sales Pipeline progression
        run: bun test tests/sales-pipeline-progress.test.ts
      - name: Test legacy Customer and Site path removal
        run: bun run test:customer-sites-legacy
      - name: Test canonical Contractor profile
        run: bun run test:contractor-profile
      - name: Test frontend staff route bundles
        run: bun test tests/staff-route-bundles.test.ts
      - name: Test bug hunt regressions
        run: bun run test:bug-hunt
      - name: Test field staff UI visibility
        run: bun test tests/field-staff-visibility.test.ts
      # TypeScript errors are blocking: this gate must stay green before lint/build.
      - name: Typecheck application
        run: bunx tsc --noEmit
      - name: Lint application
        run: bun run lint
      - name: Build application
        run: bun run build
      - name: Commit public Google Drive visibility
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/public-drive-files-v2'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/rdash/modules/GoogleDriveManagerCoreModule.tsx src/app/api/google-drive/test-upload/route.ts src/lib/rdash/server/direct-upload-finalize-core.ts tests/google-drive-public-access.test.ts
          if git diff --cached --quiet; then
            echo "No public Drive changes to commit."
            exit 0
          fi
          git commit -m "Make Google Drive uploads public by link"
          git push origin HEAD:agent/public-drive-files-v2
      - name: Commit verified Vendor cleanup
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/vendor-module-cleanup-no-legacy'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No application changes to commit."
            exit 0
          fi
          git commit -m "Complete Vendor module cleanup and remove legacy compatibility"
          git push origin HEAD:feature/vendor-module-cleanup-no-legacy
