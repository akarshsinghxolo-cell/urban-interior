name: Application CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: application-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Check out Vendor cleanup branch head
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/vendor-module-cleanup-no-legacy'
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Apply Vendor cleanup
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/vendor-module-cleanup-no-legacy' && hashFiles('scripts/apply-vendor-module-cleanup.py') != ''
        run: |
          python scripts/apply-vendor-module-cleanup.py
          python scripts/finalize-vendor-module-cleanup.py
          rm scripts/apply-vendor-module-cleanup.py
          rm scripts/finalize-vendor-module-cleanup.py
          rm scripts/.vendor-cleanup-trigger
          rm .github/workflows/vendor-module-cleanup-runner.yml
      - name: Install dependencies
        run: npm ci
      - name: Test Vendor module cleanup
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/vendor-module-cleanup-no-legacy'
        run: npm run test:vendor-module
      # Full unit suite: tests/**/*.test.ts (86 files). This single step
      # covers every previously hand-listed targeted run plus the 40+
      # files that had no merge protection. Playwright e2e specs are
      # excluded by vitest.config.mts and run separately below.
      - name: Test (full vitest suite)
        run: npm run test
      # TypeScript errors are blocking: this gate must stay green before lint/build.
      - name: Typecheck application
        run: npx tsc --noEmit
      - name: Lint application
        run: npm run lint
      - name: Build application
        run: npm run build
      - name: Install bun (QA mock runtime)
        uses: oven-sh/setup-bun@v2
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run e2e smoke pack (real browser UI flows)
        run: npm run test:e2e
      - name: Upload e2e artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
      - name: Commit verified Vendor cleanup
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/vendor-module-cleanup-no-legacy'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No application changes to commit."
            exit 0
          fi
          git commit -m "Complete Vendor module cleanup and remove legacy compatibility"
          git push origin HEAD:feature/vendor-module-cleanup-no-legacy