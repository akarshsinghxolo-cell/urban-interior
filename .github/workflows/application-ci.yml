name: Application CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: application-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test (full vitest suite)
        run: npm run test
      # TypeScript errors are blocking: this gate must stay green before lint/build.
      - name: Typecheck application
        run: npx tsc --noEmit
      - name: Lint application
        run: npm run lint
      - name: Build application
        run: npm run build
      - name: Install bun (QA mock runtime)
        uses: oven-sh/setup-bun@v2
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run e2e smoke pack (real browser UI flows)
        run: npm run test:e2e
      - name: Upload e2e artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore