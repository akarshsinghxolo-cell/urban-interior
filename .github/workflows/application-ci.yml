name: Application CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: application-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test Phase 2B commit policy
        run: bun run test:phase2b
      - name: Test workspace route registry
        run: bun run test:routing
      - name: Test workspace route adapter
        run: bun run test:route-adapter
      - name: Test core entity routes
        run: bun run test:entity-routes
      - name: Test workspace history URLs
        run: bun run test:history-urls
      - name: Test workspace detail tabs
        run: bun run test:detail-tabs
      - name: Test workspace customer tabs
        run: bun run test:customer-tabs
      - name: Test workspace task scope
        run: bun run test:task-scope
      - name: Test workspace location presentation
        run: bun run test:location-presentation
      - name: Test workspace share links
        run: bun run test:share-links
      - name: Test workspace exit guard
        run: bun run test:exit-guard
      - name: Test dirty form navigation guard
        run: bun run test:dirty-form-guard
      - name: Test module-scoped workspace reads
        run: bun run test:module-scoped-reads
      - name: Test exact module read plans
        run: bun run test:module-read-plans
      - name: Test bootstrap and scoped client reads
        run: bun run test:bootstrap-scoped-flow
      - name: Test entity-scoped workspace reads
        run: bun run test:entity-scoped-reads
      - name: Test workspace revision delta synchronization
        run: bun run test:delta-sync
      - name: Test client workspace delta synchronization
        run: bun run test:client-delta-sync
      - name: Test workspace auth return paths
        run: bun run test:auth-return
      - name: Test workspace route access
        run: bun run test:route-access
      - name: Test authentication source security
        run: bun run test:auth-security
      - name: Test runtime efficiency hardening
        run: bun run test:runtime-efficiency
      - name: Build application
        run: bun run build

  deploy-scoped-read-preview:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/integrate-hidden-workflows'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_ruGxpkMnpHt7EwtHJrj8VRIz
      VERCEL_PROJECT_ID: prj_5j1k1qwBvnsRdOsLQVSBmGgRWwEG
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify preview deployment token
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}" || {
            echo "Missing required secret: VERCEL_TOKEN" >&2
            exit 1
          }
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Preview build settings
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
      - name: Build Vercel preview
        run: vercel build --token="$VERCEL_TOKEN"
      - name: Deploy isolated Vercel preview
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          verify_token="$(openssl rand -hex 32)"
          session_secret="$(openssl rand -base64 48 | tr -d '\n')"
          echo "::add-mask::$verify_token"
          echo "::add-mask::$session_secret"
          echo "UC_PREVIEW_VERIFY_TOKEN=$verify_token" >> "$GITHUB_ENV"
          url="$(vercel deploy --prebuilt --archive=tgz \
            --env "UC_PREVIEW_DEMO=1" \
            --env "UC_PREVIEW_VERIFY_TOKEN=$verify_token" \
            --env "UC_SESSION_SECRET=$session_secret" \
            --token="$VERCEL_TOKEN" | tail -n 1)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview URL: $url"
          echo "### Isolated scoped-read preview" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify deployed module plans
        shell: bash
        run: |
          set -euo pipefail
          response="$(vercel curl /api/internal/preview-read-plans \
            --deployment "${{ steps.deploy.outputs.url }}" \
            -sS \
            -H "x-uc-preview-verifier: $UC_PREVIEW_VERIFY_TOKEN" \
            --token="$VERCEL_TOKEN")"
          echo "$response" | jq .
          echo "$response" | jq -e '.valid == true and .verificationMode == "isolated-preview-seed"' >/dev/null
      - name: Verify authenticated bootstrap and Tasks flow
        shell: bash
        run: |
          set -euo pipefail
          url="${{ steps.deploy.outputs.url }}"

          signin_status="$(vercel curl /signin \
            --deployment "$url" \
            -sS -o /tmp/signin.html -w '%{http_code}' \
            --token="$VERCEL_TOKEN")"
          test "$signin_status" = "200"
          grep -qi "sign in" /tmp/signin.html

          unauthenticated_status="$(vercel curl /api/bootstrap \
            --deployment "$url" \
            -sS -o /tmp/unauthenticated.json -w '%{http_code}' \
            --token="$VERCEL_TOKEN")"
          test "$unauthenticated_status" = "401"

          session_status="$(vercel curl /api/internal/preview-session \
            --deployment "$url" \
            -sS -X POST -c /tmp/preview.cookies \
            -H "x-uc-preview-verifier: $UC_PREVIEW_VERIFY_TOKEN" \
            -o /tmp/session.json -w '%{http_code}' \
            --token="$VERCEL_TOKEN")"
          test "$session_status" = "200"
          jq -e '.authenticated == true and .next == "/workspace/tasks"' /tmp/session.json >/dev/null

          bootstrap_status="$(vercel curl /api/bootstrap \
            --deployment "$url" \
            -sS -b /tmp/preview.cookies \
            -D /tmp/bootstrap.headers \
            -o /tmp/bootstrap.json -w '%{http_code}' \
            --token="$VERCEL_TOKEN")"
          test "$bootstrap_status" = "200"
          jq -e '.readStrategy == "module-scoped" and (.revision | type == "number")' /tmp/bootstrap.json >/dev/null

          tasks_status="$(vercel curl /api/tasks \
            --deployment "$url" \
            -sS -b /tmp/preview.cookies \
            -H "X-UC-Workspace-Module: tasks" \
            -D /tmp/tasks.headers \
            -o /tmp/tasks.json -w '%{http_code}' \
            --token="$VERCEL_TOKEN")"
          test "$tasks_status" = "200"
          grep -qi '^x-uc-read-strategy: module' /tmp/tasks.headers
          collections="$(awk -F': ' 'tolower($1)=="x-uc-read-collections" {gsub("\r", "", $2); print $2}' /tmp/tasks.headers)"
          scope_collections="$(awk -F': ' 'tolower($1)=="x-uc-read-scope-collections" {gsub("\r", "", $2); print $2}' /tmp/tasks.headers)"
          test -n "$collections"
          test -n "$scope_collections"
          test "$collections" -lt "$scope_collections"

          workspace_status="$(vercel curl /workspace/tasks \
            --deployment "$url" \
            -sS -b /tmp/preview.cookies \
            -o /tmp/workspace.html -w '%{http_code}' \
            --token="$VERCEL_TOKEN")"
          test "$workspace_status" = "200"
          grep -qi "Urban Castle" /tmp/workspace.html
