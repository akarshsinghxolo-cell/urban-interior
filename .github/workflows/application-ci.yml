name: Application CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: application-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Patch consolidation editor
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/remove-legacy-duplicate-paths' && hashFiles('scripts/patch-runtime-contract-consolidation.py') != ''
        run: python scripts/patch-runtime-contract-consolidation.py
      - name: Apply runtime contract consolidation
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/remove-legacy-duplicate-paths' && hashFiles('scripts/apply-runtime-contract-consolidation.py') != ''
        run: python scripts/apply-runtime-contract-consolidation.py
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test (full vitest suite)
        run: npm run test
      - name: Typecheck application
        run: npx tsc --noEmit
      - name: Lint application
        run: npm run lint
      - name: Build application
        run: npm run build
      - name: Install bun (QA mock runtime)
        uses: oven-sh/setup-bun@v2
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run e2e smoke pack (real browser UI flows)
        run: npm run test:e2e
      - name: Upload e2e artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
      - name: Commit verified runtime consolidation
        if: success() && github.event_name == 'pull_request' && github.head_ref == 'agent/remove-legacy-duplicate-paths'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No consolidation changes to commit."
            exit 0
          fi
          git commit -m "Remove legacy runtime contracts and duplicate paths"
          git push origin HEAD:agent/remove-legacy-duplicate-paths