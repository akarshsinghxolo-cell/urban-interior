name: Application CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: application-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Check out Vendor cleanup branch head
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/vendor-module-cleanup-no-legacy'
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Apply Vendor cleanup
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/vendor-module-cleanup-no-legacy'
        run: |
          python scripts/apply-vendor-module-cleanup.py
          python scripts/finalize-vendor-module-cleanup.py
          rm scripts/apply-vendor-module-cleanup.py
          rm scripts/finalize-vendor-module-cleanup.py
          rm scripts/.vendor-cleanup-trigger
          rm .github/workflows/vendor-module-cleanup-runner.yml
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate persisted work catalog convergence
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/supabase-data-convergence'
        run: bun scripts/generate-work-catalog-convergence.ts
      - name: Test Vendor module cleanup
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/vendor-module-cleanup-no-legacy'
        run: bun run test:vendor-module
      - name: Test Phase 2B commit policy
        run: bun run test:phase2b
      - name: Test workspace route registry
        run: bun run test:routing
      - name: Test workspace route adapter
        run: bun run test:route-adapter
      - name: Test core entity routes
        run: bun run test:entity-routes
      - name: Test workspace history URLs
        run: bun run test:history-urls
      - name: Test workspace detail tabs
        run: bun run test:detail-tabs
      - name: Test workspace customer tabs
        run: bun run test:customer-tabs
      - name: Test workspace task scope
        run: bun run test:task-scope
      - name: Test workspace location presentation
        run: bun run test:location-presentation
      - name: Test workspace share links
        run: bun run test:share-links
      - name: Test workspace exit guard
        run: bun run test:exit-guard
      - name: Test dirty form navigation guard
        run: bun run test:dirty-form-guard
      - name: Test module-scoped workspace reads
        run: bun run test:module-scoped-reads
      - name: Test exact module read plans
        run: bun run test:module-read-plans
      - name: Test bootstrap and scoped client reads
        run: bun run test:bootstrap-scoped-flow
      - name: Test entity-scoped workspace reads
        run: bun run test:entity-scoped-reads
      - name: Test workspace revision delta synchronization
        run: bun run test:delta-sync
      - name: Test Supabase persistence convergence
        run: bun test tests/supabase-data-convergence.test.ts
      - name: Test client workspace delta synchronization
        run: bun run test:client-delta-sync
      - name: Test workspace auth return paths
        run: bun run test:auth-return
      - name: Test workspace route access
        run: bun run test:route-access
      - name: Test authentication source security
        run: bun run test:auth-security
      - name: Test runtime efficiency hardening
        run: bun run test:runtime-efficiency
      - name: Test vendor landed-rate averages
        run: bun run test:vendor-rate-average
      - name: Test unified Customer and Sites saves
        run: bun run test:customer-sites-save
      - name: Test legacy Customer and Site path removal
        run: bun run test:customer-sites-legacy
      - name: Test canonical Contractor profile
        run: bun run test:contractor-profile
      - name: Test frontend staff route bundles
        run: bun test tests/staff-route-bundles.test.ts
      - name: Test bug hunt regressions
        run: bun run test:bug-hunt
      - name: Test field staff UI visibility
        run: bun test tests/field-staff-visibility.test.ts
      - name: Lint application
        run: bun run lint 2>&1 | tee supabase-convergence-lint.txt
      - name: Upload lint diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-convergence-lint
          path: supabase-convergence-lint.txt
          if-no-files-found: ignore
      - name: Build application
        run: bun run build 2>&1 | tee supabase-convergence-build.txt
      - name: Upload build diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-convergence-build
          path: supabase-convergence-build.txt
          if-no-files-found: ignore
      - name: Commit verified work catalog convergence
        if: success() && github.event_name == 'pull_request' && github.head_ref == 'agent/supabase-data-convergence'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/rdash/server/commit-rest.ts src/lib/rdash/types.ts supabase/migrations/20260801153000_persist_work_catalog_master.sql
          if git diff --cached --quiet; then
            echo "Generated work catalog outputs are already committed."
            exit 0
          fi
          git commit -m "Persist work catalog as Supabase master data"
          git push origin HEAD:agent/supabase-data-convergence
      - name: Commit verified Vendor cleanup
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/vendor-module-cleanup-no-legacy'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No application changes to commit."
            exit 0
          fi
          git commit -m "Complete Vendor module cleanup and remove legacy compatibility"
          git push origin HEAD:feature/vendor-module-cleanup-no-legacy
