name: Application CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: application-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Check out Vendor cleanup branch head
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/vendor-module-cleanup-no-legacy'
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Check out Customer Roles cleanup branch head
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/remove-customer-roles'
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Apply Vendor cleanup
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/vendor-module-cleanup-no-legacy' && hashFiles('scripts/apply-vendor-module-cleanup.py') != ''
        run: |
          python scripts/apply-vendor-module-cleanup.py
          python scripts/finalize-vendor-module-cleanup.py
          rm scripts/apply-vendor-module-cleanup.py
          rm scripts/finalize-vendor-module-cleanup.py
          rm scripts/.vendor-cleanup-trigger
          rm .github/workflows/vendor-module-cleanup-runner.yml
      - name: Apply final Customer Roles test cleanup
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/remove-customer-roles' && hashFiles('scripts/fix-customer-role-test-indent.py') != ''
        run: |
          python3 scripts/fix-customer-role-test-indent.py
          rm scripts/fix-customer-role-test-indent.py
          git checkout origin/main -- .github/workflows/application-ci.yml
      - name: Install dependencies
        run: npm ci
      - name: Test Vendor module cleanup
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/vendor-module-cleanup-no-legacy'
        run: npm run test:vendor-module
      - name: Test Phase 2B commit policy
        run: npm run test:phase2b
      - name: Test workspace route registry
        run: npm run test:routing
      - name: Test workspace route adapter
        run: npm run test:route-adapter
      - name: Test core entity routes
        run: npm run test:entity-routes
      - name: Test workspace history URLs
        run: npm run test:history-urls
      - name: Test workspace detail tabs
        run: npm run test:detail-tabs
      - name: Test workspace customer tabs
        run: npm run test:customer-tabs
      - name: Test workspace task scope
        run: npm run test:task-scope
      - name: Test workspace location presentation
        run: npm run test:location-presentation
      - name: Test workspace share links
        run: npm run test:share-links
      - name: Test workspace exit guard
        run: npm run test:exit-guard
      - name: Test dirty form navigation guard
        run: npm run test:dirty-form-guard
      - name: Test module-scoped workspace reads
        run: npm run test:module-scoped-reads
      - name: Test Staff data minimization
        run: npx vitest run tests/staff-data-minimization.test.ts
      - name: Test Staff reference integrity
        run: npx vitest run tests/staff-reference-integrity.test.ts
      - name: Test public Google Drive access
        run: npx vitest run tests/google-drive-public-access.test.ts
      - name: Test Google Drive transaction simplification and folder naming
        run: npx vitest run tests/google-drive-transaction-simplification.test.ts tests/google-drive-folder-naming.test.ts
      - name: Test exact module read plans
        run: npm run test:module-read-plans
      - name: Test bootstrap and scoped client reads
        run: npm run test:bootstrap-scoped-flow
      - name: Test workspace navigation freshness
        run: npx vitest run tests/workspace-navigation-revalidation.test.ts
      - name: Test entity-scoped workspace reads
        run: npm run test:entity-scoped-reads
      - name: Test workspace revision delta synchronization
        run: npm run test:delta-sync
      - name: Test Supabase persistence convergence
        run: npx vitest run tests/supabase-data-convergence*.test.ts
      - name: Test client workspace delta synchronization
        run: npm run test:client-delta-sync
      - name: Test workspace auth return paths
        run: npm run test:auth-return
      - name: Test workspace route access
        run: npm run test:route-access
      - name: Test authentication source security
        run: npm run test:auth-security
      - name: Test runtime efficiency hardening
        run: npm run test:runtime-efficiency
      - name: Test vendor landed-rate averages
        run: npm run test:vendor-rate-average
      - name: Test unified Customer and Sites saves
        run: npm run test:customer-sites-save
      - name: Test Sales Pipeline progression
        run: npx vitest run tests/sales-pipeline-progress.test.ts
      - name: Test legacy Customer and Site path removal
        run: npm run test:customer-sites-legacy
      - name: Test canonical Contractor profile
        run: npm run test:contractor-profile
      - name: Test frontend staff route bundles
        run: npx vitest run tests/staff-route-bundles.test.ts
      - name: Test bug hunt regressions
        run: npm run test:bug-hunt
      - name: Test field staff UI visibility
        run: npx vitest run tests/field-staff-visibility.test.ts
      - name: Typecheck application
        run: npx tsc --noEmit
      - name: Lint application
        run: npm run lint
      - name: Build application
        run: npm run build
      - name: Commit verified Vendor cleanup
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/vendor-module-cleanup-no-legacy'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No application changes to commit."
            exit 0
          fi
          git commit -m "Complete Vendor module cleanup and remove legacy compatibility"
          git push origin HEAD:feature/vendor-module-cleanup-no-legacy
      - name: Commit verified final Customer Roles cleanup
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/remove-customer-roles'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No final Customer Roles cleanup to commit."
            exit 0
          fi
          git commit -m "Finish Customer Roles removal audit cleanup"
          git push origin HEAD:agent/remove-customer-roles
