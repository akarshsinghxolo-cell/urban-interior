name: Staff reset compatibility cleanup

on:
  push:
    branches:
      - agent/staff-reference-integrity

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/staff-reference-integrity
      - name: Restore direct reset return
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/lib/rdash/server/workspace.ts")
          text = path.read_text(encoding="utf-8")
          old = '''    await resetWorkspaceChangeJournal();
    const reset = await resetRestWorkspace();
    hydrateStaffReferenceLabels(reset.data);
    return reset;'''
          new = '''    await resetWorkspaceChangeJournal();
    return resetRestWorkspace();'''
          if old not in text:
              raise SystemExit("Expected reset compatibility block not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/rdash/server/workspace.ts
          git commit -m "Preserve workspace reset compatibility"
          git push origin HEAD:agent/staff-reference-integrity
