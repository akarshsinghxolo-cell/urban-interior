name: Apply article vendor-rate average integration

on:
  push:
    branches:
      - feature/article-vendor-average-rates

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/article-vendor-average-rates
          fetch-depth: 0

      - name: Apply integration patch
        shell: python
        run: |
          from pathlib import Path
          import json

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one marker, found {count}: {old[:140]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          # Type contract: preserve the existing JSON storage model while adding
          # the fields required to calculate normalized landed cost.
          replace_once(
              "src/lib/rdash/types.ts",
              'export type VendorRateHistoryStatus = "active" | "superseded" | "rejected";',
              'export type VendorRateStatus = "active" | "inactive" | "expired" | "draft" | "unapproved" | "rejected" | "superseded";\nexport type VendorRateHistoryStatus = VendorRateStatus;',
          )
          replace_once(
              "src/lib/rdash/types.ts",
              '    gst_inclusive?: boolean;\n    preferred?: boolean;',
              '    gst_inclusive?: boolean;\n    gst_rate?: number;\n    discount_pct?: number;\n    discount_amount?: number;\n    freight_amount?: number;\n    loading_unloading_amount?: number;\n    other_charges?: number;\n    /** Number of article-default units represented by one quoted unit. */\n    default_units_per_rate_unit?: number;\n    status?: VendorRateStatus;\n    preferred?: boolean;',
          )
          replace_once(
              "src/lib/rdash/types.ts",
              '    valid_from?: string;\n    updated_at?: string;',
              '    valid_from?: string;\n    valid_until?: string;\n    updated_at?: string;',
          )
          replace_once(
              "src/lib/rdash/types.ts",
              '    old_rate?: number;\n    new_rate: number;\n    source_type: VendorRateSourceType;',
              '    old_rate?: number;\n    new_rate: number;\n    gst_inclusive?: boolean;\n    gst_rate?: number;\n    discount_pct?: number;\n    discount_amount?: number;\n    freight_amount?: number;\n    loading_unloading_amount?: number;\n    other_charges?: number;\n    default_units_per_rate_unit?: number;\n    source_type: VendorRateSourceType;',
          )

          # Preserve the vendor's quoted unit. Previously normalization silently
          # rewrote it to the scoped/default unit, making real conversion impossible.
          replace_once(
              "src/lib/rdash/work-category-master.ts",
              '''        const expectedUnit = variant?.unit_id || map.unit_id;
        return [{
                ...rate,
                article_id: article.id,
                article_name: article.name,
                work_required_article_id: map.id,
                variant_id: variant?.id,
                unit_id: validUnits.has(expectedUnit) ? expectedUnit : map.unit_id,
                updated_at: rate.updated_at || timestamp,
            }];''',
              '''        const fallbackUnit = variant?.unit_id || map.unit_id;
        const quotedUnit = rate.unit_id && validUnits.has(rate.unit_id)
            ? rate.unit_id
            : fallbackUnit;
        return [{
                ...rate,
                article_id: article.id,
                article_name: article.name,
                work_required_article_id: map.id,
                variant_id: variant?.id,
                unit_id: quotedUnit,
                updated_at: rate.updated_at || timestamp,
            }];''',
          )

          # Avoid scanning every rate array on unrelated commits.
          replace_once(
              "src/lib/rdash/vendor-rate-average.ts",
              '''export function applyVendorRateAverages(
  previous: RDashDatabase,
  candidate: RDashDatabase,
  options: { articleIds?: Iterable<string>; at?: Date; updatedAt?: string } = {},
): RDashDatabase {
  const articleIds = options.articleIds''',
              '''export function applyVendorRateAverages(
  previous: RDashDatabase,
  candidate: RDashDatabase,
  options: { articleIds?: Iterable<string>; at?: Date; updatedAt?: string } = {},
): RDashDatabase {
  if (!options.articleIds
    && previous.master.vendorRates === candidate.master.vendorRates
    && previous.master.vendorRateHistories === candidate.master.vendorRateHistories) {
    return candidate;
  }
  const articleIds = options.articleIds''',
          )

          # Central client transaction hook: all manual, PO, bill, import and
          # history mutations go through this path.
          replace_once(
              "src/lib/rdash/store.ts",
              'import { prepareWorkspaceData } from "./work-category-master";',
              'import { prepareWorkspaceData } from "./work-category-master";\nimport { applyVendorRateAverages } from "./vendor-rate-average";',
          )
          replace_once(
              "src/lib/rdash/store.ts",
              '                return { ...next, db: attachCustomerLabels(next.db) };',
              '                const averagedDb = applyVendorRateAverages(state.db, next.db);\n                return { ...next, db: attachCustomerLabels(averagedDb) };',
          )
          replace_once(
              "src/lib/rdash/store.ts",
              '            const db = attachCustomerLabels(next.db);',
              '            const db = attachCustomerLabels(applyVendorRateAverages(state.db, next.db));',
          )

          # Full-read compatibility commits are canonicalized server-side too,
          # so a stale or modified browser cannot persist a different average.
          replace_once(
              "src/lib/rdash/server/authorized-commit.ts",
              '''  applyWorkspaceOperations,
  operationSummary,''',
              '''  applyWorkspaceOperations,
  diffWorkspaceOperations,
  operationSummary,''',
          )
          replace_once(
              "src/lib/rdash/server/authorized-commit.ts",
              'import { prepareTargetedCommit } from "./targeted-commit";',
              'import { prepareTargetedCommit } from "./targeted-commit";\nimport { applyVendorRateAverages } from "../vendor-rate-average";',
          )
          replace_once(
              "src/lib/rdash/server/authorized-commit.ts",
              '''function normalizeWorkspace(data: RDashDatabase) {
  return attachCustomerLabels(prepareWorkspaceData(repairOperationalWorkspace(data)));
}
''',
              '''function normalizeWorkspace(data: RDashDatabase) {
  return attachCustomerLabels(prepareWorkspaceData(repairOperationalWorkspace(data)));
}

function canonicalizeVendorRateOperations(
  current: RDashDatabase,
  operations: WorkspaceOperation[],
): WorkspaceOperation[] {
  if (!operations.some((operation) => ["master.vendorRates", "master.vendorRateHistories"].includes(operation.collection))) {
    return operations;
  }
  const candidate = applyWorkspaceOperations(current, operations);
  const canonical = applyVendorRateAverages(current, candidate);
  return diffWorkspaceOperations(current, canonical);
}
''',
          )
          replace_once(
              "src/lib/rdash/server/authorized-commit.ts",
              '''    assertWorkspaceMutationAllowed(user, commitOperations, current.data);
    const candidate = normalizeWorkspace(applyWorkspaceOperations(current.data, commitOperations));''',
              '''    assertWorkspaceMutationAllowed(user, commitOperations, current.data);
    commitOperations = canonicalizeVendorRateOperations(current.data, commitOperations);
    const candidate = normalizeWorkspace(applyWorkspaceOperations(current.data, commitOperations));''',
          )

          # Targeted commit support for vendor rate upserts and deletes.
          replace_once(
              "src/lib/rdash/server/targeted-commit.ts",
              'import { applyWorkspaceOperations, type WorkspaceOperation } from "../workspace-operations";',
              'import { applyWorkspaceOperations, diffWorkspaceOperations, type WorkspaceOperation } from "../workspace-operations";\nimport { applyVendorRateAverages } from "../vendor-rate-average";',
          )
          targeted_path = Path("src/lib/rdash/server/targeted-commit.ts")
          targeted = targeted_path.read_text(encoding="utf-8")
          old_target_set = 'const TARGETED_COLLECTIONS = new Set(["tasks", "followups", "visits", "threads", "auditLog", "master.units", "master.workCategories", "master.workSubcategories", "master.articles", "master.articleVariants", "master.subcategoryArticleMap", "master.workOptionGroups", "master.workOptionValues"]);'
          new_target_set = '''const VENDOR_RATE_COLLECTIONS = new Set(["master.vendorRates", "master.vendorRateHistories"]);
const TARGETED_COLLECTIONS = new Set([
  "tasks", "followups", "visits", "threads", "auditLog",
  "master.units", "master.workCategories", "master.workSubcategories",
  "master.articles", "master.articleVariants", "master.subcategoryArticleMap",
  "master.workOptionGroups", "master.workOptionValues",
  ...VENDOR_RATE_COLLECTIONS,
]);'''
          if targeted.count(old_target_set) != 1:
              raise SystemExit("targeted collection marker mismatch")
          targeted = targeted.replace(old_target_set, new_target_set, 1)
          old_deps = '''  } else if (collection === "master.workOptionValues") {
    addId(plan, "master.workOptionGroups", row.group_id || row.option_group_id);
  }
'''
          new_deps = '''  } else if (collection === "master.workOptionValues") {
    addId(plan, "master.workOptionGroups", row.group_id || row.option_group_id);
  } else if (collection === "master.vendorRates" || collection === "master.vendorRateHistories") {
    addId(plan, "master.vendors", row.vendor_id);
    addId(plan, "master.articles", row.article_id);
    addId(plan, "master.units", row.unit_id);
    addId(plan, "master.subcategoryArticleMap", row.work_required_article_id);
    addId(plan, "master.articleVariants", row.variant_id);
  }
'''
          if targeted.count(old_deps) != 1:
              raise SystemExit("targeted dependency marker mismatch")
          targeted = targeted.replace(old_deps, new_deps, 1)
          old_eligibility = '''    if (!TARGETED_COLLECTIONS.has(operation.collection)) return false;
    if (operation.deleteIds?.length) return false;

    const upserts = operation.upsert || [];
    rowCount += upserts.length;
    if (operation.collection !== "auditLog" && upserts.length) {
      hasBusinessMutation = true;
    }
'''
          new_eligibility = '''    if (!TARGETED_COLLECTIONS.has(operation.collection)) return false;
    const deletes = operation.deleteIds || [];
    if (deletes.length && !VENDOR_RATE_COLLECTIONS.has(operation.collection)) return false;

    const upserts = operation.upsert || [];
    rowCount += upserts.length + deletes.length;
    if (operation.collection !== "auditLog" && (upserts.length || deletes.length)) {
      hasBusinessMutation = true;
    }
'''
          if targeted.count(old_eligibility) != 1:
              raise SystemExit("targeted eligibility marker mismatch")
          targeted = targeted.replace(old_eligibility, new_eligibility, 1)
          old_initial = '''function initialReadPlan(user: AuthenticatedUser, operations: WorkspaceOperation[]): MutableReadPlan {
  const plan = emptyPlan();
  if (user.role !== "Owner") addFullCollection(plan, "staffRolePermissions");
  if (user.staffId) addId(plan, "master.staff", user.staffId);

  for (const operation of operations) {
    for (const row of operation.upsert || []) {
      addId(plan, operation.collection, row.id);
      collectDirectDependencies(plan, operation.collection, row);
    }
  }
  return plan;
}'''
          new_initial = '''function initialReadPlan(user: AuthenticatedUser, operations: WorkspaceOperation[]): MutableReadPlan {
  const plan = emptyPlan();
  if (user.role !== "Owner") addFullCollection(plan, "staffRolePermissions");
  if (user.staffId) addId(plan, "master.staff", user.staffId);

  const hasVendorRateMutation = operations.some((operation) => VENDOR_RATE_COLLECTIONS.has(operation.collection));
  if (hasVendorRateMutation) {
    for (const collection of [
      "master.vendorRates", "master.vendorRateHistories", "master.subcategoryArticleMap",
      "master.units", "master.articleVariants", "master.vendors", "taxConfigs",
    ]) addFullCollection(plan, collection);
  }

  for (const operation of operations) {
    for (const row of operation.upsert || []) {
      addId(plan, operation.collection, row.id);
      collectDirectDependencies(plan, operation.collection, row);
    }
    for (const id of operation.deleteIds || []) addId(plan, operation.collection, id);
  }
  return plan;
}'''
          if targeted.count(old_initial) != 1:
              raise SystemExit("targeted initial plan marker mismatch")
          targeted = targeted.replace(old_initial, new_initial, 1)
          old_collections = '''    "master.units", "master.workCategories", "master.workSubcategories", "master.articles",
    "master.articleVariants", "master.subcategoryArticleMap", "master.workOptionGroups", "master.workOptionValues",
  ];'''
          new_collections = '''    "taxConfigs", "master.units", "master.workCategories", "master.workSubcategories", "master.articles",
    "master.articleVariants", "master.subcategoryArticleMap", "master.workOptionGroups", "master.workOptionValues",
    "master.vendors", "master.vendorRates", "master.vendorRateHistories",
  ];'''
          if targeted.count(old_collections) != 1:
              raise SystemExit("targeted dependency collection marker mismatch")
          targeted = targeted.replace(old_collections, new_collections, 1)
          old_plan = '''  return {
    fullCollections: [...plan.fullCollections],
    rowsByCollection: Object.fromEntries(
      [...plan.rowsByCollection.entries()].map(([collection, ids]) => [collection, [...ids]]),
    ),
  };'''
          new_plan = '''  return {
    fullCollections: [...plan.fullCollections],
    rowsByCollection: Object.fromEntries(
      [...plan.rowsByCollection.entries()].map(([collection, ids]) => [collection, [...ids]]),
    ),
    limitsByCollection: { "master.vendorRateHistories": 5000 },
  };'''
          if targeted.count(old_plan) != 1:
              raise SystemExit("targeted read plan marker mismatch")
          targeted = targeted.replace(old_plan, new_plan, 1)
          old_validation = '''          } else if (operation.collection === "master.subcategoryArticleMap") {
            if (!exists("master.workSubcategories", row.work_required_id)) throw new Error("Scoped material sub-category does not exist.");
            if (!exists("master.articles", row.article_id)) throw new Error("Scoped material article does not exist.");
            if (!exists("master.units", row.unit_id)) throw new Error("Scoped material unit does not exist.");
          }
'''
          new_validation = '''          } else if (operation.collection === "master.subcategoryArticleMap") {
            if (!exists("master.workSubcategories", row.work_required_id)) throw new Error("Scoped material sub-category does not exist.");
            if (!exists("master.articles", row.article_id)) throw new Error("Scoped material article does not exist.");
            if (!exists("master.units", row.unit_id)) throw new Error("Scoped material unit does not exist.");
          } else if (operation.collection === "master.vendorRates" || operation.collection === "master.vendorRateHistories") {
            if (!exists("master.vendors", row.vendor_id)) throw new Error("Vendor rate vendor does not exist.");
            if (!exists("master.articles", row.article_id)) throw new Error("Vendor rate article does not exist.");
            if (!exists("master.units", row.unit_id)) throw new Error("Vendor rate unit does not exist.");
            if (!exists("master.subcategoryArticleMap", row.work_required_article_id)) throw new Error("Vendor rate scoped material does not exist.");
            if (!exists("master.articleVariants", row.variant_id)) throw new Error("Vendor rate variant does not exist.");
            const amount = Number(operation.collection === "master.vendorRates" ? row.rate : row.new_rate);
            if (!Number.isFinite(amount) || amount < 0) throw new Error("Vendor rate amount must be a non-negative number.");
            if (row.default_units_per_rate_unit != null && (!Number.isFinite(Number(row.default_units_per_rate_unit)) || Number(row.default_units_per_rate_unit) <= 0)) {
              throw new Error("Vendor rate unit conversion factor must be greater than zero.");
            }
          }
'''
          if targeted.count(old_validation) != 1:
              raise SystemExit("targeted validation marker mismatch")
          targeted = targeted.replace(old_validation, new_validation, 1)
          old_final = '''  assertWorkspaceMutationAllowed(user, operations, current.data);
  const candidate = applyWorkspaceOperations(current.data, operations);
  validateTouchedRows(candidate, operations);
  const validatedAt = Date.now();

  return {
    current,
    operations,'''
          new_final = '''  assertWorkspaceMutationAllowed(user, operations, current.data);
  const rawCandidate = applyWorkspaceOperations(current.data, operations);
  const canonicalCandidate = applyVendorRateAverages(current.data, rawCandidate);
  const preparedOperations = diffWorkspaceOperations(current.data, canonicalCandidate);
  validateTouchedRows(canonicalCandidate, preparedOperations);
  const validatedAt = Date.now();

  return {
    current,
    operations: preparedOperations,'''
          if targeted.count(old_final) != 1:
              raise SystemExit("targeted final marker mismatch")
          targeted = targeted.replace(old_final, new_final, 1)
          targeted_path.write_text(targeted, encoding="utf-8")

          # Rate Finder needs tax configuration to turn exclusive quote rates
          # into landed rates.
          replace_once(
              "src/lib/rdash/server/module-scoped-collections.ts",
              '''  "threads",
  "entityFileAttachments",
  "auditLog",
  "master.units",''',
              '''  "threads",
  "entityFileAttachments",
  "taxConfigs",
  "auditLog",
  "master.units",''',
          )

          # Replace Rate Finder's per-scope/raw-rate logic with one row per
          # article/vendor using the selected normalized landed rate.
          rate_path = Path("src/components/rdash/modules/RateFinderModule.tsx")
          current_rate_source = rate_path.read_text(encoding="utf-8")
          marker = '// H: "Use in quotation" dialog — pick a draft quotation + line and apply the vendor rate.'
          if current_rate_source.count(marker) != 1:
              raise SystemExit("Rate Finder tail marker mismatch")
          tail = marker + current_rate_source.split(marker, 1)[1]
          tail = tail.replace('formatINR(rate.vendorRate)', 'formatRateWithUnit(rate.vendorRate, rate.unitName)')
          new_top = '''"use client";
import * as React from "react";
import { cn } from "@/lib/utils";
import { useRDashStore } from "@/lib/rdash/store";
import { MetricCard } from "../primitives";
import { formatINR } from "@/lib/rdash/format";
import {
    articleVendorRateAverage,
    formatRateWithUnit,
} from "@/lib/rdash/vendor-rate-average";
import { ArticleVendorAssetLinks } from "../OperationalMediaPanel";
import { Search, Package, Building2, TrendingUp, TrendingDown, Star, ArrowRight } from "lucide-react";
import { Button } from "@/components/ui/button";
import { Dialog, DialogContent, DialogDescription, DialogFooter, DialogHeader, DialogTitle } from "@/components/ui/dialog";
import { toast } from "sonner";
import type { QuotationItem } from "@/lib/rdash/types";

interface RateRow {
    id: string;
    vendorRateId?: string;
    articleId?: string;
    vendorId?: string;
    variantId?: string;
    articleName: string;
    categoryName?: string;
    workRequiredName?: string;
    unitName?: string;
    baseRate?: number;
    vendorName: string;
    hasVendorRate: boolean;
    vendorCity?: string;
    vendorRate: number;
    rawRate?: number;
    rawUnitName?: string;
    rateSourceLabel?: string;
    conversionError?: string;
    diffFromBase?: number;
    diffPct?: number;
    reliability?: number;
    onTimePct?: number;
}

function percentage(value: number): string {
    return new Intl.NumberFormat("en-IN", { maximumFractionDigits: 2 }).format(value);
}

export function RateFinderModule() {
    const db = useRDashStore((s) => s.db);
    const openDetail = useRDashStore((s) => s.openDetail);
    const updateQuotation = useRDashStore((s) => s.updateQuotation);
    const setActiveModule = useRDashStore((s) => s.setActiveModule);
    const logAudit = useRDashStore((s) => s.logAudit);
    const currentUser = useRDashStore((s) => s.currentUser);
    const [q, setQ] = React.useState("");
    const [categoryFilter, setCategoryFilter] = React.useState<string>("all");
    const [sortBy, setSortBy] = React.useState<"rate" | "reliability" | "diff">("rate");
    const [useInQuotation, setUseInQuotation] = React.useState<RateRow | null>(null);

    const rows: RateRow[] = React.useMemo(() => {
        const out: RateRow[] = [];
        const unitById = new Map(db.master.units.map((unit) => [unit.id, unit]));
        const workById = new Map(db.master.workSubcategories.map((work) => [work.id, work]));
        const categoryById = new Map(db.master.workCategories.map((category) => [category.id, category]));

        for (const article of db.master.articles) {
            const scopes = db.master.subcategoryArticleMap.filter((scope) => scope.article_id === article.id);
            const scope = scopes[0];
            const work = scope ? workById.get(scope.work_required_id) : undefined;
            const category = work
                ? categoryById.get(work.category_id)
                : article.category_id
                    ? categoryById.get(article.category_id)
                    : undefined;
            const defaultUnitId = article.default_unit_id || article.unit_id || scope?.unit_id;
            const defaultUnit = unitById.get(defaultUnitId || "")?.symbol || defaultUnitId || "unit";
            const baseRate = article.base_rate ?? scope?.reference_rate;
            const summary = articleVendorRateAverage(db, article.id);

            if (!summary.selected.length) {
                out.push({
                    id: `base-${article.id}`,
                    articleId: article.id,
                    articleName: article.name,
                    categoryName: category?.name,
                    workRequiredName: scopes.length > 1 ? `${scopes.length} sub categories` : work?.name,
                    unitName: defaultUnit,
                    baseRate,
                    vendorName: "— No vendor price",
                    vendorRate: Number.NaN,
                    hasVendorRate: false,
                });
                continue;
            }

            for (const selected of summary.selected) {
                const vendor = db.master.vendors.find((entry) => entry.id === selected.vendorId);
                const vendorRate = selected.normalizedLandedRate ?? Number.NaN;
                const diff = baseRate != null && Number.isFinite(vendorRate) ? vendorRate - baseRate : undefined;
                const diffPct = baseRate && diff != null ? (diff / baseRate) * 100 : undefined;
                const rawUnit = unitById.get(selected.rawUnitId || "")?.symbol || selected.rawUnitId || defaultUnit;
                out.push({
                    id: `${article.id}:${selected.vendorId}`,
                    vendorRateId: selected.vendorRateId,
                    articleId: article.id,
                    vendorId: selected.vendorId,
                    variantId: selected.variantId,
                    articleName: article.name,
                    categoryName: category?.name,
                    workRequiredName: scopes.length > 1 ? `${scopes.length} sub categories` : work?.name,
                    unitName: defaultUnit,
                    baseRate,
                    vendorName: vendor?.name || "Unknown vendor",
                    vendorCity: vendor?.city,
                    vendorRate,
                    rawRate: selected.rawRate,
                    rawUnitName: rawUnit,
                    rateSourceLabel: selected.active ? "Latest active" : "Latest available fallback",
                    conversionError: selected.conversionError,
                    diffFromBase: diff,
                    diffPct,
                    reliability: vendor?.reliability_score,
                    onTimePct: vendor?.on_time_pct,
                    hasVendorRate: true,
                });
            }
        }
        return out;
    }, [db]);

    const filtered = React.useMemo(() => {
        let list = rows;
        if (categoryFilter !== "all") list = list.filter((row) => row.categoryName === categoryFilter);
        if (q.trim()) {
            const query = q.toLowerCase();
            list = list.filter((row) => row.articleName.toLowerCase().includes(query)
                || row.vendorName.toLowerCase().includes(query)
                || (row.categoryName || "").toLowerCase().includes(query));
        }
        return [...list].sort((left, right) => {
            if (sortBy === "rate") {
                const leftRate = Number.isFinite(left.vendorRate) ? left.vendorRate : Number.POSITIVE_INFINITY;
                const rightRate = Number.isFinite(right.vendorRate) ? right.vendorRate : Number.POSITIVE_INFINITY;
                return leftRate - rightRate;
            }
            if (sortBy === "reliability") return (right.reliability || 0) - (left.reliability || 0);
            return (left.diffPct ?? Number.POSITIVE_INFINITY) - (right.diffPct ?? Number.POSITIVE_INFINITY);
        });
    }, [rows, q, categoryFilter, sortBy]);

    const categories = Array.from(new Set(rows.map((row) => row.categoryName).filter(Boolean))) as string[];
    const vendorRows = rows.filter((row) => row.hasVendorRate && Number.isFinite(row.vendorRate));
    const filteredVendorRows = filtered.filter((row) => row.hasVendorRate && Number.isFinite(row.vendorRate));
    const avgRate = vendorRows.length ? vendorRows.reduce((sum, row) => sum + row.vendorRate, 0) / vendorRows.length : 0;
    const bestRate = filteredVendorRows.length ? Math.min(...filteredVendorRows.map((row) => row.vendorRate)) : undefined;
    const bestSavings = filteredVendorRows.length ? filteredVendorRows.reduce((best, row) => {
        if (row.diffPct != null && row.diffPct < (best?.diffPct ?? 0)) return row;
        return best;
    }, filteredVendorRows[0]) : null;

    return (<div className="flex flex-col gap-5">
      <div className="flex flex-wrap items-start justify-between gap-3">
        <div className="flex items-center gap-2.5">
          <span className="flex h-9 w-9 items-center justify-center rounded-lg bg-primary/10 text-primary"><Search className="h-5 w-5"/></span>
          <div>
            <h2 className="text-lg font-bold tracking-tight">Rate Finder</h2>
            <p className="text-xs text-muted-foreground">One landed rate per vendor, normalized to each article's default unit</p>
          </div>
        </div>
      </div>

      <div className="grid grid-cols-2 gap-3 sm:grid-cols-4">
        <MetricCard label="Vendor prices" value={vendorRows.length} tone="primary" icon={<Package className="h-4 w-4"/>}/>
        <MetricCard label="Articles" value={db.master.articles.length} tone="default" icon={<Package className="h-4 w-4"/>}/>
        <MetricCard label="Vendors" value={db.master.vendors.length} tone="default" icon={<Building2 className="h-4 w-4"/>}/>
        <MetricCard label="Avg landed rate" value={formatRateWithUnit(avgRate)} tone="success" icon={<TrendingUp className="h-4 w-4"/>}/>
      </div>

      <div className="flex flex-wrap items-center gap-2">
        <div className="relative w-64 max-w-full">
          <Search className="absolute left-2.5 top-1/2 h-4 w-4 -translate-y-1/2 text-muted-foreground"/>
          <input value={q} onChange={(event) => setQ(event.target.value)} placeholder="Search article, vendor, category…" className="h-9 w-full rounded-md border border-input bg-card pl-8 pr-3 text-sm outline-none ring-ring placeholder:text-muted-foreground focus-visible:ring-2"/>
        </div>
        <select value={categoryFilter} onChange={(event) => setCategoryFilter(event.target.value)} className="h-9 rounded-md border border-input bg-card px-2 text-sm">
          <option value="all">All categories</option>
          {categories.map((category) => <option key={category} value={category}>{category}</option>)}
        </select>
        <select value={sortBy} onChange={(event) => setSortBy(event.target.value as typeof sortBy)} className="h-9 rounded-md border border-input bg-card px-2 text-sm">
          <option value="rate">Sort: Lowest landed rate</option>
          <option value="reliability">Sort: Best reliability</option>
          <option value="diff">Sort: Biggest savings</option>
        </select>
        <span className="ml-auto text-xs text-muted-foreground">{filtered.length} article/vendor rows</span>
      </div>

      {bestSavings && bestSavings.diffPct != null && bestSavings.diffPct < 0 && (<div className="rounded-[var(--panel-radius)] border border-success/25 bg-success/[0.06] p-3">
          <div className="flex items-center gap-2">
            <TrendingDown className="h-4 w-4 text-success"/>
            <p className="text-sm font-semibold text-success">Best saving: {bestSavings.articleName} from {bestSavings.vendorName} — {percentage(Math.abs(bestSavings.diffPct))}% below base rate (saves {formatRateWithUnit(Math.abs(bestSavings.diffFromBase || 0), bestSavings.unitName)})</p>
          </div>
        </div>)}

      <div className="overflow-hidden rounded-[var(--panel-radius)] border border-border bg-card shadow-card">
        <div className="grid grid-cols-[1.4fr_1fr_0.8fr_0.8fr_0.6fr_0.6fr_0.7fr] gap-2 border-b border-border bg-muted/50 px-3 py-2 text-[10px] font-bold uppercase tracking-wider text-muted-foreground">
          <span>Article</span><span>Vendor</span><span className="text-right">Base rate</span><span className="text-right">Vendor landed rate</span><span className="text-center">Diff</span><span className="text-center">Reliability</span><span className="text-center">Use</span>
        </div>
        {filtered.length === 0 ? (<div className="px-3 py-8 text-center text-xs text-muted-foreground">No rates found. Try a different search.</div>) : filtered.map((row) => {
            const usable = row.hasVendorRate && Number.isFinite(row.vendorRate);
            const isBest = usable && row.vendorRate === bestRate;
            const canOpen = Boolean(row.vendorRateId);
            return (<div key={row.id} role={canOpen ? "button" : undefined} tabIndex={canOpen ? 0 : undefined} onClick={() => { if (row.vendorRateId) openDetail("vendorRate" as any, row.vendorRateId); }} onKeyDown={(event) => { if (row.vendorRateId && (event.key === "Enter" || event.key === " ")) { event.preventDefault(); openDetail("vendorRate" as any, row.vendorRateId); } }} className={cn("grid w-full grid-cols-[1.4fr_1fr_0.8fr_0.8fr_0.6fr_0.6fr_0.7fr] items-center gap-2 border-b border-border px-3 py-2.5 text-left text-xs last:border-0", canOpen && "hover:bg-accent/30", isBest && "bg-success/[0.04]")}>
              <div className="min-w-0"><p className="truncate font-medium text-foreground">{row.articleName}</p><p className="text-[10px] text-muted-foreground">{row.categoryName}{row.workRequiredName ? ` · ${row.workRequiredName}` : ""} · default {row.unitName || "unit"}</p>{row.articleId ? <div className="mt-1"><ArticleVendorAssetLinks articleId={row.articleId} vendorId={row.vendorId} variantId={row.variantId} title="Catalogues"/></div> : null}</div>
              <div className="min-w-0"><p className="truncate font-medium">{row.vendorName}</p><p className="text-[10px] text-muted-foreground">{row.vendorCity || row.rateSourceLabel || ""}</p>{row.rawRate != null ? <p className="text-[10px] text-muted-foreground">Quoted {formatRateWithUnit(row.rawRate, row.rawUnitName)} · {row.rateSourceLabel}</p> : null}</div>
              <span className="text-right font-mono text-muted-foreground">{formatRateWithUnit(row.baseRate, row.unitName)}</span>
              <span className={cn("text-right font-mono font-semibold", isBest ? "text-success" : "text-foreground", row.conversionError && "text-warning")} title={row.conversionError}>{usable ? formatRateWithUnit(row.vendorRate, row.unitName) : row.conversionError ? "Conversion required" : "—"}</span>
              <span className="text-center">{row.diffPct != null ? <span className={cn("inline-flex items-center gap-0.5 rounded-full px-1.5 py-0.5 text-[10px] font-semibold", row.diffPct < 0 ? "bg-success/10 text-success" : row.diffPct > 0 ? "bg-destructive/10 text-destructive" : "bg-muted text-muted-foreground")}>{row.diffPct < 0 ? <TrendingDown className="h-2.5 w-2.5"/> : row.diffPct > 0 ? <TrendingUp className="h-2.5 w-2.5"/> : null}{row.diffPct > 0 ? "+" : ""}{percentage(row.diffPct)}%</span> : "—"}</span>
              <span className="text-center">{row.reliability != null ? <span className={cn("inline-flex items-center gap-0.5 rounded-full px-1.5 py-0.5 text-[10px] font-semibold", row.reliability >= 85 ? "bg-success/10 text-success" : row.reliability >= 70 ? "bg-warning/10 text-warning" : "bg-destructive/10 text-destructive")}><Star className="h-2.5 w-2.5"/>{row.reliability}</span> : "—"}</span>
              <span className="text-center">{usable ? <Button size="sm" variant="outline" className="h-7 text-[10px]" onClick={(event) => { event.stopPropagation(); setUseInQuotation(row); }}><ArrowRight className="mr-1 h-3 w-3"/> Use in quote</Button> : <span className="text-[10px] text-muted-foreground/60">—</span>}</span>
            </div>);
        })}
      </div>

      {filtered.length > 0 && <p className="text-[11px] text-muted-foreground">Base rate is the exact simple average of one selected landed rate per vendor. The latest active rate is preferred; otherwise that vendor's latest available rate is used.</p>}

      {useInQuotation && <UseInQuotationDialog rate={useInQuotation} db={db} onClose={() => setUseInQuotation(null)} onApply={(quotationId, lineId, newRate) => {
          const quotation = db.quotations.find((entry) => entry.id === quotationId);
          if (!quotation) return toast.error("Quotation not found.");
          const line = quotation.scope_lines.find((entry) => entry.id === lineId);
          if (!line) return toast.error("Select a valid quotation line.");
          const nextLines: QuotationItem[] = quotation.scope_lines.map((entry) => entry.id === lineId ? { ...entry, rate: newRate, amount: entry.quantity * newRate } : entry);
          try {
              updateQuotation(quotationId, { scope_lines: nextLines, items: nextLines });
              const actor = currentUser();
              logAudit({ actor: actor.name, actor_role: actor.role, action: `Rate Finder: applied ${useInQuotation.vendorName} landed rate ${formatRateWithUnit(newRate, useInQuotation.unitName)} to line "${line.title}" on ${quotation.quotation_no}`, entity_type: "quotation", entity_id: quotationId, entity_label: quotation.quotation_no, kind: "update", source_module: "rateFinder", changes: [{ id: `ch-${Date.now()}`, field: "rate", before: line.rate, after: newRate }] });
              toast.success(`Rate applied to ${quotation.quotation_no} → ${line.title}`);
              setUseInQuotation(null);
          } catch (error) { toast.error(error instanceof Error ? error.message : "Could not apply rate"); }
      }} onOpenQuotations={() => { setUseInQuotation(null); setActiveModule("quotations"); }}/>} 
    </div>);
}

'''
          rate_path.write_text(new_top + tail, encoding="utf-8")

          # Add test scripts to required CI.
          package_path = Path("package.json")
          package = json.loads(package_path.read_text(encoding="utf-8"))
          package["scripts"]["test:vendor-rate-average"] = "bun test tests/vendor-rate-average.test.ts"
          package_path.write_text(json.dumps(package, indent=2) + "\n", encoding="utf-8")
          replace_once(
              ".github/workflows/application-ci.yml",
              '''      - name: Test runtime efficiency hardening
        run: bun run test:runtime-efficiency
      - name: Build application''',
              '''      - name: Test runtime efficiency hardening
        run: bun run test:runtime-efficiency
      - name: Test vendor landed-rate averages
        run: bun run test:vendor-rate-average
      - name: Build application''',
          )

          # Extend Phase 2B regression coverage for rate deletes while retaining
          # the existing rejection of operational deletes.
          replace_once(
              "tests/phase2b-targeted-commit.test.ts",
              '''  test("rejects deletes", () => {
    expect(canUseTargetedCommit([
      operation("tasks", [], ["task-1"]),
    ])).toBe(false);
  });
''',
              '''  test("rejects operational deletes", () => {
    expect(canUseTargetedCommit([
      operation("tasks", [], ["task-1"]),
    ])).toBe(false);
  });

  test("accepts vendor-rate deletes with their derived article updates", () => {
    expect(canUseTargetedCommit([
      operation("master.vendorRates", [], ["vendor-rate-1"]),
      operation("master.articles", [{ id: "article-1", name: "Article", base_rate: 125 }]),
      operation("master.subcategoryArticleMap", [{ id: "scope-1", article_id: "article-1", reference_rate: 125 }]),
    ])).toBe(true);
  });
''',
          )

          Path(".github/workflows/tmp-article-vendor-average.yml").unlink(missing_ok=True)
          Path(".article-vendor-average-trigger").unlink(missing_ok=True)

      - name: Install and run focused tests
        run: |
          bun install --frozen-lockfile
          bun run test:vendor-rate-average
          bun run test:phase2b

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
