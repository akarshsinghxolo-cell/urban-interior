name: Convergence Build Diagnostic

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/supabase-data-convergence'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Apply current Contractor hydration patch
        run: python scripts/patch-contractor-form-lint.py
      - name: Capture production build
        id: build
        shell: bash
        run: |
          set -o pipefail
          bun run build 2>&1 | tee convergence-build.log
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: convergence-build-log
          path: convergence-build.log
