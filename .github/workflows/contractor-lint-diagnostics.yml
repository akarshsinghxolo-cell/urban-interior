name: Contractor lint diagnostics

on:
  push:
    branches:
      - agent/contractor-profile-unification
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/contractor-profile-unification
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Capture lint output exactly
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          files = [
            'src/components/rdash/ContractorFormDialog.tsx',
            'src/components/rdash/PartnerFormDialog.tsx',
            'src/components/rdash/modules/Partner360Module.tsx',
            'src/lib/rdash/contractor-profile.ts',
            'src/lib/rdash/contractor-store-policy.ts',
            'src/lib/rdash/partner-form-store-bridge.ts',
            'src/lib/rdash/store.ts',
            'src/lib/rdash/types.ts',
            'tests/contractor-profile.test.ts',
            'tests/customer-sites-legacy-removal.test.ts',
          ]
          out = []
          for path in files:
              p = subprocess.run(['bunx','eslint',path], text=True, capture_output=True)
              out.append(f'=== {path} EXIT {p.returncode} ===\n{p.stdout}\n{p.stderr}\n')
          Path('contractor-lint-diagnostics.txt').write_text('\n'.join(out))
          PY
      - name: Publish diagnostics and remove workflow
        run: |
          rm .github/workflows/contractor-lint-diagnostics.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Capture exact Contractor lint errors"
          git push origin HEAD:agent/contractor-profile-unification
