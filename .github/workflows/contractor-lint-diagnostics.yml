name: Contractor lint diagnostics

on:
  push:
    branches:
      - agent/contractor-profile-unification
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contractor-lint-diagnostics
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/contractor-profile-unification
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Capture lint diagnostics
        run: |
          set +e
          bun run lint > contractor-lint-diagnostics.txt 2>&1
          status=$?
          echo "ESLINT_EXIT_CODE=$status" >> contractor-lint-diagnostics.txt
          exit 0
      - name: Publish diagnostics and remove workflow
        run: |
          rm .github/workflows/contractor-lint-diagnostics.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Capture Contractor lint diagnostics"
          git push origin HEAD:agent/contractor-profile-unification
