name: Vendor Cleanup PR Runner

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.head_ref == 'feature/vendor-module-cleanup-no-legacy'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Apply Vendor cleanup
        run: |
          python scripts/apply-vendor-module-cleanup.py
          python - <<'PY'
          from pathlib import Path

          test_path = Path('tests/vendor-module-consistency.test.ts')
          lines = test_path.read_text().splitlines()
          lines = ['  expect(procurement.includes(\'status: v.status || "active"\')).toBe(true);' if 'procurement.includes' in line and 'status: v.status' in line else line for line in lines]
          test_path.write_text('\n'.join(lines) + '\n')

          helper_path = Path('src/lib/rdash/partner-form-consistency.ts')
          helper_lines = helper_path.read_text().splitlines()
          start = helper_lines.index('function normalizedVendorName(value: unknown): string {')
          end = start + 1
          while helper_lines[end] != '}':
              end += 1
          helper_lines[start:end + 1] = [
              'function normalizedVendorName(value: unknown): string {',
              '  return String(value || "")',
              '    .normalize("NFKC")',
              '    .toLowerCase()',
              '    .replace(/[^a-z0-9]+/g, "");',
              '}',
          ]
          helper_path.write_text('\n'.join(helper_lines) + '\n')

          unified_path = Path('src/components/rdash/UnifiedPartnerFormDialog.tsx')
          unified = unified_path.read_text()
          old_deps = '  }, [db, referralQuery]);'
          new_deps = '  }, [db.master.sourcePartners, db.master.vendors, db.master.contractors, referralQuery]);'
          if old_deps not in unified:
              raise SystemExit('Unified referral memo dependency marker not found')
          unified_path.write_text(unified.replace(old_deps, new_deps, 1))

          partner_path = Path('src/components/rdash/modules/Partner360Module.tsx')
          partner = partner_path.read_text()
          marker = '  const baselineRef = React.useRef<Record<string, any>>({});\n'
          if marker not in partner:
              raise SystemExit('Business baseline marker not found')
          partner = partner.replace(marker, marker + '  const baselineDraftRef = React.useRef<Record<string, any>>({});\n', 1)
          callback_start = '  const payloadFromDraft = React.useCallback((value: Record<string, any>) => {'
          if callback_start not in partner:
              raise SystemExit('Business payload callback marker not found')
          partner = partner.replace(callback_start, '  function payloadFromDraft(value: Record<string, any>) {', 1)
          callback_end = '  }, [mode]);'
          callback_pos = partner.find('  function payloadFromDraft(value: Record<string, any>) {')
          end_pos = partner.find(callback_end, callback_pos)
          if end_pos < 0:
              raise SystemExit('Business payload callback end marker not found')
          partner = partner[:end_pos] + '  }' + partner[end_pos + len(callback_end):]
          initial_marker = '    setDraft(initial);\n    baselineRef.current = payloadFromDraft(initial);'
          if initial_marker not in partner:
              raise SystemExit('Business initial baseline marker not found')
          partner = partner.replace(initial_marker, '    setDraft(initial);\n    baselineDraftRef.current = initial;\n    baselineRef.current = payloadFromDraft(initial);', 1)
          old_effect_tail = '''    // Partner object changes from background sync must not reset an active edit.
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [open, mode, partner.id, payloadFromDraft]);'''
          new_effect_tail = '''    // Partner object changes from background sync must not reset an active edit.
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [open, mode, partner.id]);'''
          if old_effect_tail not in partner:
              raise SystemExit('Business effect dependency marker not found')
          partner = partner.replace(old_effect_tail, new_effect_tail, 1)
          old_discard = '''  async function discard(): Promise<boolean> {
    const baseline = baselineRef.current;
    setDraft((current) => ({ ...current, ...baseline }));
    return true;
  }'''
          new_discard = '''  async function discard(): Promise<boolean> {
    setDraft(baselineDraftRef.current);
    return true;
  }'''
          if old_discard not in partner:
              raise SystemExit('Business discard marker not found')
          partner = partner.replace(old_discard, new_discard, 1)
          success_marker = '      baselineRef.current = currentPayload;\n      dirtyFormRegistry.markClean(formId);'
          if success_marker not in partner:
              raise SystemExit('Business success baseline marker not found')
          partner = partner.replace(success_marker, '      baselineRef.current = currentPayload;\n      baselineDraftRef.current = draft;\n      dirtyFormRegistry.markClean(formId);', 1)
          partner_path.write_text(partner)
          PY
          rm scripts/apply-vendor-module-cleanup.py
          rm .github/workflows/vendor-module-cleanup-runner.yml
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test Vendor module
        run: bun run test:vendor-module
      - name: Test Customer and Site legacy removal
        run: bun run test:customer-sites-legacy
      - name: Test targeted commit policy
        run: bun run test:phase2b
      - name: Lint
        run: bun run lint
      - name: Build
        run: bun run build
      - name: Commit verified cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No application changes to commit."
            exit 0
          fi
          git commit -m "Complete Vendor module cleanup and remove legacy compatibility"
          git push origin HEAD:feature/vendor-module-cleanup-no-legacy
