name: Customer contract hardening runner

on:
  push:
    branches:
      - agent/customer-contract-hardening
    paths:
      - scripts/apply-customer-contract-hardening.py
      - .github/workflows/customer-contract-hardening-runner.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/customer-contract-hardening
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply cleanup
        run: python scripts/apply-customer-contract-hardening.py
      - name: Remove one-shot runner
        run: rm scripts/apply-customer-contract-hardening.py .github/workflows/customer-contract-hardening-runner.yml
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Harden canonical Customer contract and database boundary'
          git push origin HEAD:agent/customer-contract-hardening
