name: Customer Desk One-Shot Refactor

on:
  push:
    branches:
      - fix/customer-desk-single-truth

permissions:
  contents: write

jobs:
  refactor:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collapse Customer scope and update contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def write(path: str, text: str):
              Path(path).write_text(text, encoding='utf-8')

          # One effective customer-scope collection truth, including fallback reads.
          path = Path('src/lib/rdash/server/module-scoped-collections.ts')
          text = path.read_text(encoding='utf-8')
          import_line = 'import { CUSTOMER_SCOPE_COLLECTIONS as CANONICAL_CUSTOMER_SCOPE_COLLECTIONS } from "./customer-read-plan";\n\n'
          if import_line.strip() not in text:
              text = import_line + text
          pattern = r'export const CUSTOMER_SCOPE_COLLECTIONS = Object\.freeze\(\[.*?\n\] as const\);'
          text, count = re.subn(
              pattern,
              'export const CUSTOMER_SCOPE_COLLECTIONS = CANONICAL_CUSTOMER_SCOPE_COLLECTIONS;',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('Expected exactly one CUSTOMER_SCOPE_COLLECTIONS block')
          write(str(path), text)

          # Old test expected an inline Customer Desk list; the canonical list now lives in customer-read-plan.ts.
          path = Path('tests/customer-domain-unification.test.ts')
          text = path.read_text(encoding='utf-8')
          old = '''    expect(source).toContain("customerDesk: Object.freeze([\");\n    expect(source).toContain('\"customers\", \"sites\", \"areas\", \"workRequired\", \"measurementRevisions\"');\n    expect(source).toContain('\"entityReferenceAssignments\", \"entityFileAttachments\", \"auditLog\"');'''
          new = '''    expect(source).toContain("customerDesk: CUSTOMER_CRM_COLLECTIONS");\n    const customerPlan = await read("src/lib/rdash/server/customer-read-plan.ts");\n    expect(customerPlan).toContain("CUSTOMER_CRM_COLLECTIONS");\n    expect(customerPlan).toContain('"entityFileAttachments"');\n    expect(customerPlan).toContain('"master.fileAssets"');'''
          if old not in text:
              raise SystemExit('Customer-domain read-plan assertion block not found')
          text = text.replace(old, new)
          write(str(path), text)

          # Phase-3 file contracts now recognize that Customer Desk no longer owns a staged work-capture dialog.
          path = Path('tests/phase3-contextual-files.test.ts')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'test("Save/Cancel dialogs stage direct-file changes instead of mutating immediately", async () => {',
              'test("Save/Cancel editors stage direct-file changes while Customer Desk stays read-only for direct files", async () => {'
          )
          old = '''    expect(customerDesk).toContain("useUploadDraft(true)");\n    expectTokens(customerDesk, ["allowDetach={false} registerBatch={registerBatch}"]);\n    expectTokens(customerDesk, ["if (saved) commitBatches()"]);'''
          new = '''    expect(customerDesk).not.toContain("useUploadDraft(true)");\n    expect(customerDesk).not.toContain("registerBatch={registerBatch}");\n    expect(customerDesk).not.toContain("commitBatches()");'''
          if old not in text:
              raise SystemExit('Phase-3 Customer Desk upload-draft assertions not found')
          text = text.replace(old, new)

          old_scope = '''    const scopes = await read("src/lib/rdash/server/module-scoped-collections.ts");\n    for (const scope of ["CUSTOMER_SCOPE_COLLECTIONS", "SITE_SCOPE_COLLECTIONS", "QUOTATION_SCOPE_COLLECTIONS", "FIELD_SCOPE_COLLECTIONS"]) {\n      const start = scopes.indexOf(`export const ${scope}`);\n      expect(start).toBeGreaterThanOrEqual(0);\n      const end = scopes.indexOf("] as const);", start);\n      const block = scopes.slice(start, end);\n      expect(block).toContain('\"entityFileAttachments\"');\n      expect(block).toContain('\"master.fileAssets\"');\n    }'''
          new_scope = '''    const scopes = await read("src/lib/rdash/server/module-scoped-collections.ts");\n    const customerPlan = await read("src/lib/rdash/server/customer-read-plan.ts");\n    expect(scopes).toContain("CUSTOMER_SCOPE_COLLECTIONS = CANONICAL_CUSTOMER_SCOPE_COLLECTIONS");\n    expect(customerPlan).toContain('\"entityFileAttachments\"');\n    expect(customerPlan).toContain('\"master.fileAssets\"');\n    for (const scope of ["SITE_SCOPE_COLLECTIONS", "QUOTATION_SCOPE_COLLECTIONS", "FIELD_SCOPE_COLLECTIONS"]) {\n      const start = scopes.indexOf(`export const ${scope}`);\n      expect(start).toBeGreaterThanOrEqual(0);\n      const end = scopes.indexOf("] as const);", start);\n      const block = scopes.slice(start, end);\n      expect(block).toContain('\"entityFileAttachments\"');\n      expect(block).toContain('\"master.fileAssets\"');\n    }'''
          if old_scope not in text:
              raise SystemExit('Phase-3 scope assertion block not found')
          text = text.replace(old_scope, new_scope)
          write(str(path), text)

          # Make the new selection contract test formatting-insensitive.
          path = Path('tests/customer-desk-single-truth.test.ts')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '    expect(desk).toContain("selectedCustomerId\\n    ? db.customers.find");',
              '    expect(desk).toContain("const selected = selectedCustomerId");\n    expect(desk).toContain("customer.id === selectedCustomerId");'
          )
          write(str(path), text)

          # Keep imports clean after the Customer Desk simplification.
          path = Path('src/components/rdash/modules/CustomerDesk.tsx')
          text = path.read_text(encoding='utf-8')
          text = text.replace('  CalendarClock,\n', '')
          write(str(path), text)

          # Remove temporary diagnostics/refactor workflows in the same commit.
          for workflow in [
              Path('.github/workflows/customer-desk-diagnostics.yml'),
              Path('.github/workflows/customer-desk-one-shot-refactor.yml'),
          ]:
              if workflow.exists():
                  workflow.unlink()
          PY
      - name: Commit refactor
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize Customer Desk single-truth contracts"
          git push origin HEAD:fix/customer-desk-single-truth
