name: TypeScript Enforcement Runner

on:
  pull_request:

permissions:
  contents: write

jobs:
  enforce:
    if: github.head_ref == 'agent/typescript-enforcement'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Apply TypeScript cleanup
        run: python scripts/apply-typescript-enforcement.py
      - name: Typecheck application
        run: bunx tsc --noEmit
      - name: Lint application
        run: bun run lint
      - name: Build application
        run: bun run build
      - name: Commit verified TypeScript cleanup
        run: |
          rm scripts/apply-typescript-enforcement.py
          rm .github/workflows/typescript-enforcement-runner.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clean TypeScript errors and enforce type safety"
          git push origin HEAD:agent/typescript-enforcement
