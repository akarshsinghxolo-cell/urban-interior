name: Agent reaudit lifecycle fix

on:
  push:
    branches: [agent/page-entity-egress-architecture]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Validate audited workspace lifecycle fixes'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/page-entity-egress-architecture
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Apply audited lifecycle fixes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def patch(path: str, old: str, new: str, count: int = 1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} occurrence(s), found {actual}: {old[:100]!r}')
              p.write_text(text.replace(old, new, count))

          patch(
              'src/lib/rdash/workspace-session-merge.ts',
              '''  return merged;\n}\n\n/**\n * Merge one authoritative server payload into the long-lived browser session.''',
              '''  return merged;\n}\n\n/**\n * A normal hydration may merge another partial snapshot at the same revision,\n * or advance to a newer revision. It must never apply rows from an older\n * response after the live session/commit queue has already advanced.\n */\nexport function workspaceHydrationRevisionIsCurrent(\n  incomingRevision: number,\n  ...knownRevisions: number[]\n): boolean {\n  if (!Number.isSafeInteger(incomingRevision) || incomingRevision < 0) return false;\n  const floor = knownRevisions.reduce((current, raw) => {\n    const value = Number(raw);\n    return Number.isSafeInteger(value) && value >= 0 ? Math.max(current, value) : current;\n  }, 0);\n  return incomingRevision >= floor;\n}\n\n/**\n * Merge one authoritative server payload into the long-lived browser session.'''
          )
          patch(
              'src/lib/rdash/store/types.ts',
              '''    rowVersions?: Record<string, number>;\n  }) => void;\n  acceptWorkspaceServerRevision:''',
              '''    rowVersions?: Record<string, number>;\n  }) => boolean;\n  acceptWorkspaceServerRevision:'''
          )
          patch(
              'src/lib/rdash/client-auth.ts',
              '''function invalidateReadCaches() {\n  healthResponseCache = null;\n  clearStoredHealthResponses();\n  workspaceReadRequests.clear();\n  if (typeof window !== "undefined") {\n    window.dispatchEvent(new CustomEvent("uc-workspace-health-invalidated"));\n  }\n}\n''',
              '''function invalidateReadCaches() {\n  healthResponseCache = null;\n  clearStoredHealthResponses();\n  workspaceReadRequests.clear();\n  if (typeof window !== "undefined") {\n    window.dispatchEvent(new CustomEvent("uc-workspace-health-invalidated"));\n  }\n}\n\nexport function clearWorkspaceReadRequestCache(): void {\n  workspaceReadRequests.clear();\n}\n\nexport function invalidateWorkspaceClientCaches(): void {\n  invalidateReadCaches();\n}\n'''
          )
          patch(
              'src/lib/rdash/client-auth.ts',
              '''      if (isWorkspaceRead) {\n        if (response.ok && !deferReadState) workspaceReadState.recordResponse(response);\n        try {\n          await rememberWorkspaceResponse(response.clone());\n        } catch (error) {\n          console.error("[WorkspaceOutbox] Could not cache the accepted workspace baseline.", error);\n        }\n      }\n''',
              '''      if (isWorkspaceRead && !deferReadState) {\n        if (response.ok) workspaceReadState.recordResponse(response);\n        try {\n          await rememberWorkspaceResponse(response.clone());\n        } catch (error) {\n          console.error("[WorkspaceOutbox] Could not cache the accepted workspace baseline.", error);\n        }\n      }\n'''
          )
          patch(
              'src/lib/uploads/workspace-outbox.ts',
              '''export function clearWorkspaceOutboxScope(): void {\n  activeScope = null;\n  acceptedWorkspace = null;\n  acceptedRevision = 0;\n  hydratePromise = null;\n  emit([], true);\n}\n''',
              '''export function clearWorkspaceOutboxScope(): void {\n  activeScope = null;\n  acceptedWorkspace = null;\n  acceptedRevision = 0;\n  hydratePromise = null;\n  emit([], true);\n}\n\nexport function clearWorkspaceAcceptedBaseline(): void {\n  acceptedWorkspace = null;\n  acceptedRevision = 0;\n}\n\nexport async function awaitWorkspaceOutboxIdle(): Promise<void> {\n  const pending = flushPromise;\n  if (!pending) return;\n  try {\n    await pending;\n  } catch {\n    // Reset is authoritative; a failed replay must not prevent the Owner from resetting.\n  }\n}\n\nexport async function resetWorkspaceOutboxAfterWorkspaceReset(\n  base: RDashDatabase,\n  revision: number,\n): Promise<void> {\n  acceptedWorkspace = structuredClone(base) as RDashDatabase;\n  acceptedRevision = Number.isSafeInteger(revision) && revision >= 0 ? revision : 0;\n  hydratePromise = null;\n  emit([], true);\n  const items = await readScopedWorkspaceOutbox();\n  for (const item of items) await uploadIndexedDb.deleteWorkspaceOutbox(item.operationId);\n  await refresh();\n}\n'''
          )
          patch(
              'src/lib/rdash/raw-store.ts',
              '''import { createEmptyWorkspaceDatabase, mergeWorkspaceSnapshot, mergeWorkspaceVersionMap, normalizeWorkspaceSession } from "./workspace-session-merge";\nimport { classifyWorkspaceSaveOutcome } from "./workspace-save-outcome";''',
              '''import { createEmptyWorkspaceDatabase, mergeWorkspaceSnapshot, mergeWorkspaceVersionMap, normalizeWorkspaceSession, workspaceHydrationRevisionIsCurrent } from "./workspace-session-merge";\nimport { workspaceFoundationRevisionState } from "./workspace-foundation-revision-state";\nimport { workspaceReadCache } from "./workspace-read-cache";\nimport { workspaceRowVersionState } from "./workspace-row-version-state";\nimport { invalidateWorkspaceClientCaches } from "./client-auth";\nimport { awaitWorkspaceOutboxIdle, resetWorkspaceOutboxAfterWorkspaceReset } from "../uploads/workspace-outbox";\nimport { classifyWorkspaceSaveOutcome } from "./workspace-save-outcome";'''
          )
          patch(
              'src/lib/rdash/raw-store.ts',
              '''            catch (error) {\n                const message = error instanceof Error && error.message\n                    ? error.message\n                    : "Could not reach the PostgreSQL operation server. Your change is saved locally and will retry after connectivity is restored.";''',
              '''            catch (error) {\n                if (saveEpoch !== syncEpoch) return;\n                const message = error instanceof Error && error.message\n                    ? error.message\n                    : "Could not reach the PostgreSQL operation server. Your change is saved locally and will retry after connectivity is restored.";'''
          )
          patch(
              'src/lib/rdash/raw-store.ts',
              '''            const payload = (await response.json().catch(() => ({}))) as {\n                status?: "applied" | "processing";''',
              '''            if (saveEpoch !== syncEpoch) return;\n            const payload = (await response.json().catch(() => ({}))) as {\n                status?: "applied" | "processing";'''
          )
          patch(
              'src/lib/rdash/raw-store.ts',
              '''        hydrateSecureWorkspace: ({ db, revision, user, rowVersions }) => {\n            const current = get();\n            const accepted = mergeWorkspaceSnapshot(current.db, db);\n            const nextRevision = Math.max(\n                revision,\n                current.serverRevision,\n                serverRevisionForQueue,\n                lastAcceptedServerRevision,\n            );''',
              '''        hydrateSecureWorkspace: ({ db, revision, user, rowVersions }) => {\n            const current = get();\n            if (!workspaceHydrationRevisionIsCurrent(\n                revision,\n                current.serverRevision,\n                serverRevisionForQueue,\n                lastAcceptedServerRevision,\n            )) {\n                return false;\n            }\n            const accepted = mergeWorkspaceSnapshot(current.db, db);\n            const nextRevision = revision;'''
          )
          patch(
              'src/lib/rdash/raw-store.ts',
              '''                workspaceSyncError: null,\n            });\n        },\n        // currentUser, canReleaseContractorPayment moved to core slice''',
              '''                workspaceSyncError: null,\n            });\n            return true;\n        },\n        // currentUser, canReleaseContractorPayment moved to core slice'''
          )
          patch(
              'src/lib/rdash/raw-store.ts',
              '''            syncEpoch += 1;\n            setBase({ workspaceSyncStatus: "saving", workspaceSyncError: null });''',
              '''            await serverSyncQueue.catch(() => undefined);\n            await awaitWorkspaceOutboxIdle();\n            syncEpoch += 1;\n            setBase({ workspaceSyncStatus: "saving", workspaceSyncError: null });'''
          )
          patch(
              'src/lib/rdash/raw-store.ts',
              '''            const accepted = normalizeWorkspaceSession(payload.data);\n            serverRevisionForQueue = payload.revision;\n            lastAcceptedServerRevision = payload.revision;\n            lastAcceptedServerDb = structuredClone(accepted) as RDashDatabase;\n            setBase({\n                db: accepted,\n                serverRevision: payload.revision,\n                workspaceSyncStatus: "saved",\n                workspaceSyncError: null,\n            });\n''',
              '''            const accepted = normalizeWorkspaceSession(payload.data);\n            serverRevisionForQueue = payload.revision;\n            lastAcceptedServerRevision = payload.revision;\n            lastAcceptedServerDb = structuredClone(accepted) as RDashDatabase;\n            rowVersionsCache = null;\n            workspaceRowVersionState.replace(undefined);\n            workspaceFoundationRevisionState.replace(payload.revision);\n            workspaceReadCache.clear();\n            invalidateWorkspaceClientCaches();\n            try {\n                await resetWorkspaceOutboxAfterWorkspaceReset(accepted, payload.revision);\n            } catch (error) {\n                console.error("[workspace-reset] Could not clear local pending changes after reset.", error);\n            }\n            serverSyncQueue = Promise.resolve();\n            setBase({\n                db: accepted,\n                serverRevision: payload.revision,\n                workspaceSyncStatus: "saved",\n                workspaceSyncError: null,\n            });\n            window.location.reload();\n'''
          )
          patch(
              'src/lib/rdash/use-workspace-row-version-bridge.ts',
              '''    const wrapped: typeof original = (input) => {\n      workspaceRowVersionState.merge(input.rowVersions);\n      original(input);\n    };''',
              '''    const wrapped: typeof original = (input) => {\n      const accepted = original(input);\n      if (accepted) workspaceRowVersionState.merge(input.rowVersions);\n      return accepted;\n    };'''
          )
          patch(
              'src/components/urban-castle/WorkspaceScopedReadBoundary.tsx',
              '''import { useRDashStore } from "@/lib/rdash/store";\nimport { workspaceReadCoverageIsCompatible } from "@/lib/rdash/workspace-read-scope";''',
              '''import { useRDashStore } from "@/lib/rdash/store";\nimport { clearWorkspaceReadRequestCache } from "@/lib/rdash/client-auth";\nimport { workspaceReadCoverageIsCompatible } from "@/lib/rdash/workspace-read-scope";'''
          )
          patch(
              'src/components/urban-castle/WorkspaceScopedReadBoundary.tsx',
              '''import { restoreWorkspaceOutboxOverlay } from "@/lib/uploads/workspace-outbox";''',
              '''import { clearWorkspaceAcceptedBaseline, restoreWorkspaceOutboxOverlay } from "@/lib/uploads/workspace-outbox";'''
          )
          patch('src/components/urban-castle/WorkspaceScopedReadBoundary.tsx','''    const loadFullScope = async (): Promise<void> => {''','''    const loadFullScope = async (staleRetry = 0): Promise<void> => {''')
          patch(
              'src/components/urban-castle/WorkspaceScopedReadBoundary.tsx',
              '''      const overlay = await restoreWorkspaceOutboxOverlay(payload.data);\n      if (!requestStillCurrent()) return;\n\n      hydrateSecureWorkspace({\n        db: overlay.db,\n        revision: payload.revision,\n        user: hydrationUser,\n        rowVersions: payload.rowVersions,\n      });\n      workspaceReadState.recordResponse(response, requestedTarget);''',
              '''      if (payload.revision < useRDashStore.getState().serverRevision) {\n        clearWorkspaceAcceptedBaseline();\n        clearWorkspaceReadRequestCache();\n        if (staleRetry < 1 && requestStillCurrent()) return loadFullScope(staleRetry + 1);\n        if (requestStillCurrent()) window.location.reload();\n        return;\n      }\n\n      const overlay = await restoreWorkspaceOutboxOverlay(payload.data);\n      if (!requestStillCurrent()) return;\n\n      const hydrated = hydrateSecureWorkspace({\n        db: overlay.db,\n        revision: payload.revision,\n        user: hydrationUser,\n        rowVersions: payload.rowVersions,\n      });\n      if (!hydrated) {\n        clearWorkspaceAcceptedBaseline();\n        clearWorkspaceReadRequestCache();\n        workspaceReadCache.clear();\n        if (staleRetry < 1 && requestStillCurrent()) return loadFullScope(staleRetry + 1);\n        if (requestStillCurrent()) window.location.reload();\n        return;\n      }\n      workspaceReadState.recordResponse(response, requestedTarget);'''
          )
          patch(
              'src/components/urban-castle/WorkspaceScopedReadBoundary.tsx',
              '''      if (result.kind === "reload") {\n        await loadFullScope();\n        return;\n      }\n\n      if (!requestStillCurrent()) return;\n      workspaceReadCache.put(result.entry);''',
              '''      if (result.kind === "reload") {\n        if (result.reason === "client_ahead") {\n          clearWorkspaceAcceptedBaseline();\n          clearWorkspaceReadRequestCache();\n          window.location.reload();\n          return;\n        }\n        await loadFullScope();\n        return;\n      }\n\n      if (!requestStillCurrent()) return;\n      if (result.entry.revision < useRDashStore.getState().serverRevision) {\n        clearWorkspaceReadRequestCache();\n        await loadFullScope();\n        return;\n      }\n      workspaceReadCache.put(result.entry);'''
          )
          patch(
              'src/components/urban-castle/WorkspaceScopedReadBoundary.tsx',
              '''      hydrateSecureWorkspace({\n        db: overlay.db,\n        revision: result.entry.revision,\n        user: authUser,\n        rowVersions: result.entry.rowVersions,\n      });\n      applyOverlayStatus(overlay);''',
              '''      const hydrated = hydrateSecureWorkspace({\n        db: overlay.db,\n        revision: result.entry.revision,\n        user: authUser,\n        rowVersions: result.entry.rowVersions,\n      });\n      if (!hydrated) {\n        clearWorkspaceAcceptedBaseline();\n        clearWorkspaceReadRequestCache();\n        workspaceReadCache.clear();\n        await loadFullScope();\n        return;\n      }\n      applyOverlayStatus(overlay);'''
          )
          patch(
              'src/components/urban-castle/WorkspaceScopedReadBoundary.tsx',
              '''      const latestAfterOverlay = useRDashStore.getState();\n      if (!latestAfterOverlay.authUser || latestAfterOverlay.serverRevision !== payload.revision) return;\n      latestAfterOverlay.hydrateSecureWorkspace({\n        db: overlay.db,\n        revision: payload.revision,\n        user: authUser,\n        rowVersions: mergedRowVersions,\n      });''',
              '''      const latestAfterOverlay = useRDashStore.getState();\n      if (!latestAfterOverlay.authUser || latestAfterOverlay.serverRevision !== payload.revision) {\n        clearWorkspaceAcceptedBaseline();\n        workspaceReadState.reset();\n        setRetryNonce((value) => value + 1);\n        return;\n      }\n      const hydrated = latestAfterOverlay.hydrateSecureWorkspace({\n        db: overlay.db,\n        revision: payload.revision,\n        user: authUser,\n        rowVersions: mergedRowVersions,\n      });\n      if (!hydrated) {\n        clearWorkspaceAcceptedBaseline();\n        clearWorkspaceReadRequestCache();\n        workspaceReadCache.clear();\n        workspaceReadState.reset();\n        setRetryNonce((value) => value + 1);\n        return;\n      }'''
          )
          patch(
              'src/components/urban-castle/WorkspaceDeltaSync.tsx',
              '''  restoreWorkspaceOutboxOverlay,\n  workspaceOutboxStore,''',
              '''  clearWorkspaceAcceptedBaseline,\n  restoreWorkspaceOutboxOverlay,\n  workspaceOutboxStore,'''
          )
          patch('src/components/urban-castle/WorkspaceDeltaSync.tsx','''      "X-UC-Delta-Fallback": "1",\n    },''','''      "X-UC-Delta-Fallback": "1",\n      "X-UC-Read-State-Deferred": "1",\n    },''')
          patch(
              'src/components/urban-castle/WorkspaceDeltaSync.tsx',
              '''  const overlay = await restoreWorkspaceOutboxOverlay(payload.data);\n  if (signal.aborted || !currentRunIsSafe(pathname)) return false;\n  useRDashStore.getState().hydrateSecureWorkspace({\n    db: overlay.db,\n    revision: payload.revision,\n    user: hydrationUser,\n    rowVersions: payload.rowVersions,\n  });\n  workspaceReadState.recordResponse(response);''',
              '''  if (payload.revision < useRDashStore.getState().serverRevision) return false;\n  const overlay = await restoreWorkspaceOutboxOverlay(payload.data);\n  if (signal.aborted || !currentRunIsSafe(pathname)) return false;\n  const hydrated = useRDashStore.getState().hydrateSecureWorkspace({\n    db: overlay.db,\n    revision: payload.revision,\n    user: hydrationUser,\n    rowVersions: payload.rowVersions,\n  });\n  if (!hydrated) {\n    clearWorkspaceAcceptedBaseline();\n    return false;\n  }\n  workspaceReadState.recordResponse(response);'''
          )
          patch(
              'src/components/urban-castle/WorkspaceDeltaSync.tsx',
              '''          if (delta.requiresFullReload || !isValidDelta(delta, afterRevision)) {\n            if (!await reloadCurrentWorkspace(pathname, controller.signal)) {''',
              '''          if (delta.requiresFullReload && delta.reason === "client_ahead") {\n            window.location.reload();\n            return;\n          }\n          if (delta.requiresFullReload || !isValidDelta(delta, afterRevision)) {\n            if (!await reloadCurrentWorkspace(pathname, controller.signal)) {'''
          )
          patch(
              'src/components/urban-castle/WorkspaceDeltaSync.tsx',
              '''          latest.hydrateSecureWorkspace({\n            db: applied.database,\n            revision: delta.revision,\n            user: latest.authUser,\n            rowVersions: mergedRowVersions,\n          });\n          afterRevision = delta.revision;''',
              '''          const hydrated = latest.hydrateSecureWorkspace({\n            db: applied.database,\n            revision: delta.revision,\n            user: latest.authUser,\n            rowVersions: mergedRowVersions,\n          });\n          if (!hydrated) return;\n          afterRevision = delta.revision;'''
          )
          patch(
              'src/components/urban-castle/WorkspaceFoundationSync.tsx',
              '''  useRDashStore.getState().hydrateSecureWorkspace({\n    db: payload.data,\n    revision: payload.revision,\n    user: payload.user,\n    rowVersions: payload.rowVersions,\n  });\n  workspaceFoundationRevisionState.replace(payload.revision);''',
              '''  const hydrated = useRDashStore.getState().hydrateSecureWorkspace({\n    db: payload.data,\n    revision: payload.revision,\n    user: payload.user,\n    rowVersions: payload.rowVersions,\n  });\n  if (!hydrated) return false;\n  workspaceFoundationRevisionState.replace(payload.revision);'''
          )
          patch(
              'src/components/urban-castle/WorkspaceFoundationSync.tsx',
              '''            latest.hydrateSecureWorkspace({\n              db: applied.database,\n              revision: delta.revision,\n              user: latest.authUser!,\n              rowVersions,\n            });\n          } else {''',
              '''            const hydrated = latest.hydrateSecureWorkspace({\n              db: applied.database,\n              revision: delta.revision,\n              user: latest.authUser!,\n              rowVersions,\n            });\n            if (!hydrated) return;\n          } else {'''
          )
          patch(
              'src/lib/rdash/server/module-scoped-read.ts',
              '''  if (scoped.revision !== authorization.revision) throw new Error("READ_CONFLICT");\n  const savings = moduleReadPlanSavings(target);''',
              '''  if (scoped.revision !== authorization.revision) throw new Error("READ_CONFLICT");\n  const revisionFence = await getWorkspaceSubset({});\n  if (revisionFence.revision !== scoped.revision) throw new Error("READ_CONFLICT");\n  const savings = moduleReadPlanSavings(target);'''
          )
          patch('src/lib/rdash/server/module-scoped-read.ts','''    queryCount: scoped.queryCount + authorization.queryCount,\n    scope: target.scope,''','''    queryCount: scoped.queryCount + authorization.queryCount + revisionFence.queryCount,\n    scope: target.scope,''')
          patch(
              'src/lib/rdash/server/module-scoped-read.ts',
              '''  if (page.revision !== authorization.revision) throw new Error("READ_CONFLICT");\n\n  const savings = moduleReadPlanSavings(target);''',
              '''  if (page.revision !== authorization.revision) throw new Error("READ_CONFLICT");\n  const revisionFence = await getWorkspaceSubset({});\n  if (revisionFence.revision !== page.revision) throw new Error("READ_CONFLICT");\n\n  const savings = moduleReadPlanSavings(target);'''
          )
          patch('src/lib/rdash/server/module-scoped-read.ts','''    queryCount: page.queryCount + authorization.queryCount,\n    scope: target.scope,''','''    queryCount: page.queryCount + authorization.queryCount + revisionFence.queryCount,\n    scope: target.scope,''')
          patch('src/lib/rdash/server/entity-scoped-read.ts','''import type { WorkspaceSubset } from "./workspace";''','''import { getWorkspaceSubset, type WorkspaceSubset } from "./workspace";''')
          patch(
              'src/lib/rdash/server/entity-scoped-read.ts',
              '''  merged = mergeWorkspaceSubsets(merged, await getRestWorkspaceBySelectors(fourth));\n\n  const mode = `${entity.kind}-row` as const;''',
              '''  merged = mergeWorkspaceSubsets(merged, await getRestWorkspaceBySelectors(fourth));\n\n  const revisionFence = await getWorkspaceSubset({});\n  if (revisionFence.revision !== merged.revision) throw new Error("READ_CONFLICT");\n\n  const mode = `${entity.kind}-row` as const;'''
          )
          patch('src/lib/rdash/server/entity-scoped-read.ts','''    queryCount: merged.queryCount + authorization.queryCount,\n    scope: target.scope as "customer" | "site",''','''    queryCount: merged.queryCount + authorization.queryCount + revisionFence.queryCount,\n    scope: target.scope as "customer" | "site",''')
          patch('tests/workspace-session-merge.test.ts','''  normalizeWorkspaceSession,\n  WORKSPACE_SESSION_FOUNDATION_COLLECTIONS,''','''  normalizeWorkspaceSession,\n  workspaceHydrationRevisionIsCurrent,\n  WORKSPACE_SESSION_FOUNDATION_COLLECTIONS,''')
          patch('tests/workspace-session-merge.test.ts','''  test("normalization does not synthesize threads or follow-ups", () => {''','''  test("rejects older hydration revisions while allowing equal-revision partial merges", () => {\n    expect(workspaceHydrationRevisionIsCurrent(10, 11, 10, 9)).toBe(false);\n    expect(workspaceHydrationRevisionIsCurrent(11, 11, 10, 9)).toBe(true);\n    expect(workspaceHydrationRevisionIsCurrent(12, 11, 10, 9)).toBe(true);\n    expect(workspaceHydrationRevisionIsCurrent(Number.NaN, 11)).toBe(false);\n  });\n\n  test("normalization does not synthesize threads or follow-ups", () => {''')
          patch(
              'tests/runtime-efficiency-hardening.test.ts',
              '''  test("pagination metadata survives normalization and offline overlays", async () => {''',
              '''  test("stale scoped responses and workspace reset epochs cannot overwrite newer session data", async () => {\n    const rawStore = await read("src/lib/rdash/raw-store.ts");\n    const boundary = await read("src/components/urban-castle/WorkspaceScopedReadBoundary.tsx");\n    const bridge = await read("src/lib/rdash/use-workspace-row-version-bridge.ts");\n    const outbox = await read("src/lib/uploads/workspace-outbox.ts");\n    const clientAuth = await read("src/lib/rdash/client-auth.ts");\n    expect(rawStore).toContain("workspaceHydrationRevisionIsCurrent(");\n    expect(rawStore).toContain("if (saveEpoch !== syncEpoch) return;");\n    expect(rawStore).toContain("await serverSyncQueue.catch(() => undefined)");\n    expect(rawStore).toContain("await awaitWorkspaceOutboxIdle()");\n    expect(rawStore).toContain("rowVersionsCache = null");\n    expect(rawStore).toContain("workspaceRowVersionState.replace(undefined)");\n    expect(rawStore).toContain("workspaceFoundationRevisionState.replace(payload.revision)");\n    expect(rawStore).toContain("workspaceReadCache.clear()");\n    expect(rawStore).toContain("resetWorkspaceOutboxAfterWorkspaceReset");\n    expect(rawStore).toContain("invalidateWorkspaceClientCaches()");\n    expect(rawStore).toContain("window.location.reload()");\n    expect(boundary).toContain("clearWorkspaceReadRequestCache()");\n    expect(boundary).toContain("result.reason === \\\"client_ahead\\\"");\n    expect(boundary).toContain("if (!hydrated)");\n    expect(bridge.indexOf("const accepted = original(input)")).toBeLessThan(bridge.indexOf("workspaceRowVersionState.merge(input.rowVersions)"));\n    expect(outbox).toContain("resetWorkspaceOutboxAfterWorkspaceReset");\n    expect(outbox).toContain("await uploadIndexedDb.deleteWorkspaceOutbox(item.operationId)");\n    expect(clientAuth).toContain("if (isWorkspaceRead && !deferReadState)");\n  });\n\n  test("module, bounded page and entity reads finish behind a revision fence", async () => {\n    const moduleRead = await read("src/lib/rdash/server/module-scoped-read.ts");\n    const entityRead = await read("src/lib/rdash/server/entity-scoped-read.ts");\n    expect(moduleRead).toContain("const revisionFence = await getWorkspaceSubset({})");\n    expect(moduleRead).toContain("revisionFence.revision !== scoped.revision");\n    expect(moduleRead).toContain("revisionFence.revision !== page.revision");\n    expect(entityRead).toContain("const revisionFence = await getWorkspaceSubset({})");\n    expect(entityRead).toContain("revisionFence.revision !== merged.revision");\n  });\n\n  test("pagination metadata survives normalization and offline overlays", async () => {'''
          )
