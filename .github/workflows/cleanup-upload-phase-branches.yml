name: Remove upload phase branches

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: startsWith(github.event.head_commit.message, 'chore: remove upload phase branches')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Delete merged upload branches
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            agent/direct-drive-upload-phase1
            agent/direct-drive-upload-phase2
            agent/direct-drive-upload-phase3
            agent/audit-upload-phases-1-3
            agent/direct-drive-upload-phase4
            agent/direct-drive-upload-phase5
            agent/trigger-upload-branch-cleanup
            agent/trigger-upload-branch-cleanup-2
          )
          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
            else
              echo "Already absent: $branch"
            fi
          done
      - name: Remove temporary cleanup workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/cleanup-upload-phase-branches.yml?ref=main" --jq .sha)"
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/cleanup-upload-phase-branches.yml" \
            -f message='chore: remove temporary upload branch cleanup workflow' \
            -f sha="$sha" \
            -f branch='main'

# This revision fixes the one-time cleanup trigger condition.
