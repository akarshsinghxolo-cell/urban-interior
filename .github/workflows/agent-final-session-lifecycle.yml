name: Agent final session lifecycle

on:
  push:
    branches:
      - agent/page-entity-egress-architecture
    paths:
      - .github/workflows/agent-final-session-lifecycle.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/page-entity-egress-architecture
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Apply final session lifecycle fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path): return Path(path).read_text(encoding='utf-8')
          def write(path, text): Path(path).write_text(text, encoding='utf-8')
          def replace(path, old, new, count=1):
              text = read(path)
              found = text.count(old)
              if found < count:
                  raise SystemExit(f'{path}: expected at least {count} occurrences, found {found}: {old[:100]!r}')
              write(path, text.replace(old, new, count))

          # Navigation cache: report whether a delta actually changed rows.
          p = 'src/lib/rdash/workspace-navigation-delta.ts'
          replace(p,
              '| { kind: "fresh"; entry: WorkspaceReadCacheEntry }',
              '| { kind: "fresh"; entry: WorkspaceReadCacheEntry; changed: boolean }')
          replace(p,
              '    aggregateRevisions: input.aggregateRevisions ? { ...input.aggregateRevisions } : undefined,\n',
              '')
          replace(p,
              '  let afterRevision = entry.revision;\n',
              '  let afterRevision = entry.revision;\n  let changed = false;\n')
          replace(p,
              ': { kind: "fresh", entry };',
              ': { kind: "fresh", entry, changed };')
          replace(p,
              '    const applied = applyWorkspaceDelta(entry.data, delta);\n',
              '    const deltaChanged = touchedCollections(delta).size > 0;\n    changed = changed || deltaChanged;\n    const applied = applyWorkspaceDelta(entry.data, delta);\n')
          replace(p,
              '    if (!delta.hasMore) return { kind: "fresh", entry };\n',
              '    if (!delta.hasMore) return { kind: "fresh", entry, changed };\n')

          # Cache keeps only canonical row versions, not the retired aggregate-revision mode.
          p = 'src/lib/rdash/workspace-read-cache.ts'
          for old in [
              '  aggregateRevisions?: Record<string, number>;\n',
              '    aggregateRevisions: entry.aggregateRevisions ? { ...entry.aggregateRevisions } : undefined,\n',
              '    aggregateRevisions?: Record<string, number>;\n',
              '      aggregateRevisions: input.aggregateRevisions ? { ...input.aggregateRevisions } : undefined,\n',
          ]:
              text = read(p)
              if old in text: write(p, text.replace(old, '', 1))

          # Core store exposes metadata-only revision acceptance.
          p = 'src/lib/rdash/store/types.ts'
          replace(p,
              '    user: AuthenticatedWorkspaceUser;\n    aggregateRevisions?: Record<string, number>;\n    rowVersions?: Record<string, number>;\n  }) => void;\n',
              '    user: AuthenticatedWorkspaceUser;\n    rowVersions?: Record<string, number>;\n  }) => void;\n  acceptWorkspaceServerRevision: (input: {\n    revision: number;\n    rowVersions?: Record<string, number>;\n  }) => void;\n')

          p = 'src/lib/rdash/raw-store.ts'
          anchor = '''        ...coreSlice,\n        hydrateSecureWorkspace: ({ db, revision, user, rowVersions }) => {\n'''
          insertion = '''        ...coreSlice,\n        acceptWorkspaceServerRevision: ({ revision, rowVersions }) => {\n            const current = get();\n            const nextRevision = Math.max(\n                revision,\n                current.serverRevision,\n                serverRevisionForQueue,\n                lastAcceptedServerRevision,\n            );\n            serverRevisionForQueue = nextRevision;\n            lastAcceptedServerRevision = nextRevision;\n            lastAcceptedServerDb = structuredClone(current.db) as RDashDatabase;\n            rowVersionsCache = mergeWorkspaceVersionMap(rowVersionsCache, rowVersions);\n            setBase({\n                serverRevision: nextRevision,\n                workspaceSyncStatus: "saved",\n                workspaceSyncError: null,\n            });\n        },\n        hydrateSecureWorkspace: ({ db, revision, user, rowVersions }) => {\n'''
          replace(p, anchor, insertion)

          # Mirrored row versions merge across scoped hydrations instead of being replaced.
          p = 'src/lib/rdash/workspace-row-version-state.ts'
          replace(p,
              '  replace(input: WorkspaceRowVersions | undefined): void {\n    snapshot = normalizedRowVersions(input);\n  },\n',
              '  replace(input: WorkspaceRowVersions | undefined): void {\n    snapshot = normalizedRowVersions(input);\n  },\n  merge(input: WorkspaceRowVersions | undefined): void {\n    snapshot = mergeWorkspaceRowVersions(snapshot, input || {});\n  },\n')
          p = 'src/lib/rdash/use-workspace-row-version-bridge.ts'
          replace(p,
              '      workspaceRowVersionState.replace(input.rowVersions);\n',
              '      workspaceRowVersionState.merge(input.rowVersions);\n')
          replace(p,
              ' * hydration replaces the mirrored row-version map; delta hydration can then\n * merge remote versions without weakening the store\'s private CAS cache.\n',
              ' * hydration merges authoritative row versions into the session mirror without\n * discarding versions retained from the bootstrap or previously loaded modules.\n')

          # Navigation revisit: restore coverage before paint, never rehydrate cached DB.
          p = 'src/components/urban-castle/WorkspaceScopedReadBoundary.tsx'
          replace(p,
              'import { restoreWorkspaceOutboxOverlay, workspaceOutboxStore } from "@/lib/uploads/workspace-outbox";',
              'import { restoreWorkspaceOutboxOverlay } from "@/lib/uploads/workspace-outbox";')
          replace(p, '  aggregateRevisions?: Record<string, number>;\n', '')
          old_layout = '''    if (workspaceOutboxStore.getSnapshot().items.length === 0) {\n      useRDashStore.getState().hydrateSecureWorkspace({\n        db: cachedTarget.data,\n        revision: cachedTarget.revision,\n        user: authUser,\n        rowVersions: cachedTarget.rowVersions,\n      });\n    }\n    workspaceReadState.restoreCached(requestedTarget, cachedTarget.readState);\n'''
          replace(p, old_layout,
              '''    // The long-lived session already retains previously visited module rows.\n    // Cache is a server revalidation baseline only; copying it back into Zustand\n    // would re-render every `s.db` subscriber and could restore older rows.\n    workspaceReadState.restoreCached(requestedTarget, cachedTarget.readState);\n''')
          replace(p, '        aggregateRevisions: payload.aggregateRevisions,\n', '', 2)
          replace(p, '        aggregateRevisions: result.entry.aggregateRevisions,\n', '') if 'aggregateRevisions: result.entry.aggregateRevisions' in read(p) else None
          replace(p, '        aggregateRevisions: cached?.aggregateRevisions,\n', '')
          old_revalidate = '''      const overlay = await restoreWorkspaceOutboxOverlay(result.entry.data);\n      if (!requestStillCurrent()) return;\n\n      hydrateSecureWorkspace({\n        db: overlay.db,\n        revision: result.entry.revision,\n        user: authUser,\n        rowVersions: result.entry.rowVersions,\n      });\n      workspaceReadCache.put(result.entry);\n      workspaceReadState.restoreCached(requestedTarget, result.entry.readState);\n      applyOverlayStatus(overlay);\n'''
          new_revalidate = '''      if (!requestStillCurrent()) return;\n      workspaceReadCache.put(result.entry);\n      workspaceReadState.restoreCached(requestedTarget, result.entry.readState);\n\n      if (!result.changed) {\n        useRDashStore.getState().acceptWorkspaceServerRevision({\n          revision: result.entry.revision,\n          rowVersions: result.entry.rowVersions,\n        });\n        return;\n      }\n\n      const overlay = await restoreWorkspaceOutboxOverlay(result.entry.data);\n      if (!requestStillCurrent()) return;\n      hydrateSecureWorkspace({\n        db: overlay.db,\n        revision: result.entry.revision,\n        user: authUser,\n        rowVersions: result.entry.rowVersions,\n      });\n      applyOverlayStatus(overlay);\n'''
          replace(p, old_revalidate, new_revalidate)

          # Background delta reload no longer carries aggregate revision fields.
          p = 'src/components/urban-castle/WorkspaceDeltaSync.tsx'
          replace(p, '  aggregateRevisions?: Record<string, number>;\n', '')
          replace(p, '    aggregateRevisions: payload.aggregateRevisions,\n', '')

          # Outbox replay advances revision metadata without synthesizing a whole DB response.
          p = 'src/components/uploads/UploadManagerProvider.tsx'
          old_resume = '''      if (result.replayed && result.payload?.data && typeof result.payload.revision === "number") {\n        useRDashStore.getState().hydrateSecureWorkspace({\n          db: result.payload.data,\n          revision: result.payload.revision,\n          user: authUser,\n          rowVersions: result.payload.rowVersions,\n          aggregateRevisions: result.payload.bumpedAggregateRevisions,\n        });\n        restoredSessionRef.current = null;\n        await applyPendingOverlay();\n'''
          new_resume = '''      if (result.replayed && typeof result.payload?.revision === "number") {\n        useRDashStore.getState().acceptWorkspaceServerRevision({\n          revision: result.payload.revision,\n          rowVersions: result.payload.rowVersions,\n        });\n        restoredSessionRef.current = null;\n        await applyPendingOverlay();\n'''
          replace(p, old_resume, new_resume)

          # Retire aggregate revision fields from the outbox contract.
          p = 'src/lib/uploads/workspace-outbox-types.ts'
          text = read(p)
          text = text.replace('  expectedRevisions?: Record<string, number>;\n', '')
          text = text.replace('  bumpedAggregateRevisions?: Record<string, number>;\n', '')
          write(p, text)

          p = 'src/lib/uploads/workspace-outbox.ts'
          text = read(p)
          text = text.replace('      expectedRevisions: undefined,\n', '')
          text = text.replace('    expectedRevisions: parsed.expectedRevisions,\n', '')
          text = text.replace('          expectedRevisions: item.expectedRevisions,\n', '')
          # Compact responses remain compact; acceptedWorkspace is internal only.
          old_accept = '''  return {\n    ...payload,\n    status: payload.status || "applied",\n    operationId: payload.operationId || item.operationId,\n    patches,\n    data: acceptedWorkspace && typeof payload.revision === "number"\n      ? structuredClone(acceptedWorkspace) as RDashDatabase\n      : payload.data,\n  };\n'''
          new_accept = '''  const { data: _discardedWorkspace, ...compact } = payload;\n  return {\n    ...compact,\n    status: payload.status || "applied",\n    operationId: payload.operationId || item.operationId,\n    patches,\n  };\n'''
          if old_accept not in text: raise SystemExit('outbox compact response shape changed')
          text = text.replace(old_accept, new_accept, 1)
          old_rebase_check = '''      if (adaptedPayload.data && typeof adaptedPayload.revision === "number") {\n        await rebaseRemainingItems(adaptedPayload.data, adaptedPayload.revision);\n      }\n'''
          new_rebase_check = '''      if (acceptedWorkspace && typeof adaptedPayload.revision === "number") {\n        await rebaseRemainingItems(acceptedWorkspace, adaptedPayload.revision);\n      }\n'''
          if old_rebase_check not in text: raise SystemExit('outbox rebase accepted shape changed')
          text = text.replace(old_rebase_check, new_rebase_check, 1)
          # Remove dangerous full-workspace conflict rebase.
          text, n = re.subn(r'async function rebaseConflict\(item: WorkspaceCommitOutboxRecord\): Promise<void> \{[\s\S]*?\n\}\n\nexport async function retryWorkspaceOutbox', 'export async function retryWorkspaceOutbox', text, count=1)
          if n != 1: raise SystemExit('conflict rebase function shape changed')
          old_retry = '''  if (item.status === "conflict") {\n    await rebaseConflict(item);\n  } else {\n    await patchRecord(operationId, {\n      status: typeof navigator !== "undefined" && !navigator.onLine ? "waiting_for_network" : "pending",\n      retryAt: undefined,\n      lastErrorCode: undefined,\n      lastErrorMessage: undefined,\n    });\n  }\n'''
          new_retry = '''  if (item.status === "conflict") {\n    throw new Error("This change conflicts with newer server data and cannot be auto-overwritten. Reload the server version and reapply the intended change after review.");\n  }\n  await patchRecord(operationId, {\n    status: typeof navigator !== "undefined" && !navigator.onLine ? "waiting_for_network" : "pending",\n    retryAt: undefined,\n    lastErrorCode: undefined,\n    lastErrorMessage: undefined,\n  });\n'''
          if old_retry not in text: raise SystemExit('outbox retry conflict shape changed')
          text = text.replace(old_retry, new_retry, 1)
          # Add one-record discard for explicit conflict recovery.
          marker = '''export async function discardWorkspaceOutbox(): Promise<void> {\n'''
          addition = '''export async function discardWorkspaceOutboxItem(operationId: string): Promise<void> {\n  const item = await uploadIndexedDb.getWorkspaceOutbox(operationId);\n  if (!item || !belongsToActiveScope(item)) return;\n  await uploadIndexedDb.deleteWorkspaceOutbox(operationId);\n  await refresh();\n}\n\n'''
          if marker not in text: raise SystemExit('discard marker missing')
          text = text.replace(marker, addition + marker, 1)
          # Deferred commit response contains metadata only.
          text = text.replace('    data: acceptedWorkspace ? structuredClone(acceptedWorkspace) as RDashDatabase : undefined,\n', '')
          write(p, text)

          # Conflict UI never promises blind overwrite.
          p = 'src/components/uploads/PendingChangesPanel.tsx'
          text = read(p)
          text = text.replace(
              'import { discardWorkspaceOutbox, retryWorkspaceOutbox } from "@/lib/uploads/workspace-outbox";',
              'import { discardWorkspaceOutbox, discardWorkspaceOutboxItem, retryWorkspaceOutbox } from "@/lib/uploads/workspace-outbox";')
          text = text.replace(
              '    if (conflict && !window.confirm("Apply your locally saved version over the latest server records? Review the affected records afterward because this can replace fields changed on another device.")) return;\n',
              '')
          anchor = '''  const discard = async () => {\n'''
          conflict_action = '''  const discardConflictAndReload = async () => {\n    if (!window.confirm("Discard this conflicting local change and reload the authoritative server version? Reapply the intended change only after reviewing the latest record.")) return;\n    try {\n      await discardWorkspaceOutboxItem(item.operationId);\n      allowNextWorkspaceExit();\n      window.location.reload();\n    } catch (error) {\n      toast.error(error instanceof Error ? error.message : "The conflicting local change could not be discarded.");\n    }\n  };\n\n'''
          if anchor not in text: raise SystemExit('pending change discard anchor missing')
          text = text.replace(anchor, conflict_action + anchor, 1)
          old_button = '''            <Button size="sm" variant="outline" onClick={() => void retry()} disabled={syncing}>\n              <RefreshCw className={`mr-1 h-3.5 w-3.5 ${syncing ? "animate-spin" : ""}`} />{conflict ? "Apply my version to latest" : syncing ? "Synchronizing" : "Retry now"}\n            </Button>\n'''
          new_button = '''            <Button size="sm" variant="outline" onClick={() => void (conflict ? discardConflictAndReload() : retry())} disabled={syncing}>\n              <RefreshCw className={`mr-1 h-3.5 w-3.5 ${syncing ? "animate-spin" : ""}`} />{conflict ? "Reload server version" : syncing ? "Synchronizing" : "Retry now"}\n            </Button>\n'''
          if old_button not in text: raise SystemExit('pending change retry button shape changed')
          text = text.replace(old_button, new_button, 1)
          warning_anchor = '''          {item.lastErrorMessage ? <p className="mt-2 rounded-md bg-destructive/10 px-2 py-1.5 text-[11px] text-destructive">{item.lastErrorMessage}</p> : null}\n'''
          warning = warning_anchor + '''          {conflict ? <p className="mt-2 text-[11px] text-muted-foreground">Automatic overwrite is disabled. Reload the authoritative server record, review it, then reapply your intended change.</p> : null}\n'''
          if warning_anchor not in text: raise SystemExit('pending change warning anchor missing')
          text = text.replace(warning_anchor, warning, 1)
          write(p, text)

          # Source-level regression guardrails.
          p = 'tests/workspace-navigation-revalidation.test.ts'
          text = read(p)
          old = '''    expect(source).toContain("workspaceReadState.restoreCached(requestedTarget, cachedTarget.readState)");\n    expect(source).toContain("if (!pageCursors.length && !pageError) return null");\n'''
          new = '''    expect(source).toContain("workspaceReadState.restoreCached(requestedTarget, cachedTarget.readState)");\n    expect(source).not.toContain("db: cachedTarget.data");\n    expect(source).toContain("if (!result.changed)");\n    expect(source).toContain("acceptWorkspaceServerRevision");\n    expect(source).toContain("if (!pageCursors.length && !pageError) return null");\n'''
          if old not in text: raise SystemExit('navigation cache assertion anchor missing')
          text = text.replace(old, new, 1)
          old_delta = '''    expect(source).toContain("mergeWorkspaceRowVersions");\n'''
          new_delta = '''    expect(source).toContain("mergeWorkspaceRowVersions");\n    expect(source).toContain("changed: boolean");\n    expect(source).toContain("changed = changed || deltaChanged");\n'''
          text = text.replace(old_delta, new_delta, 1)
          write(p, text)

          p = 'tests/runtime-efficiency-hardening.test.ts'
          text = read(p)
          insert_before = '\n});\n'
          guard = '''\n  test("does not rehydrate unchanged cached modules or auto-rebase conflicts through workspace reads", async () => {\n    const boundary = await read("src/components/urban-castle/WorkspaceScopedReadBoundary.tsx");\n    const outbox = await read("src/lib/uploads/workspace-outbox.ts");\n    const cache = await read("src/lib/rdash/workspace-read-cache.ts");\n    const coreTypes = await read("src/lib/rdash/store/types.ts");\n    expect(boundary).not.toContain("db: cachedTarget.data");\n    expect(boundary).toContain("if (!result.changed)");\n    expect(boundary).toContain("acceptWorkspaceServerRevision");\n    expect(outbox).not.toContain('fetch("/api/workspace"');\n    expect(outbox).not.toContain("expectedRevisions");\n    expect(outbox).not.toContain("bumpedAggregateRevisions");\n    expect(cache).not.toContain("aggregateRevisions");\n    expect(coreTypes).not.toContain("aggregateRevisions");\n  });\n'''
          idx = text.rfind(insert_before)
          if idx < 0: raise SystemExit('runtime efficiency describe end missing')
          text = text[:idx] + guard + text[idx:]
          write(p, text)

          print('final session lifecycle fixes applied')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Run focused lifecycle tests
        run: npx vitest run tests/workspace-navigation-revalidation.test.ts tests/workspace-client-delta-sync.test.ts tests/runtime-efficiency-hardening.test.ts tests/bug-hunt-regressions.test.ts
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Commit validated lifecycle changes
        run: |
          git config user.name "akarshsinghxolo-cell"
          git config user.email "akarshsinghxolo@gmail.com"
          git add src tests
          git commit -m "Finalize persistent session revalidation lifecycle"
          git push origin HEAD:agent/page-entity-egress-architecture
