name: Agent GPS validation

on:
  push:
    branches:
      - agent/centralize-gps-acquisition

permissions:
  contents: write

jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, '[gps-validation-result]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/centralize-gps-acquisition
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Run checks and record result
        shell: bash
        run: |
          set +e
          npm ci --ignore-scripts
          npm_rc=$?

          eslint_rc=99
          tsc_rc=99
          if [ "$npm_rc" -eq 0 ]; then
            npx eslint \
              src/lib/rdash/device-gps.ts \
              src/components/rdash/SiteFormDialog.tsx \
              src/components/rdash/CustomerSiteDraftCard.tsx \
              src/components/rdash/ContractorFormDialog.tsx \
              src/components/rdash/UnifiedPartnerFormDialog.tsx \
              src/components/rdash/modules/AttendancePayrollModule.tsx \
              src/components/rdash/modules/FieldModeModule.tsx \
              src/components/rdash/AutoGeofenceMonitor.tsx \
              src/components/rdash/StaffLocationTracker.tsx
            eslint_rc=$?

            npx tsc --noEmit
            tsc_rc=$?
          fi

          mkdir -p .github
          cat > .github/gps-validation-result.txt <<EOF
          npm_ci=$npm_rc
          eslint=$eslint_rc
          tsc=$tsc_rc
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/gps-validation-result.txt
          git commit -m "[gps-validation-result] record GPS validation"
          git push origin HEAD:agent/centralize-gps-acquisition
          exit 0
