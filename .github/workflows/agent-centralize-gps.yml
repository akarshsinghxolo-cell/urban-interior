name: Agent centralize GPS acquisition

on:
  push:
    branches:
      - agent/centralize-gps-acquisition

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/centralize-gps-acquisition
          fetch-depth: 0

      - name: Apply GPS refactor
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, found {count}: {old[:100]!r}")
              file.write_text(text.replace(old, new, 1))

          def insert_after(path: str, marker: str, addition: str):
              replace_once(path, marker, marker + addition)

          # Site form: fresh, accuracy-validated master GPS; preserve reverse-geocoded full address.
          path = "src/components/rdash/SiteFormDialog.tsx"
          insert_after(
              path,
              'import { reverseGeocodeWithNominatim, searchAddressWithNominatim } from "@/lib/rdash/location-search";\n',
              'import { captureDeviceGps, deviceGpsErrorMessage } from "@/lib/rdash/device-gps";\n',
          )
          replace_once(
              path,
              '''    const captureGps = () => {
        if (!navigator.geolocation) {
            toast.error("GPS is not available on this device");
            return;
        }
        setGpsLoading(true);
        navigator.geolocation.getCurrentPosition((position) => {
            const latitude = position.coords.latitude;
            const longitude = position.coords.longitude;
            applyCoordinates(latitude, longitude);
            setGpsLoading(false);
            toast.success("Site GPS captured");
            reverseGeocodeWithNominatim(latitude, longitude)
                .then((data) => {
                const location = data?.address || {};
                setDraft((current) => ({
                    ...current,
                    address: data?.display_name || current.address,
                    city: location.city || location.town || location.village || current.city,
                    locality: location.suburb || location.neighbourhood || current.locality,
                }));
            })
                .catch(() => undefined);
        }, (error) => {
            setGpsLoading(false);
            toast.error(`GPS error: ${error.message}`);
        }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 });
    };
''',
              '''    const captureGps = async () => {
        setGpsLoading(true);
        try {
            const capture = await captureDeviceGps({ mode: "master-location" });
            const { latitude, longitude } = capture;
            applyCoordinates(latitude, longitude);
            setGpsLoading(false);
            toast.success(`Site GPS captured · ±${Math.round(capture.accuracy_m)} m`);
            void reverseGeocodeWithNominatim(latitude, longitude)
                .then((data) => {
                const location = data?.address || {};
                setDraft((current) => ({
                    ...current,
                    address: data?.display_name || current.address,
                    city: location.city || location.town || location.village || current.city,
                    locality: location.suburb || location.neighbourhood || current.locality,
                }));
                if (data?.display_name)
                    setLocationSearch(data.display_name);
            })
                .catch(() => undefined);
        }
        catch (error) {
            setGpsLoading(false);
            toast.error(`GPS error: ${deviceGpsErrorMessage(error)}`);
        }
    };
''',
          )

