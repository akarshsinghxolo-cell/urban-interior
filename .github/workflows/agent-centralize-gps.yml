              '        {/* Quick check-in uses the same configured Visit geofence radius and GPS accuracy policy as normal field actions. */}\n',
          )
          replace_once(
              path,
              'title="Find the nearest site from your GPS and auto-create + check in a visit"',
              'title={`Find the nearest site within ${normalizedAttendancePolicy.visit_geofence_radius_m}m and auto-create + check in a visit`}',
          )

          # Auto geofence: use the shared tracking watcher/options.
          path = "src/components/rdash/AutoGeofenceMonitor.tsx"
          insert_after(
              path,
              'import type { Visit } from "@/lib/rdash/types";\n',
              'import { watchDevicePosition } from "@/lib/rdash/device-gps";\n',
          )
          replace_once(
              path,
              '''        const watchId = navigator.geolocation.watchPosition(onPosition, () => {
            if (!permissionNoticeShown.current) {
                permissionNoticeShown.current = true;
                toast.info("Automatic geofence is unavailable. Use Manual Check-in / Check-out with live GPS.");
            }
        }, { enableHighAccuracy: true, maximumAge: 15000, timeout: 20000 });
        return () => navigator.geolocation.clearWatch(watchId);
''',
              '''        const stopWatching = watchDevicePosition(onPosition, () => {
            if (!permissionNoticeShown.current) {
                permissionNoticeShown.current = true;
                toast.info("Automatic geofence is unavailable. Use Manual Check-in / Check-out with live GPS.");
            }
        });
        return stopWatching;
''',
          )

          # Staff route tracker: shared tracking watcher + heartbeat acquisition + common GPS errors.
          path = "src/components/rdash/StaffLocationTracker.tsx"
          insert_after(
              path,
              '} from "@/lib/rdash/staff-route-client";\n',
              'import { captureDevicePosition, deviceGpsErrorMessage, watchDevicePosition } from "@/lib/rdash/device-gps";\n',
          )
          replace_once(
              path,
              '''const POSITION_OPTIONS: PositionOptions = {
  enableHighAccuracy: true,
  maximumAge: 15_000,
  timeout: 20_000,
};

''',
              '',
          )
          replace_once(
              path,
              '''function geolocationMessage(error: GeolocationPositionError) {
  if (error.code === error.PERMISSION_DENIED) {
    return "Location permission is blocked. Allow precise location in browser settings.";
  }
  if (error.code === error.POSITION_UNAVAILABLE) {
    return "This device cannot determine a reliable GPS position.";
  }
  if (error.code === error.TIMEOUT) {
    return "Location timed out. Frontend route capture will retry.";
  }
  return error.message || "Location capture failed.";
}

''',
              '',
          )
          replace_once(
              path,
              '''    const onError = (error: GeolocationPositionError) => {
      const denied = error.code === error.PERMISSION_DENIED;
      publishLocationTrackingState({
        status: denied ? "permission_denied" : "error",
        permission: denied
          ? "denied"
          : readLocationTrackingState().permission,
        message: geolocationMessage(error),
      });
    };

    const requestCurrentPosition = () => {
      if (disposed || document.visibilityState !== "visible") return;
      navigator.geolocation.getCurrentPosition(
        capture,
        onError,
        POSITION_OPTIONS,
      );
    };

    const watchId = navigator.geolocation.watchPosition(
      capture,
      onError,
      POSITION_OPTIONS,
    );
''',
              '''    const onError = (error: unknown) => {
      const denied = (error as GeolocationPositionError | undefined)?.code === 1;
      publishLocationTrackingState({
        status: denied ? "permission_denied" : "error",
        permission: denied
          ? "denied"
          : readLocationTrackingState().permission,
        message: deviceGpsErrorMessage(error),
      });
    };

    const requestCurrentPosition = () => {
      if (disposed || document.visibilityState !== "visible") return;
      void captureDevicePosition({ mode: "tracking" }).then(capture).catch(onError);
    };

    const stopWatching = watchDevicePosition(capture, onError);
''',
          )
          replace_once(
              path,
              '      navigator.geolocation.clearWatch(watchId);\n',
              '      stopWatching();\n',
          )

          # The patch workflow is intentionally self-removing so only product code remains on the branch.
          Path(".github/workflows/agent-centralize-gps.yml").unlink()
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Validate changed TypeScript
        id: validate
        continue-on-error: true
        shell: bash
        run: |
          npm ci --ignore-scripts
          npx eslint \
            src/lib/rdash/device-gps.ts \
            src/components/rdash/SiteFormDialog.tsx \
            src/components/rdash/CustomerSiteDraftCard.tsx \
            src/components/rdash/ContractorFormDialog.tsx \
            src/components/rdash/UnifiedPartnerFormDialog.tsx \
            src/components/rdash/modules/AttendancePayrollModule.tsx \
            src/components/rdash/modules/FieldModeModule.tsx \
            src/components/rdash/AutoGeofenceMonitor.tsx \
            src/components/rdash/StaffLocationTracker.tsx
          npx tsc --noEmit

      - name: Commit product changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if [ "${{ steps.validate.outcome }}" = "success" ]; then
            message="use shared GPS acquisition (validation passed)"
          else
            message="use shared GPS acquisition (validation needs review)"
          fi
          git commit -m "$message"
          git push origin HEAD:agent/centralize-gps-acquisition
