name: One-shot reconcile PR 145

on:
  push:
    branches:
      - integration/pr145-current-main

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: integration/pr145-current-main
      - name: Reconcile record Files UX onto current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin agent/file-preview-ux

          # Bring over the reusable exact-record file panel and the small tab wiring,
          # but do not overwrite the newer authenticated Drive-proxy preview implementation.
          git show origin/agent/file-preview-ux:src/components/rdash/EntityFiles.tsx > src/components/rdash/EntityFiles.tsx
          git diff --binary 810707399afa1e744350826f6dd31bf0af506ae5 origin/agent/file-preview-ux -- src/components/rdash/DetailPanelWithHistory.tsx > /tmp/pr145-detail.patch
          git apply --3way --index /tmp/pr145-detail.patch

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          entity = Path("src/components/rdash/EntityFiles.tsx")
          text = entity.read_text()
          text = text.replace(
              '() => queue.items.filter((item) => item.targetEntityType === entityType && item.targetEntityId === entityId),',
              '() => queue.items.filter((item) => item.targetEntityType === entityType && item.targetEntityId === entityId && item.status !== "completed" && item.status !== "cancelled"),',
              1,
          )
          entity.write_text(text)

          preview = Path("src/components/rdash/FilePreview.tsx")
          text = preview.read_text()
          text = text.replace(
              'function FileViewer({ file, open, onOpenChange }: {\n    file: FilePreviewSource;\n    open: boolean;\n    onOpenChange: (value: boolean) => void;\n}) {',
              'function FileViewer({ file, open, onOpenChange, controls }: {\n    file: FilePreviewSource;\n    open: boolean;\n    onOpenChange: (value: boolean) => void;\n    controls: boolean;\n}) {',
              1,
          )
          text = text.replace(
              '<DialogContent className="max-h-[calc(100vh-2rem)] max-w-6xl overflow-hidden p-0 sm:max-w-6xl">',
              '<DialogContent className="h-dvh w-screen max-w-none overflow-hidden rounded-none border-0 p-0 sm:h-auto sm:max-h-[calc(100vh-2rem)] sm:max-w-6xl sm:rounded-lg sm:border">',
              1,
          )
          text = text.replace(
              '<DialogDescription className="sr-only">Full preview loaded directly from Google Drive or the selected local file.</DialogDescription>',
              '<DialogDescription className="sr-only">Full preview of the selected file.</DialogDescription>',
              1,
          )
          footer = '<div className="flex flex-wrap justify-end gap-2 border-t border-border px-4 py-3">\n          {downloadUrl ? <a href={downloadUrl} className="inline-flex h-8 items-center gap-1.5 rounded-md border border-border px-3 text-xs font-medium text-primary hover:bg-accent/40"><Download className="h-3.5 w-3.5"/>Download</a> : null}\n          {driveUrl ? <a href={driveUrl} target="_blank" rel="noreferrer" className="inline-flex h-8 items-center gap-1.5 rounded-md border border-border px-3 text-xs font-medium text-primary hover:bg-accent/40"><ExternalLink className="h-3.5 w-3.5"/>Open in Google Drive</a> : null}\n        </div>'
          if footer not in text:
              raise SystemExit("FilePreview footer shape changed")
          text = text.replace(footer, '{controls ? ' + footer + ' : null}', 1)
          text = text.replace(
              'export function FilePreview({ file, className, compact = false, controls: _controls = true, onOpen, interactive = true }: FilePreviewProps) {',
              'export function FilePreview({ file, className, compact = false, controls = true, onOpen, interactive = true }: FilePreviewProps) {',
              1,
          )
          text = text.replace(
              'const actionOverlay = interactive ? <span className="absolute right-1.5 top-1.5 flex h-6 w-6 items-center justify-center rounded-full bg-black/65 text-white opacity-0 transition-opacity group-hover:opacity-100"><ZoomIn className="h-3.5 w-3.5"/></span> : null;',
              'const actionOverlay = interactive ? <span className="absolute right-1.5 top-1.5 flex h-6 w-6 items-center justify-center rounded-full bg-black/65 text-white opacity-100 transition-opacity sm:opacity-0 sm:group-hover:opacity-100"><ZoomIn className="h-3.5 w-3.5"/></span> : null;',
              1,
          )
          text = text.replace(
              '<span className="pointer-events-none absolute inset-x-0 bottom-0 truncate bg-black/60 px-1.5 py-1 text-[10px] text-white opacity-0 transition-opacity group-hover:opacity-100">{file.fileName}</span>',
              '<span className="pointer-events-none absolute inset-x-0 bottom-0 truncate bg-black/60 px-1.5 py-1 text-[10px] text-white opacity-100 transition-opacity sm:opacity-0 sm:group-hover:opacity-100">{file.fileName}</span>',
              1,
          )
          text = text.replace(
              '<FileViewer file={file} open={viewerOpen} onOpenChange={setViewerOpen}/>',
              '<FileViewer file={file} open={viewerOpen} onOpenChange={setViewerOpen} controls={controls}/>',
              1,
          )
          preview.write_text(text)
          PY

          cat > tests/entity-files.test.ts <<'EOF'
          import { describe, expect, it } from "vitest";
          import { detailKindToFileEntityType } from "../src/components/rdash/EntityFiles";

          describe("record Files detail mapping", () => {
            it("maps detail records to their canonical attachment owners", () => {
              expect(detailKindToFileEntityType("customer")).toBe("customer");
              expect(detailKindToFileEntityType("area")).toBe("room");
              expect(detailKindToFileEntityType("workOrder")).toBe("workOrder");
              expect(detailKindToFileEntityType("vendorBill")).toBe("vendor_bill");
              expect(detailKindToFileEntityType("po")).toBe("purchase_order");
            });

            it("does not invent attachment ownership for unknown detail kinds", () => {
              expect(detailKindToFileEntityType("unknown-kind")).toBeNull();
              expect(detailKindToFileEntityType()).toBeNull();
            });
          });
          EOF

          git add src tests/entity-files.test.ts
          git rm .github/workflows/one-shot-integrate-pr145.yml
          git diff --cached --check
          git commit -m "feat: reconcile record Files tab with current preview stack"
          git push origin HEAD:integration/pr145-current-main
