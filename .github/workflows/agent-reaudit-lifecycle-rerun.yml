name: Agent reaudit lifecycle rerun

on:
  push:
    branches: [agent/page-entity-egress-architecture]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Rerun audited workspace lifecycle fixes'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/page-entity-egress-architecture
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Apply the already-audited patch exactly
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/agent-reaudit-lifecycle-fix.yml').read_text()
          start_marker = "          python <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = workflow[start:end]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in script.splitlines())
          exec(compile(script, 'audited-lifecycle-patch.py', 'exec'), {})
          PY
      - name: Install dependencies
        run: npm ci
      - name: Run focused regressions
        run: npx vitest run tests/workspace-session-merge.test.ts tests/runtime-efficiency-hardening.test.ts tests/workspace-navigation-revalidation.test.ts tests/workspace-client-delta-sync.test.ts tests/workspace-delta-sync.test.ts tests/workspace-entity-scoped-read.test.ts tests/workspace-module-scoped-read.test.ts tests/workspace-bootstrap-scoped-flow.test.ts
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Commit validated fixes
        shell: bash
        run: |
          git config user.name "akarshsinghxolo-cell"
          git config user.email "akarshsinghxolo@gmail.com"
          git add src tests
          if git diff --cached --quiet; then
            echo "No application changes to commit"
            exit 0
          fi
          git commit -m "Fix audited workspace lifecycle races"
          git push origin HEAD:agent/page-entity-egress-architecture
