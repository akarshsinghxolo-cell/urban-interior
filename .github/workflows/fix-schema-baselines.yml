name: Fix schema baselines

on:
  push:
    branches:
      - agent/fix-schema-baselines

permissions:
  contents: write

jobs:
  fix-schema-baselines:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove deprecated bootstrap objects
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def sub_once(text: str, pattern: str, replacement: str, label: str, flags: int = 0) -> str:
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f"Expected exactly one {label}; found {count}")
              return updated

          schema_path = Path("supabase/schema.sql")
          schema = schema_path.read_text(encoding="utf-8")

          schema = sub_once(
              schema,
              r"\A-- ={76}\n-- Urban Castle — canonical Supabase schema\..*?-- ={76}\n",
              """-- ============================================================================
          -- Urban Castle — bootstrap schema for authentication, settings, staff profiles,
          -- and normalized GPS telemetry. Workspace business data is stored in the
          -- revisioned entity_* tables and committed through commit_workspace_operations().
          --
          -- Tables (4 total):
          --   rdash_user_roles    - maps Supabase Auth users to app roles/approval status
          --   \"GenericRecord\"     - JSON key/value store for settings such as Google Drive
          --   \"StaffProfile\"      - normalized staff identity/profile records
          --   \"StaffLocationPing\" - normalized append-oriented GPS telemetry
          --
          -- Safe to re-run: every statement is idempotent (if not exists / or replace).
          -- ============================================================================
          """,
              "schema header",
              re.S,
          )

          schema = sub_once(
              schema,
              r"\n-- -{76}\n-- WorkspaceMeta — one row per workspace, tracks the snapshot revision\n-- -{76}\ncreate table if not exists public\.\"WorkspaceMeta\" \(\n.*?\n\);\n",
              "\n",
              "WorkspaceMeta table block",
              re.S,
          )
          schema = sub_once(
              schema,
              r"-- Row Level Security — these 4 tables are only ever touched by the app's",
              "-- Row Level Security — these 3 tables are only ever touched by the app's",
              "RLS table count",
          )
          schema = sub_once(
              schema,
              r'\nalter table public\.\"WorkspaceMeta\" enable row level security;',
              "",
              "WorkspaceMeta RLS statement",
          )
          schema = sub_once(
              schema,
              r"\n-- -{76}\n-- write_workspace_snapshot — atomically writes a new workspace snapshot and\n.*?grant execute on function public\.write_workspace_snapshot\(text, text, integer\) to service_role;\n?",
              "\n",
              "write_workspace_snapshot function block",
              re.S,
          )

          forbidden_schema = ("WorkspaceMeta", "write_workspace_snapshot", "workspace.snapshot")
          for token in forbidden_schema:
              if token in schema:
                  raise SystemExit(f"Deprecated token still present in schema.sql: {token}")
          if 'create table if not exists public."GenericRecord"' not in schema:
              raise SystemExit("GenericRecord was removed unexpectedly")
          if 'create table if not exists public."StaffLocationPing"' not in schema:
              raise SystemExit("Normalized StaffLocationPing was removed unexpectedly")
          schema_path.write_text(schema, encoding="utf-8")

          entity_path = Path("supabase/schema-entity-tables.sql")
          entity = entity_path.read_text(encoding="utf-8")

          for table_name in ("entity_staffLocationPings", "entity_staffAuthUsers"):
              pattern = (
                  rf'\ncreate table if not exists public\.\"{table_name}\" \(\n'
                  rf'.*?\n\);\n\n'
                  rf'create index if not exists \"{table_name}_workspace_idx\" on public\.\"{table_name}\" \(workspace_id\);\n'
                  rf'create index if not exists \"{table_name}_revision_idx\" on public\.\"{table_name}\" \(revision\);\n'
              )
              entity = sub_once(entity, pattern, "\n", f"{table_name} table block", re.S)
              entity = sub_once(
                  entity,
                  rf"\n    '{table_name}',",
                  "",
                  f"{table_name} RLS-list entry",
              )

          table_count = len(re.findall(r'create table if not exists public\.\"entity_', entity))
          entity = sub_once(
              entity,
              r"-- One table per collection \(\d+ total\)\.",
              f"-- One table per collection ({table_count} total).",
              "entity table count header",
          )
          entity = sub_once(
              entity,
              r"-- Done\. \d+ entity_\* tables \(including entity_auditLog\) \+ entity_workspace_revision",
              f"-- Done. {table_count} entity_* tables (including entity_auditLog) + entity_workspace_revision",
              "entity table count footer",
          )

          for token in ("entity_staffLocationPings", "entity_staffAuthUsers"):
              if token in entity:
                  raise SystemExit(f"Deprecated workspace mirror still present: {token}")
          if 'create table if not exists public."StaffLocationPing"' not in entity:
              raise SystemExit("Normalized StaffLocationPing was removed unexpectedly")
          if "'entity_master_staff'," not in entity:
              raise SystemExit("Canonical HR staff collection was removed unexpectedly")
          entity_path.write_text(entity, encoding="utf-8")
          PY

      - name: Validate resulting SQL sources
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          ! grep -Eq 'WorkspaceMeta|write_workspace_snapshot|workspace\.snapshot' supabase/schema.sql
          ! grep -Eq 'entity_staffLocationPings|entity_staffAuthUsers' supabase/schema-entity-tables.sql
          grep -Fq 'create table if not exists public."GenericRecord"' supabase/schema.sql
          grep -Fq 'create table if not exists public."StaffLocationPing"' supabase/schema.sql
          grep -Fq 'create table if not exists public."StaffLocationPing"' supabase/schema-entity-tables.sql
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "supabase/schema-entity-tables.sql supabase/schema.sql "

      - name: Commit corrected baselines
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fix-schema-baselines.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Align schema baselines with live database"
          git push origin HEAD:agent/fix-schema-baselines
