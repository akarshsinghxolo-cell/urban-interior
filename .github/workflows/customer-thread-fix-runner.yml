name: Customer conversation creation fix

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate-and-commit:
    if: github.head_ref == 'agent/fix-customer-conversation-create'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Apply canonical Customer conversation fix
        run: python scripts/apply-customer-conversation-create-fix.py
      - name: Install dependencies
        run: npm ci
      - name: Test Customer conversation creation
        run: npx vitest run tests/customer-thread-canonicalization.test.ts tests/customer-sites-save.test.ts
      - name: Typecheck application
        run: npx tsc --noEmit
      - name: Lint application
        run: npm run lint
      - name: Build application
        run: npm run build
      - name: Commit validated fix and remove runner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm scripts/apply-customer-conversation-create-fix.py
          rm .github/workflows/customer-thread-fix-runner.yml
          git add -A
          git commit -m "Fix Customer conversation thread creation"
          git push origin HEAD:agent/fix-customer-conversation-create
