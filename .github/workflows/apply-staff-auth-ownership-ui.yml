name: Apply Staff auth ownership UI patch

on:
  push:
    branches:
      - agent/supabase-data-convergence

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/supabase-data-convergence
          fetch-depth: 0
      - name: Apply Staff auth ownership UI patch
        run: python scripts/patch-staff-auth-ownership.py
      - name: Remove one-shot patch machinery
        run: |
          rm scripts/patch-staff-auth-ownership.py
          rm .github/workflows/apply-staff-auth-ownership-ui.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Route Staff login changes through User Approvals"
          git push origin HEAD:agent/supabase-data-convergence
