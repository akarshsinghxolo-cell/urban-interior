name: Apply unified Customer and Sites patch

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Apply reviewed integration
        run: |
          python scripts/apply-unified-customer-sites.py
          python scripts/fix-unified-customer-sites-types.py
      - name: Keep workflow changes for connector commit
        run: git restore .github/workflows/application-ci.yml .github/workflows/tmp-unified-customer-sites.yml
      - name: Install and validate focused behavior
        run: |
          bun install --frozen-lockfile
          bun run test:customer-sites-save
          bun run test:customer-sites-legacy
          bun run test:phase2b
          bun run build
      - name: Commit application changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src tests scripts/apply-unified-customer-sites.py scripts/fix-unified-customer-sites-types.py
          git diff --cached --quiet && exit 0
          git commit -m "Unify Customer and Sites create and edit workflow"
          git push origin HEAD:${{ github.head_ref }}
