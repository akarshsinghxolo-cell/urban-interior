name: Run PostgREST egress hardening patch

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Execute embedded patch
        shell: python
        run: |
          from pathlib import Path

          workflow = Path('.github/workflows/tmp-egress-hardening.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(workflow) if line.strip() == '- name: Apply egress hardening')
          run_line = next(i for i in range(start, len(workflow)) if workflow[i].strip() == 'run: |')
          script = []
          for line in workflow[run_line + 1:]:
              if line.startswith('          '):
                  script.append(line[10:])
              else:
                  break
          if not script:
              raise SystemExit('Embedded patch script was not found.')
          code = '\n'.join(script) + '\n'
          exec(compile(code, 'embedded-egress-patch.py', 'exec'), {'__name__': '__main__'})
          Path('.github/workflows/tmp-egress-pr-runner.yml').unlink()

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Eliminate repeated PostgREST workspace egress"
          git push origin HEAD:${{ github.head_ref }}
