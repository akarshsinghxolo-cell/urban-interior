          )

          # Outbox replay commit acceptance must update/delete CAS metadata too.
          patch(
              'src/components/uploads/UploadManagerProvider.tsx',
              '''import { useRDashStore } from "@/lib/rdash/store";''',
              '''import { useRDashStore } from "@/lib/rdash/store";\nimport { deletedWorkspaceOperationVersionKeys } from "@/lib/rdash/workspace-row-version-state";'''
          )
          patch(
              'src/components/uploads/UploadManagerProvider.tsx',
              '''          rowVersions: result.payload.rowVersions,\n        });''',
              '''          rowVersions: result.payload.rowVersions,\n          deletedRowVersionKeys: deletedWorkspaceOperationVersionKeys(result.payload.patches || []),\n        });'''
          )

          # Bootstrap must not mark the shell ready if hydration rejects it.
          patch(
              'src/components/rdash/RDashApp.tsx',
              '''            useRDashStore.getState().hydrateSecureWorkspace({\n                db: payload.data,\n                revision: payload.revision,\n                user: payload.user,\n                rowVersions: payload.rowVersions,\n            });\n            workspaceFoundationRevisionState.replace(payload.revision);''',
              '''            const hydrated = useRDashStore.getState().hydrateSecureWorkspace({\n                db: payload.data,\n                revision: payload.revision,\n                user: payload.user,\n                rowVersions: payload.rowVersions,\n            });\n            if (!hydrated)\n                throw new Error("The workspace bootstrap was older than the active browser session. Reload to establish a clean revision epoch.");\n            workspaceFoundationRevisionState.replace(payload.revision);'''
          )

          # Focused regression coverage.
          patch(
