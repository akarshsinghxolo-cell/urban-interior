              '''    expect(outbox).toContain("beginWorkspaceOutboxResetBarrier");\n    expect(outbox).toContain("if (resetBarrier) return { replayed: false, conflict: false }");\n    expect(outbox).toContain("resetWorkspaceOutboxAfterWorkspaceReset");\n    expect(outbox).toContain("await uploadIndexedDb.deleteWorkspaceOutbox(item.operationId)");'''
          )
          patch(
