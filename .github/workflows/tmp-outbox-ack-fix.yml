name: Apply outbox acknowledgement fix

on:
  push:
    branches:
      - fix/outbox-acknowledgement-order

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/outbox-acknowledgement-order
          fetch-depth: 0

      - name: Patch successful acknowledgement ordering
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/lib/uploads/workspace-outbox.ts")
          text = path.read_text(encoding="utf-8")
          old = '''  if (response.ok) {
    const adaptedPayload = acceptCompactCommit(current, payload);
    await uploadIndexedDb.deleteWorkspaceOutbox(operationId);
    if (adaptedPayload.data && typeof adaptedPayload.revision === "number") {
      await rebaseRemainingItems(adaptedPayload.data, adaptedPayload.revision);
    } else {
      await refresh();
    }
    return responseWithPayload(response, adaptedPayload);
  }
'''
          new = '''  if (response.ok) {
    // A successful HTTP response is the durable acknowledgement. Clear the
    // local queue item before adapting the compact payload so a client-only
    // hydration/rebase failure cannot leave an already-applied change falsely
    // displayed as pending.
    await uploadIndexedDb.deleteWorkspaceOutbox(operationId);
    await refresh();

    let adaptedPayload = payload;
    try {
      adaptedPayload = acceptCompactCommit(current, payload);
      if (adaptedPayload.data && typeof adaptedPayload.revision === "number") {
        await rebaseRemainingItems(adaptedPayload.data, adaptedPayload.revision);
      }
    } catch (error) {
      console.error(
        "[WorkspaceOutbox] Server accepted the change, but local response adaptation failed.",
        error,
      );
    }
    return responseWithPayload(response, adaptedPayload);
  }
'''
          if text.count(old) != 1:
              raise SystemExit(f"Expected one success acknowledgement block, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

          test = Path("tests/workspace-outbox-acknowledgement.test.ts")
          test.write_text('''import { describe, expect, test } from "bun:test";\n\nconst source = await Bun.file("src/lib/uploads/workspace-outbox.ts").text();\n\ndescribe("workspace outbox acknowledgement", () => {\n  test("clears a server-accepted item before compact response adaptation", () => {\n    const successBlock = source.slice(\n      source.indexOf("  if (response.ok) {"),\n      source.indexOf("  const retryCount", source.indexOf("  if (response.ok) {")),\n    );\n    const deleteIndex = successBlock.indexOf("deleteWorkspaceOutbox(operationId)");\n    const adaptIndex = successBlock.indexOf("acceptCompactCommit(current, payload)");\n    expect(deleteIndex).toBeGreaterThanOrEqual(0);\n    expect(adaptIndex).toBeGreaterThan(deleteIndex);\n    expect(successBlock).toContain("await refresh()");\n    expect(successBlock).toContain("local response adaptation failed");\n  });\n});\n''', encoding="utf-8")

          Path(".github/workflows/tmp-outbox-ack-fix.yml").unlink()
          Path(".outbox-ack-trigger").unlink(missing_ok=True)

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/uploads/workspace-outbox.ts tests/workspace-outbox-acknowledgement.test.ts .github/workflows/tmp-outbox-ack-fix.yml .outbox-ack-trigger
          git commit -m "Clear accepted workspace commits before local adaptation"
          git push origin HEAD:fix/outbox-acknowledgement-order
