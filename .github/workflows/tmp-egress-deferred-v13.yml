name: Apply deferred PostgREST egress fixes v13

on:
  pull_request:
    branches: [main]
    types: [reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply deferred fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str):
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:100]!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          # Login welcome shares the same in-flight/cache-backed health request.
          app_path = Path("src/components/rdash/RDashApp.tsx")
          app = app_path.read_text(encoding="utf-8")
          app = app.replace(
              'import { initAuthFetch, clearSessionToken, getSessionToken } from "@/lib/rdash/client-auth";',
              'import { initAuthFetch, clearSessionToken } from "@/lib/rdash/client-auth";\nimport { loadWorkspaceHealth } from "@/lib/rdash/workspace-health-client";',
              1,
          )
          fetch_pattern = re.compile(
              r'''        const token = getSessionToken\(\);\n        fetch\("/api/health/summary", \{\n            headers: token \? \{ Authorization: `Bearer \$\{token\}` \} : \{\},\n        \}\)\n            \.then\(\(r\) => \(r\.ok \? r\.json\(\) : null\)\)\n            \.then\(\(summary: any\) => \{'''
          )
          app, count = fetch_pattern.subn(
              '''        void loadWorkspaceHealth()\n            .then((summary: any) => {''',
              app,
              count=1,
          )
          if count != 1:
              raise SystemExit(f"RDashApp health request match count: {count}")
          app_path.write_text(app, encoding="utf-8")

          # Work & Rate Master upserts use row-targeted authorization/validation.
          targeted_path = Path("src/lib/rdash/server/targeted-commit.ts")
          targeted = targeted_path.read_text(encoding="utf-8")
          targeted = targeted.replace(
              'const TARGETED_COLLECTIONS = new Set(["tasks", "followups", "visits", "threads", "auditLog"]);',
              'const TARGETED_COLLECTIONS = new Set(["tasks", "followups", "visits", "threads", "auditLog", "master.units", "master.workCategories", "master.workSubcategories", "master.articles", "master.articleVariants", "master.subcategoryArticleMap", "master.workOptionGroups", "master.workOptionValues"]);',
              1,
          )
          targeted = targeted.replace(
              'if (["tasks", "followups", "visits", "threads"].includes(operation.collection) && upserts.length) {',
              'if (operation.collection !== "auditLog" && upserts.length) {',
              1,
          )
          visit_marker = '''  if (collection === "visits") {\n    addId(plan, "master.staff", row.staff_id);\n    addId(plan, "master.vendors", row.vendor_id);\n    addId(plan, "master.contractors", row.contractor_id);\n  }\n\n'''
          master_dependencies = visit_marker + '''  if (collection === "master.workSubcategories") {\n    addId(plan, "master.workCategories", row.category_id);\n    addId(plan, "master.units", row.unit_id);\n  } else if (collection === "master.articles") {\n    addId(plan, "master.workCategories", row.category_id);\n    addId(plan, "master.units", row.unit_id || row.default_unit_id);\n  } else if (collection === "master.articleVariants") {\n    addId(plan, "master.articles", row.article_id);\n    addId(plan, "master.units", row.unit_id);\n  } else if (collection === "master.subcategoryArticleMap") {\n    addId(plan, "master.workSubcategories", row.work_required_id);\n    addId(plan, "master.articles", row.article_id);\n    addId(plan, "master.units", row.unit_id);\n  } else if (collection === "master.workOptionGroups") {\n    addId(plan, "master.workSubcategories", row.work_subcategory_id || row.work_required_id);\n  } else if (collection === "master.workOptionValues") {\n    addId(plan, "master.workOptionGroups", row.group_id || row.option_group_id);\n  }\n\n'''
          if targeted.count(visit_marker) != 1:
              raise SystemExit(f"Targeted visit marker count: {targeted.count(visit_marker)}")
          targeted = targeted.replace(visit_marker, master_dependencies, 1)
          collection_marker = '''    "payments", "invoices", "contractorPayments", "contractorBills",\n  ];'''
          collection_replacement = '''    "payments", "invoices", "contractorPayments", "contractorBills",\n    "master.units", "master.workCategories", "master.workSubcategories", "master.articles",\n    "master.articleVariants", "master.subcategoryArticleMap", "master.workOptionGroups", "master.workOptionValues",\n  ];'''
          if targeted.count(collection_marker) != 1:
              raise SystemExit(f"Targeted collection marker count: {targeted.count(collection_marker)}")
          targeted = targeted.replace(collection_marker, collection_replacement, 1)
          validation_marker = '''        } else if (operation.collection === "threads") {\n          validateThread(row as unknown as Thread, database);\n        }'''
          validation_replacement = '''        } else if (operation.collection === "threads") {\n          validateThread(row as unknown as Thread, database);\n        } else if (operation.collection.startsWith("master.")) {\n          const name = typeof row.name === "string" ? row.name.trim() : "";\n          if (["master.units", "master.workCategories", "master.workSubcategories", "master.articles", "master.articleVariants", "master.workOptionGroups", "master.workOptionValues"].includes(operation.collection) && !name) {\n            throw new Error(`${operation.collection}: name is required.`);\n          }\n          const exists = (collection: string, value: unknown) => !value || rowsFor(database, collection).some((candidate) => rowId(candidate) === String(value));\n          if (operation.collection === "master.workSubcategories") {\n            if (!exists("master.workCategories", row.category_id)) throw new Error("Work sub-category category does not exist.");\n            if (!exists("master.units", row.unit_id)) throw new Error("Work sub-category unit does not exist.");\n          } else if (operation.collection === "master.articles") {\n            if (!exists("master.workCategories", row.category_id)) throw new Error("Article category does not exist.");\n            if (!exists("master.units", row.unit_id || row.default_unit_id)) throw new Error("Article unit does not exist.");\n          } else if (operation.collection === "master.articleVariants") {\n            if (!exists("master.articles", row.article_id)) throw new Error("Variant article does not exist.");\n            if (!exists("master.units", row.unit_id)) throw new Error("Variant unit does not exist.");\n          } else if (operation.collection === "master.subcategoryArticleMap") {\n            if (!exists("master.workSubcategories", row.work_required_id)) throw new Error("Scoped material sub-category does not exist.");\n            if (!exists("master.articles", row.article_id)) throw new Error("Scoped material article does not exist.");\n            if (!exists("master.units", row.unit_id)) throw new Error("Scoped material unit does not exist.");\n          }\n        }'''
          if targeted.count(validation_marker) != 1:
              raise SystemExit(f"Targeted validation marker count: {targeted.count(validation_marker)}")
          targeted_path.write_text(targeted.replace(validation_marker, validation_replacement, 1), encoding="utf-8")

          # Health response reports its serialized byte size and uses a five-minute private cache.
          health_path = Path("src/app/api/health/summary/route.ts")
          health = health_path.read_text(encoding="utf-8")
          health_old = '''    return NextResponse.json(\n      {\n        status: "ok",\n        timestamp: new Date().toISOString(),\n        user: { name: user.name, email: user.email, role: user.role },\n        ...summary,\n      },\n      {\n        headers: {\n          "Cache-Control": "private, max-age=60, stale-while-revalidate=300",\n          "Vary": "Authorization, Cookie",\n          "X-UC-Health-Collections": String(summary.collectionCount),\n          "X-UC-Health-Queries": String(summary.queryCount),\n          "X-UC-Health-Load-Ms": String(summary.loadMs),\n        },\n      },\n    );'''
          health_new = '''    const payload = {\n      status: "ok",\n      timestamp: new Date().toISOString(),\n      user: { name: user.name, email: user.email, role: user.role },\n      ...summary,\n    };\n    const body = JSON.stringify(payload);\n    const responseBytes = Buffer.byteLength(body);\n    console.info("[workspace-health-response]", { responseBytes });\n    return new NextResponse(body, {\n      headers: {\n        "Content-Type": "application/json",\n        "Cache-Control": "private, max-age=300, stale-while-revalidate=3600",\n        "Vary": "Authorization, Cookie",\n        "X-UC-Health-Collections": String(summary.collectionCount),\n        "X-UC-Health-Queries": String(summary.queryCount),\n        "X-UC-Health-Load-Ms": String(summary.loadMs),\n        "X-UC-Response-Bytes": String(responseBytes),\n      },\n    });'''
          if health.count(health_old) != 1:
              raise SystemExit(f"Health response marker count: {health.count(health_old)}")
          health_path.write_text(health.replace(health_old, health_new, 1), encoding="utf-8")

          # Workspace responses use one serialization and expose response bytes.
          route_path = Path("src/app/api/workspace/route.ts")
          route = route_path.read_text(encoding="utf-8")
          user_marker = '''function userPayload(user: Awaited<ReturnType<typeof requireSession>>) {\n  return {\n    name: user.name,\n    email: user.email,\n    role: user.role,\n    staffId: user.staffId,\n    expiresAt: user.expiresAt,\n  };\n}\n'''
          helper = user_marker + '''\nfunction workspaceJson(payload: Record<string, unknown>, headers: Record<string, string>) {\n  const body = JSON.stringify(payload);\n  const responseBytes = Buffer.byteLength(body);\n  return {\n    response: new NextResponse(body, {\n      headers: { "Content-Type": "application/json", ...headers, "X-UC-Response-Bytes": String(responseBytes) },\n    }),\n    responseBytes,\n  };\n}\n'''
          if route.count(user_marker) != 1:
              raise SystemExit(f"Workspace user marker count: {route.count(user_marker)}")
          route = route.replace(user_marker, helper, 1)

          entity_old = '''        return NextResponse.json({\n          revision: workspace.revision,\n          data: workspace.data,\n          ...(workspace.rowVersions ? { rowVersions: workspace.rowVersions } : {}),\n          user: userPayload(user),\n        }, {\n          headers: responseHeaders(workspace.mode, workspace.queryCount, workspace.loadMs, {\n            collectionCount: workspace.collectionCount,\n            rowCount: workspace.rowCount,\n            entityKind: workspace.entityKind,\n            entityId: workspace.entityId,\n          }),\n        });'''
          entity_new = '''        const measured = workspaceJson({\n          revision: workspace.revision,\n          data: workspace.data,\n          ...(workspace.rowVersions ? { rowVersions: workspace.rowVersions } : {}),\n          user: userPayload(user),\n        }, responseHeaders(workspace.mode, workspace.queryCount, workspace.loadMs, {\n          collectionCount: workspace.collectionCount,\n          rowCount: workspace.rowCount,\n          entityKind: workspace.entityKind,\n          entityId: workspace.entityId,\n        }));\n        console.info("[workspace-response]", { mode: workspace.mode, responseBytes: measured.responseBytes });\n        return measured.response;'''
          module_old = '''        return NextResponse.json({\n          revision: workspace.revision,\n          data: workspace.data,\n          ...(workspace.rowVersions ? { rowVersions: workspace.rowVersions } : {}),\n          user: userPayload(user),\n        }, {\n          headers: responseHeaders(workspace.scope, workspace.queryCount, workspace.loadMs, {\n            collectionCount: workspace.collectionCount,\n          }),\n        });'''
          module_new = '''        const measured = workspaceJson({\n          revision: workspace.revision,\n          data: workspace.data,\n          ...(workspace.rowVersions ? { rowVersions: workspace.rowVersions } : {}),\n          user: userPayload(user),\n        }, responseHeaders(workspace.scope, workspace.queryCount, workspace.loadMs, {\n          collectionCount: workspace.collectionCount,\n        }));\n        console.info("[workspace-response]", { mode: workspace.scope, responseBytes: measured.responseBytes });\n        return measured.response;'''
          full_old = '''    return NextResponse.json({\n      revision: full.workspace.revision,\n      data: full.workspace.data,\n      ...(full.workspace.rowVersions ? { rowVersions: full.workspace.rowVersions } : {}),\n      user: userPayload(user),\n    }, { headers: responseHeaders(mode, full.queryCount, full.loadMs) });'''
          full_new = '''    const measured = workspaceJson({\n      revision: full.workspace.revision,\n      data: full.workspace.data,\n      ...(full.workspace.rowVersions ? { rowVersions: full.workspace.rowVersions } : {}),\n      user: userPayload(user),\n    }, responseHeaders(mode, full.queryCount, full.loadMs));\n    console.info("[workspace-response]", { mode, responseBytes: measured.responseBytes });\n    return measured.response;'''
          for old, new, label in ((entity_old, entity_new, "entity"), (module_old, module_new, "module"), (full_old, full_new, "full")):
              if route.count(old) != 1:
                  raise SystemExit(f"Workspace {label} response marker count: {route.count(old)}")
              route = route.replace(old, new, 1)
          route_path.write_text(route, encoding="utf-8")

          Path("tests/egress-deferred-guardrails.test.ts").write_text('''import { describe, expect, test } from "bun:test";\n\nconst app = await Bun.file("src/components/rdash/RDashApp.tsx").text();\nconst targeted = await Bun.file("src/lib/rdash/server/targeted-commit.ts").text();\nconst healthRoute = await Bun.file("src/app/api/health/summary/route.ts").text();\nconst workspaceRoute = await Bun.file("src/app/api/workspace/route.ts").text();\n\ndescribe("deferred egress guardrails", () => {\n  test("login welcome shares the health request", () => {\n    expect(app).toContain("loadWorkspaceHealth");\n    expect(app).not.toContain('fetch("/api/health/summary"');\n  });\n\n  test("catalog upserts are targeted", () => {\n    expect(targeted).toContain('"master.workSubcategories"');\n    expect(targeted).toContain('operation.collection.startsWith("master.")');\n  });\n\n  test("egress-heavy responses report byte sizes", () => {\n    expect(healthRoute).toContain('"X-UC-Response-Bytes"');\n    expect(workspaceRoute).toContain('"X-UC-Response-Bytes"');\n    expect(workspaceRoute).toContain('[workspace-response]');\n  });\n});\n''', encoding="utf-8")

          Path(".github/workflows/tmp-egress-deferred-v13.yml").unlink(missing_ok=True)

      - name: Commit deferred fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete PostgREST egress hardening"
          git push origin HEAD:feature/eliminate-postgrest-egress-leaks
