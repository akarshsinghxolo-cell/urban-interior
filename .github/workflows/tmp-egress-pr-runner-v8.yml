name: Run PostgREST egress hardening patch v8

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Execute completed egress patch
        shell: python
        run: |
          from pathlib import Path
          import base64
          import re

          values = {
            "marker": "ZnVuY3Rpb24gdXNlclBheWxvYWQodXNlcjogQXdhaXRlZDxSZXR1cm5UeXBlPHR5cGVvZiByZXF1aXJlU2Vzc2lvbj4+KSB7CiAgcmV0dXJuIHsKICAgIG5hbWU6IHVzZXIubmFtZSwKICAgIGVtYWlsOiB1c2VyLmVtYWlsLAogICAgcm9sZTogdXNlci5yb2xlLAogICAgc3RhZmZJZDogdXNlci5zdGFmZklkLAogICAgZXhwaXJlc0F0OiB1c2VyLmV4cGlyZXNBdCwKICB9Owp9Cg==",
            "helper": "",
            "entity_old": "",
            "entity_new": "",
            "module_old": "",
            "module_new": "",
            "full_old": "",
            "full_new": "",
          }
          decoded = {key: base64.b64decode(value).decode("utf-8") for key, value in values.items()}
          route_path = Path("src/app/api/workspace/route.ts")
          route = route_path.read_text(encoding="utf-8")
          for old_key, new_key in (("marker", "helper"), ("entity_old", "entity_new"), ("module_old", "module_new"), ("full_old", "full_new")):
            old = decoded[old_key]
            if route.count(old) != 1:
              raise SystemExit(f"Workspace response anchor {old_key}: {route.count(old)}")
            route = route.replace(old, decoded[new_key], 1)
          route_path.write_text(route, encoding="utf-8")

          embedded_path = Path(".github/workflows/tmp-egress-hardening.yml")
          embedded = embedded_path.read_text(encoding="utf-8")
          embedded, removed = re.subn(
            r"\n          # Workspace success payload helper avoids double serialization while reporting bytes\..*?\n          # Store the migration in the repository\.",
            "\n          # Store the migration in the repository.",
            embedded,
            count=1,
            flags=re.S,
          )
          if removed != 1:
            raise SystemExit(f"Embedded workspace telemetry block removal count: {removed}")
          embedded_path.write_text(embedded, encoding="utf-8")

          runner = Path(".github/workflows/tmp-egress-pr-runner-v7.yml").read_text(encoding="utf-8").splitlines()
          run_line = next(i for i, line in enumerate(runner) if line.strip() == "run: |")
          end = next(i for i in range(run_line + 1, len(runner)) if runner[i].strip() == "- name: Commit implementation")
          script = [line[10:] if line.startswith("          ") else line for line in runner[run_line + 1:end]]
          exec(compile("\n".join(script) + "\n", "egress-runner-v7.py", "exec"), {"__name__": "__main__"})
          for name in ("tmp-egress-pr-runner-v5.yml", "tmp-egress-pr-runner-v6.yml", "tmp-egress-pr-runner-v7.yml", "tmp-egress-pr-runner-v8.yml"):
            Path(".github/workflows", name).unlink(missing_ok=True)

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Eliminate repeated PostgREST workspace egress"
          git push origin HEAD:${{ github.head_ref }}
