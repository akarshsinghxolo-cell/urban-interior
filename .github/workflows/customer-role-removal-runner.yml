name: Customer Roles removal validator

on:
  push:
    branches:
      - agent/remove-customer-roles

permissions:
  contents: write

jobs:
  validate-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply complete Customer Roles removal
        run: python3 scripts/remove-customer-roles.py
      - name: Install dependencies
        run: npm ci
      - name: Test Customer/Site lifecycle and role removal
        run: npm run test:customer-sites-save
      - name: Typecheck application
        run: npx tsc --noEmit
      - name: Lint application
        run: npm run lint
      - name: Build application
        run: npm run build
      - name: Commit validated removal and remove runner
        env:
          BRANCH: agent/remove-customer-roles
        run: |
          rm -f scripts/remove-customer-roles.py .github/workflows/customer-role-removal-runner.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove Customer Roles across the app"
          git push origin "HEAD:${BRANCH}"
