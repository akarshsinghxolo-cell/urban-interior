name: Import re-audited Bucket 3

on:
  push:
    branches:
      - agent/bucket-3-reaudited

permissions:
  contents: write

jobs:
  import:
    if: github.event.head_commit.message == 'Stage re-audited Bucket 3 archive'
    runs-on: ubuntu-latest
    steps:
      - name: Check out staging commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and commit verified source tree
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v zstd >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y zstd
          fi

          payload_dir=.github/import-bucket3-zpatch
          workflow_path=.github/workflows/import-bucket3.yml

          cat "$payload_dir"/chunk*.b64 | base64 --decode > /tmp/bucket3.zpatch
          echo 'cc129352e521bcac93cd3a69c8ecaac5dfd7af69aec4cd5ad45d74d18e66b9c2  /tmp/bucket3.zpatch' | sha256sum --check --strict

          rm -rf /tmp/urban-base /tmp/urban-final
          mkdir -p /tmp/urban-base /tmp/urban-final
          rsync -a \
            --exclude='.git/' \
            --exclude="$payload_dir/" \
            --exclude="$workflow_path" \
            ./ /tmp/urban-base/
          rmdir /tmp/urban-base/.github/workflows 2>/dev/null || true
          rmdir /tmp/urban-base/.github 2>/dev/null || true

          find /tmp/urban-base -type d -exec chmod 755 {} +
          find /tmp/urban-base -type f -exec chmod 644 {} +
          (
            cd /tmp/urban-base
            tar --sort=name \
              --mtime='UTC 1970-01-01' \
              --owner=0 \
              --group=0 \
              --numeric-owner \
              --format=gnu \
              --mode='u+rwX,go+rX,go-w,a-s' \
              -cf /tmp/urban-base.tar .
          )
          echo 'd554ce8332d70930f44a4f4eb54c14af256cd81c210861442bb506bb9a415193  /tmp/urban-base.tar' | sha256sum --check --strict

          zstd --quiet --decompress \
            --patch-from=/tmp/urban-base.tar \
            /tmp/bucket3.zpatch \
            -o /tmp/urban-final.tar
          echo '98a5c4d9e70801d5d337a90e1caff8057aca8ea36a193fe5eb529e7e87e715bf  /tmp/urban-final.tar' | sha256sum --check --strict
          tar -xf /tmp/urban-final.tar -C /tmp/urban-final

          python3 <<'PY'
          import subprocess

          output = subprocess.check_output(["git", "ls-tree", "-rz", "HEAD"])
          with open("/tmp/head-modes.tsv", "wb") as handle:
              for entry in output.split(b"\0"):
                  if not entry:
                      continue
                  metadata, path = entry.split(b"\t", 1)
                  mode, object_type, _ = metadata.split(b" ", 2)
                  if object_type == b"blob":
                      handle.write(mode + b"\t" + path + b"\0")
          PY

          rsync -a --delete --exclude='.git/' /tmp/urban-final/ ./

          python3 <<'PY'
          import os
          import stat

          with open("/tmp/head-modes.tsv", "rb") as handle:
              for entry in handle.read().split(b"\0"):
                  if not entry:
                      continue
                  mode, raw_path = entry.split(b"\t", 1)
                  path = os.fsdecode(raw_path)
                  if not os.path.isfile(path):
                      continue
                  current = os.stat(path).st_mode
                  if mode == b"100755":
                      os.chmod(path, current | stat.S_IXUSR | stat.S_IXGRP | stat.S_IXOTH)
                  else:
                      os.chmod(path, current & ~(stat.S_IXUSR | stat.S_IXGRP | stat.S_IXOTH))
          PY

          test ! -e "$payload_dir"
          test ! -e "$workflow_path"
          test -f src/lib/rdash/work-required-lifecycle.ts
          test -f src/lib/rdash/navigation-history.ts
          test -f src/components/rdash/WorkspaceTabs.tsx
          test ! -e src/components/rdash/RecentActivityTimeline.tsx

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          if git diff --cached --quiet; then
            echo 'Import produced no source changes.' >&2
            exit 1
          fi
          git commit -m 'Implement and re-audit Buckets 2 and 3'
          git push origin HEAD:agent/bucket-3-reaudited
