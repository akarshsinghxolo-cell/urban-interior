name: Update Master scope egress test

on:
  push:
    branches:
      - feature/eliminate-postgrest-egress-leaks

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/eliminate-postgrest-egress-leaks
          fetch-depth: 0

      - name: Replace obsolete Master scope assertion
        shell: python
        run: |
          from pathlib import Path
          path = Path("tests/workspace-module-scoped-read.test.ts")
          text = path.read_text(encoding="utf-8")
          old = '''  test("Master Setup includes all master collections without operational ledgers", () => {
    const masterCollections = Object.keys(COLLECTION_TO_TABLE).filter((collection) =>
      collection.startsWith("master.")
    );
    for (const collection of masterCollections) {
      expect(MASTER_SCOPE_COLLECTIONS).toContain(collection);
    }
    expect(MASTER_SCOPE_COLLECTIONS).not.toContain("payments");
    expect(MASTER_SCOPE_COLLECTIONS).not.toContain("workOrders");
  });'''
          new = '''  test("Master Setup loads only the Work & Rate catalogue graph", () => {
    expect(MASTER_SCOPE_COLLECTIONS).toEqual([
      "auditLog",
      "master.units",
      "master.workCategories",
      "master.workSubcategories",
      "master.articles",
      "master.articleVariants",
      "master.subcategoryArticleMap",
      "master.workOptionGroups",
      "master.workOptionValues",
    ]);
    for (const excluded of [
      "master.vendors",
      "master.contractors",
      "master.vendorRates",
      "master.vendorRateHistories",
      "master.storageAccounts",
      "master.fileAssets",
      "master.catalogues",
      "master.referenceMedia",
      "payments",
      "workOrders",
    ]) {
      expect(MASTER_SCOPE_COLLECTIONS).not.toContain(excluded);
    }
  });'''
          if text.count(old) != 1:
              raise SystemExit(f"Master scope test marker count: {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          Path(".github/workflows/tmp-update-master-scope-test.yml").unlink(missing_ok=True)
          Path(".master-scope-test-trigger").unlink(missing_ok=True)

      - name: Commit updated assertion
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Enforce the narrow Master Setup scope"
          git push origin HEAD:feature/eliminate-postgrest-egress-leaks
