name: Vendor Module Cleanup Runner

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'feature/vendor-module-cleanup-no-legacy'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Apply Vendor cleanup
        run: |
          python scripts/apply-vendor-module-cleanup.py
          rm scripts/apply-vendor-module-cleanup.py
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test Vendor module
        run: bun run test:vendor-module
      - name: Test Customer and Site legacy removal
        run: bun run test:customer-sites-legacy
      - name: Test targeted commit policy
        run: bun run test:phase2b
      - name: Lint
        run: bun run lint
      - name: Build
        run: bun run build
      - name: Commit verified cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No application changes to commit."
            exit 0
          fi
          git commit -m "Complete Vendor module cleanup and remove legacy compatibility"
          git push origin HEAD:feature/vendor-module-cleanup-no-legacy
