name: Staff assignment type cleanup

on:
  push:
    branches:
      - agent/staff-reference-integrity

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/staff-reference-integrity
      - name: Add canonical assignment IDs to shared types
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/lib/rdash/types.ts")
          text = path.read_text(encoding="utf-8")

          # Task + recurring task definitions both used assignee_id.
          old = "    assignee_id?: ID;\n    assignee_name?: string;"
          new = "    assigned_staff_id?: ID;\n    /** @deprecated Runtime compatibility alias; persist assigned_staff_id instead. */\n    assignee_id?: ID;\n    /** @deprecated Derived from canonical Staff at read time. */\n    assignee_name?: string;"
          count = text.count(old)
          if count != 2:
              raise SystemExit(f"Expected 2 task-like assignee blocks, found {count}")
          text = text.replace(old, new)

          old = "    assigned_to?: string;\n    assigned_role?: string;"
          new = "    assigned_staff_id?: ID;\n    /** @deprecated Derived from canonical Staff at read time. */\n    assigned_to?: string;\n    /** @deprecated Derived from canonical Staff at read time. */\n    assigned_role?: string;"
          count = text.count(old)
          if count < 1:
              raise SystemExit("Follow-up assignment block not found")
          text = text.replace(old, new)

          old = "    assignee_type?: \"staff\" | \"contractor\";\n    staff_id: ID;\n    staff_name: string;"
          new = "    assignee_type?: \"staff\" | \"contractor\";\n    assigned_staff_id?: ID;\n    /** @deprecated Runtime compatibility alias; persist assigned_staff_id instead. */\n    staff_id: ID;\n    /** @deprecated Derived from canonical Staff at read time. */\n    staff_name: string;"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"Visit assignment block count was {count}")
          text = text.replace(old, new)

          path.write_text(text, encoding="utf-8")
          PY
      - name: Commit type cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/rdash/types.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add canonical Staff assignment IDs to shared types"
          git push origin HEAD:agent/staff-reference-integrity
