name: Reconcile PR 189

on:
  push:
    branches:
      - feature/quotation-delete-and-edit

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: feature/quotation-delete-and-edit
      - name: Reconcile with current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          python3 scripts/pr189-reconcile.py
          git add src/components/rdash/DetailPanel.tsx src/components/rdash/recordActions.tsx src/lib/rdash/store/quotations-helpers.ts src/lib/rdash/store/slices/quotations-core.ts src/lib/rdash/store/types.ts tests/quotation-delete.test.ts
          git commit -m "fix: retain quotation history and centralize draft deletion"
          git rm .github/workflows/pr189-current-main-reconcile.yml scripts/pr189-reconcile.py
          git commit -m "chore: remove quotation reconciliation helpers"
          git push origin HEAD:feature/quotation-delete-and-edit
