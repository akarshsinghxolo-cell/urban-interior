name: Agent remove local-file validation

on:
  push:
    branches:
      - agent/file-reliability-public-preview-cleanup
    paths:
      - .github/workflows/agent-remove-local-validation.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/file-reliability-public-preview-cleanup
      - name: Remove obsolete local-file validation branches
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/lib/rdash/business-rules.ts")
          text = path.read_text()
          replacements = {
              'if (folder.storage_account_id !== "local" && !storageAccounts.has(folder.storage_account_id))':
                  'if (!storageAccounts.has(folder.storage_account_id))',
              '        const isLocal = file.storage_provider === "local" || file.storage_account_id === "local";\n':
                  '',
              '        if (!isLocal && !/^https:\\/\\/drive\\.google\\.com\\//.test(file.web_view_link || ""))':
                  '        if (!/^https:\\/\\/drive\\.google\\.com\\//.test(file.web_view_link || ""))',
              '        if (!isLocal && (file.storage_provider !== "google_drive" || file.sync_status !== "uploaded"))':
                  '        if (file.storage_provider !== "google_drive" || file.sync_status !== "uploaded")',
              '        if (isLocal && file.sync_status !== "uploaded")\n            fail("Drive file", "must be a completed upload.");\n':
                  '',
              '        if (file.storage_account_id && !isLocal && !storageAccounts.has(file.storage_account_id))':
                  '        if (file.storage_account_id && !storageAccounts.has(file.storage_account_id))',
              '            if (!isLocal && !file.google_file_id)':
                  '            if (!file.google_file_id)',
          }
          original = text
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"Expected source fragment was not found: {old}")
              text = text.replace(old, new, 1)
          if text == original:
              raise SystemExit("No source changes were produced")
          path.write_text(text)
          PY
      - name: Commit source cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/rdash/business-rules.ts
          git commit -m "Remove obsolete local-file validation"
          git push origin HEAD:agent/file-reliability-public-preview-cleanup
