name: Contractor Profile Cleanup Runner

on:
  push:
    branches:
      - cleanup/contractor-profile-redbox
    paths:
      - .github/workflows/contractor-profile-cleanup-runner.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: cleanup/contractor-profile-redbox
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Apply Contractor profile cleanup
        run: python scripts/apply-contractor-profile-cleanup.py
      - name: Check patch whitespace
        run: git diff --check
      - name: Install dependencies
        run: npm ci
      - name: Test Contractor canonical model and legacy guardrails
        run: npm run test:contractor-profile
      - name: Test Partner governance regressions
        run: npx vitest run tests/partner-governance.test.ts || test ! -f tests/partner-governance.test.ts
      - name: Typecheck application
        run: npx tsc --noEmit
      - name: Lint application
        run: npm run lint
      - name: Build application
        run: npm run build
      - name: Remove one-shot cleanup machinery
        run: |
          rm scripts/apply-contractor-profile-cleanup.py
          rm .github/workflows/contractor-profile-cleanup-runner.yml
      - name: Commit verified cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No cleanup changes to commit."
            exit 1
          fi
          git commit -m "Remove obsolete Contractor tax, banking and capacity fields"
          git push origin HEAD:cleanup/contractor-profile-redbox
