name: Contractor Profile Cleanup Runner

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/contractor-profile-cleanup-runner.yml
  push:
    branches:
      - cleanup/contractor-profile-redbox
    paths:
      - .github/workflows/contractor-profile-cleanup-runner.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: cleanup/contractor-profile-redbox
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Correct one-shot runner patterns
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply-contractor-profile-cleanup.py')
          s = p.read_text()
          replacements = [
              (
                  r"\} \) \{.*?\n}\s*$'",
                  r"\}\) \{.*?\n}\s*$'",
              ),
              (
                  'text, count = re.subn(rf"^  {re.escape(field)}: [^;]+;\\n", "", text, flags=re.M)',
                  'text, count = re.subn(rf"^  {re.escape(field)}: [^;]+;\\n", "", text, count=1, flags=re.M)',
              ),
              (
                  'if field in profile:\n            raise RuntimeError(f"Removed field still in canonical profile: {field}")\n        if field in contractor_slice:',
                  'if re.search(rf"\\b{re.escape(field)}\\b", profile):\n            raise RuntimeError(f"Removed field still in canonical profile: {field}")\n        if re.search(rf"\\b{re.escape(field)}\\b", contractor_slice):',
              ),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Expected runner pattern was not found: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Apply Contractor profile cleanup
        id: apply
        shell: bash
        run: |
          set +e
          python scripts/apply-contractor-profile-cleanup.py > contractor-cleanup-run.log 2>&1
          status=$?
          cat contractor-cleanup-run.log
          if [ "$status" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f contractor-cleanup-run.log
            git commit -m "Record Contractor cleanup runner failure" || true
            git pull --rebase origin cleanup/contractor-profile-redbox || true
            git push origin HEAD:cleanup/contractor-profile-redbox || true
            exit "$status"
          fi
      - name: Check patch whitespace
        run: git diff --check
      - name: Install dependencies
        run: npm ci
      - name: Test Contractor canonical model and legacy guardrails
        run: npm run test:contractor-profile
      - name: Typecheck application
        run: npx tsc --noEmit
      - name: Lint application
        run: npm run lint
      - name: Build application
        run: npm run build
      - name: Remove one-shot cleanup machinery
        run: |
          rm -f contractor-cleanup-run.log
          rm scripts/apply-contractor-profile-cleanup.py
          rm .github/workflows/contractor-profile-cleanup-runner.yml
      - name: Commit verified cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No cleanup changes to commit."
            exit 1
          fi
          git pull --rebase origin cleanup/contractor-profile-redbox
          git commit -m "Remove obsolete Contractor tax, banking and capacity fields"
          git push origin HEAD:cleanup/contractor-profile-redbox
