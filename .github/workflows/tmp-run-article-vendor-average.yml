name: Run article vendor-rate integration

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Stop after implementation commit
        id: trigger
        run: |
          if [ -f .article-vendor-average-trigger ]; then
            echo "enabled=1" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=0" >> "$GITHUB_OUTPUT"
          fi

      - uses: oven-sh/setup-bun@v2
        if: steps.trigger.outputs.enabled == '1'
        with:
          bun-version: 1.3.14

      - name: Execute reviewed integration script
        if: steps.trigger.outputs.enabled == '1'
        shell: python
        run: |
          from pathlib import Path

          workflow = Path(".github/workflows/tmp-article-vendor-average.yml").read_text(encoding="utf-8")
          start_marker = "      - name: Apply integration patch\n        shell: python\n        run: |\n"
          end_marker = "\n      - name: Install and run focused tests"
          embedded = workflow.split(start_marker, 1)[1].split(end_marker, 1)[0]
          output = []
          delimiter = None
          for line in embedded.splitlines():
              if delimiter is None:
                  code = line[10:] if line.startswith("          ") else line
                  output.append(code)
                  for candidate in ("'''", '\"\"\"'):
                      if code.count(candidate) % 2 == 1:
                          delimiter = candidate
                          break
              else:
                  output.append(line)
                  if line.count(delimiter) % 2 == 1:
                      delimiter = None
          script = "\n".join(output)
          exec(compile(script, "article-vendor-average-patch.py", "exec"), {"__name__": "__main__"})

      - name: Install and run focused tests
        if: steps.trigger.outputs.enabled == '1'
        run: |
          bun install --frozen-lockfile
          bun run test:vendor-rate-average
          bun run test:phase2b

      - name: Commit implementation
        if: steps.trigger.outputs.enabled == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout HEAD -- .github/workflows/application-ci.yml .github/workflows/tmp-article-vendor-average.yml .github/workflows/tmp-run-article-vendor-average.yml
          git add -A
          git commit -m "Average vendor landed rates by article"
          git push origin HEAD:${{ github.head_ref }}
