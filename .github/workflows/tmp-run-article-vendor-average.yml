name: Run article vendor-rate integration

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Install workflow parser
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Execute reviewed integration script
        shell: python
        run: |
          from pathlib import Path
          import yaml

          document = yaml.safe_load(Path(".github/workflows/tmp-article-vendor-average.yml").read_text(encoding="utf-8"))
          steps = document["jobs"]["patch"]["steps"]
          script = next(step["run"] for step in steps if step.get("name") == "Apply integration patch")
          exec(compile(script, "article-vendor-average-patch.py", "exec"), {"__name__": "__main__"})
          Path(".github/workflows/tmp-run-article-vendor-average.yml").unlink(missing_ok=True)

      - name: Install and run focused tests
        run: |
          bun install --frozen-lockfile
          bun run test:vendor-rate-average
          bun run test:phase2b

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Average vendor landed rates by article"
          git push origin HEAD:${{ github.head_ref }}
