name: Phase 4 source audit

on:
  pull_request:
    branches:
      - agent/audit-upload-phases-1-3
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Create source snapshot
        run: |
          tar \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='phase4-source.tar.gz' \
            -czf phase4-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: phase4-source
          path: phase4-source.tar.gz
          retention-days: 1
