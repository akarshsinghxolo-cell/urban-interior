name: Apply Phase 4 upload cutover

on:
  push:
    branches:
      - agent/direct-drive-upload-phase4
    paths:
      - ".phase4-patch/**"
      - ".phase4-cutover.patch"
      - ".phase4-fieldmode-fix.patch"
      - ".github/workflows/phase4-source-export.yml"
  pull_request:
    branches:
      - agent/audit-upload-phases-1-3
    paths:
      - ".phase4-patch/**"
      - ".phase4-cutover.patch"
      - ".phase4-fieldmode-fix.patch"
      - ".github/workflows/phase4-source-export.yml"
  workflow_dispatch:

concurrency:
  group: phase4-upload-cutover
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply-build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/direct-drive-upload-phase4
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Reconstruct and apply the cutover patch
        shell: bash
        run: |
          set -euo pipefail
          cat .phase4-patch/part-* | base64 --decode | gzip --decompress > /tmp/phase4-cutover.patch
          git apply --index /tmp/phase4-cutover.patch
          git apply --index .phase4-fieldmode-fix.patch
          git rm -f src/app/api/google-drive/upload/route.ts

      - name: Verify the legacy upload path is gone
        shell: bash
        run: |
          set -euo pipefail
          if rg -n 'uploadManagedFile|uploadCapturedMediaToGoogleDrive|/api/google-drive/upload|asManagedFileAsset|uploadManagedFileAsset|makeFilePublic' src; then
            echo 'Legacy upload references remain.' >&2
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the complete application
        shell: bash
        run: |
          set -o pipefail
          bun run build 2>&1 | tee /tmp/phase4-build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4-cutover-build-log
          path: /tmp/phase4-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit the verified cutover
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .phase4-cutover.patch
          git rm -f .phase4-fieldmode-fix.patch
          git rm -r -f .phase4-patch
          git rm -f .github/workflows/phase4-source-export.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Migrate all uploads to the direct Drive queue'
          git push origin HEAD:agent/direct-drive-upload-phase4
