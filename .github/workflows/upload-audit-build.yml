name: Upload architecture audit build

on:
  pull_request:
    paths:
      - "src/app/api/operations/commit/route.ts"
      - "src/app/api/uploads/**"
      - "src/components/uploads/**"
      - "src/lib/uploads/**"
      - "src/lib/rdash/server/direct-upload*"
      - "supabase/migrations/*upload*"
      - ".github/workflows/upload-audit-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Build application
        id: build
        shell: bash
        run: |
          set +e
          bun run build > build.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Preserve build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upload-audit-build-log
          path: build.log
          if-no-files-found: error
          retention-days: 7
      - name: Fail when build failed
        if: steps.build.outputs.exit_code != '0'
        run: |
          tail -200 build.log
          exit "${{ steps.build.outputs.exit_code }}"
