name: Agent actions smoke
on:
  push:
    branches: [agent/centralize-gps-acquisition]
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/centralize-gps-acquisition
      - run: |
          echo "actions-ran" > .github/actions-smoke-ran.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/actions-smoke-ran.txt
          git commit -m "record branch actions smoke"
          git push origin HEAD:agent/centralize-gps-acquisition
