name: Customer Registry Contract Fix

on:
  push:
    branches:
      - fix/customer-desk-single-truth

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Replace retired contractor-rate pin
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/workspace-module-read-registry.test.ts')
          text = path.read_text(encoding='utf-8')
          old = '''  test("customer scope still carries contractor rates for the capture estimates (Task 24 pin)", () => {\n    expect(CUSTOMER_SCOPE_COLLECTIONS).toContain("master.contractorRates");\n  });'''
          new = '''  test("customer scope excludes contractor rates now that Site Execution owns capture estimates", () => {\n    expect(CUSTOMER_SCOPE_COLLECTIONS).not.toContain("master.contractorRates");\n  });'''
          if old not in text:
              raise SystemExit('retired Task 24 pin not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          Path('.github/workflows/customer-registry-contract-fix.yml').unlink()
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Retire Customer contractor-rate scope pin"
          git push origin HEAD:fix/customer-desk-single-truth
