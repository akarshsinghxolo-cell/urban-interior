name: Customer conversation outbox recovery

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate-and-commit:
    if: github.head_ref == 'agent/recover-customer-conversation-outbox'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Apply outbox recovery wiring
        run: python scripts/apply-customer-outbox-recovery-wiring.py
      - name: Install dependencies
        run: npm ci
      - name: Test Customer save and outbox recovery
        run: npm run test:customer-sites-save
      - name: Typecheck application
        run: npx tsc --noEmit
      - name: Lint application
        run: npm run lint
      - name: Build application
        run: npm run build
      - name: Commit validated recovery and remove runner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm scripts/apply-customer-outbox-recovery-wiring.py
          rm .github/workflows/customer-outbox-recovery-runner.yml
          git add -A
          git commit -m "Recover pre-fix Customer outbox operations"
          git push origin HEAD:agent/recover-customer-conversation-outbox
