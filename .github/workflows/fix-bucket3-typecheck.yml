name: Fix Bucket 3 type check

on:
  push:
    branches:
      - agent/bucket-3-reaudited

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Stage Bucket 3 type-check fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded customer lookup
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('src/components/rdash/CommandPalette.tsx')
          source = path.read_text()
          old = '            const customer = customerById.get(t.customer_id);'
          new = '            const customer = t.customer_id ? customerById.get(t.customer_id) : undefined;'
          if source.count(old) != 1:
              raise SystemExit(f'Expected one task customer lookup, found {source.count(old)}')
          path.write_text(source.replace(old, new, 1))
          PY

          rm .github/workflows/fix-bucket3-typecheck.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'Handle tasks without customer assignments'
          git push origin HEAD:agent/bucket-3-reaudited
