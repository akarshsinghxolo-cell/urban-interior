name: Lint diagnostic Supabase convergence

on:
  push:
    branches:
      - agent/supabase-data-convergence

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/supabase-data-convergence
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Capture lint output
        run: |
          set +e
          bun run lint > supabase-convergence-lint.txt 2>&1
          code=$?
          echo "EXIT_CODE=$code" >> supabase-convergence-lint.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase-convergence-lint.txt
          git commit -m "Capture Supabase convergence lint diagnostic"
          git push origin HEAD:agent/supabase-data-convergence
