name: Final Contractor legacy symbol cleanup

on:
  push:
    branches:
      - agent/remove-final-contractor-legacy-symbol

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/remove-final-contractor-legacy-symbol
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Apply final Contractor cleanup
        run: python scripts/remove-final-contractor-legacy-symbol.py
      - name: Remove temporary cleanup machinery
        run: |
          rm scripts/remove-final-contractor-legacy-symbol.py
          rm .github/workflows/final-contractor-legacy-symbol-cleanup.yml
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test Contractor profile
        run: bun run test:contractor-profile
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Verify Contractor compatibility is gone
        run: |
          python - <<'PY'
          from pathlib import Path

          profile = Path("src/lib/rdash/contractor-profile.ts").read_text()
          types = Path("src/lib/rdash/types.ts").read_text()
          governance = Path("src/lib/rdash/partner-governance.ts").read_text()
          ui = Path("src/components/rdash/modules/PartnerGovernanceModule.tsx").read_text()

          start = types.index("export interface Contractor {")
          end = types.index("export type StaffRoleKey", start)
          contractor_type = types[start:end]

          assert "capabilities_v2" not in profile
          assert "capabilities_v2" not in contractor_type
          assert "export function partnerCapabilities" not in governance
          assert "partner.work_capabilities" not in governance
          assert "partnerCapabilities" not in ui
          assert "export function vendorCapabilities" in governance
          assert "vendorCapabilities(selected)" in ui
          assert "vendorCapabilities(partner)" in ui
          assert "canonicalContractorCapabilities(selected, db)" in ui
          print("Contractor compatibility removed; Vendor capabilities remain intentionally separate.")
          PY
      - name: Commit verified cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove final Contractor legacy capability symbol"
          git push origin HEAD:agent/remove-final-contractor-legacy-symbol
