name: Agent foundation finalization

on:
  push:
    branches:
      - agent/page-entity-egress-architecture
    paths:
      - .github/workflows/agent-foundation-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/page-entity-egress-architecture
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Apply final foundation lifecycle refinements
        run: |
          python - <<'PY'
          from pathlib import Path

          def patch(path, old, new, count=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              found = text.count(old)
              if found < count:
                  raise SystemExit(f'{path}: patch anchor missing ({found}): {old[:100]!r}')
              p.write_text(text.replace(old, new, count), encoding='utf-8')

          # Bootstrap establishes the exact revision of the resident shared foundation.
          patch(
              'src/components/rdash/RDashApp.tsx',
              'import { loadedWorkspaceCollections } from "@/lib/rdash/workspace-delta";\n',
              'import { loadedWorkspaceCollections } from "@/lib/rdash/workspace-delta";\nimport { workspaceFoundationRevisionState } from "@/lib/rdash/workspace-foundation-revision-state";\n',
          )
          patch(
              'src/components/rdash/RDashApp.tsx',
              '''            useRDashStore.getState().hydrateSecureWorkspace({\n                db: payload.data,\n                revision: payload.revision,\n                user: payload.user,\n                rowVersions: payload.rowVersions,\n            });\n            workspaceReadState.recordResponse(response);\n''',
              '''            useRDashStore.getState().hydrateSecureWorkspace({\n                db: payload.data,\n                revision: payload.revision,\n                user: payload.user,\n                rowVersions: payload.rowVersions,\n            });\n            workspaceFoundationRevisionState.replace(payload.revision);\n            workspaceReadState.recordResponse(response);\n''',
          )

          # Foundation sync runs only after another authoritative read proves the workspace advanced.
          p = Path('src/components/urban-castle/WorkspaceFoundationSync.tsx')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              ''' * session. This synchronizer only consults the revision journal when the user\n * enters a module (or a scoped read discovers a newer workspace revision).\n''',
              ''' * session. This synchronizer consults the revision journal only after another\n * authoritative scoped/entity read discovers a newer workspace revision.\n''',
              1,
          )
          old = '''  const targetKey = `${target.scope}:${target.moduleId}:${target.entity?.kind || ""}:${target.entity?.id || ""}`;\n  const previousTargetKeyRef = React.useRef<string | null>(null);\n\n'''
          if old not in text: raise SystemExit('foundation target-key block missing')
          text = text.replace(old, '', 1)
          old = '''    if (!authUser) {\n      workspaceFoundationRevisionState.reset();\n      previousTargetKeyRef.current = null;\n      return;\n    }\n\n    const current = useRDashStore.getState();\n    const metadata = current.db as unknown as Record<string, unknown>;\n    if (\n      workspaceFoundationRevisionState.get() === 0\n      && metadata._workspace_read_scope === "bootstrap"\n      && metadata._workspace_foundation_embedded === true\n    ) {\n      workspaceFoundationRevisionState.replace(current.serverRevision);\n    }\n\n    const targetChanged = previousTargetKeyRef.current !== targetKey;\n    previousTargetKeyRef.current = targetKey;\n    const knownFoundationRevision = workspaceFoundationRevisionState.get();\n    if (!targetChanged && knownFoundationRevision >= serverRevision) return;\n'''
          new = '''    if (!authUser) {\n      workspaceFoundationRevisionState.reset();\n      return;\n    }\n\n    const current = useRDashStore.getState();\n    const metadata = current.db as unknown as Record<string, unknown>;\n    if (workspaceFoundationRevisionState.get() === 0 && metadata._workspace_foundation_embedded === true) {\n      workspaceFoundationRevisionState.replace(current.serverRevision);\n    }\n\n    const knownFoundationRevision = workspaceFoundationRevisionState.get();\n    if (knownFoundationRevision >= serverRevision) return;\n'''
          if old not in text: raise SystemExit('foundation effect baseline block missing')
          text = text.replace(old, new, 1)
          old = '''              "X-UC-Delta-Client": "workspace-foundation",\n              "X-UC-Delta-Module": target.moduleId,\n'''
          new = '''              "X-UC-Delta-Client": "workspace-foundation",\n              "X-UC-Foundation-Delta": "1",\n              "X-UC-Delta-Module": target.moduleId,\n'''
          if old not in text: raise SystemExit('foundation request headers missing')
          text = text.replace(old, new, 1)
          text = text.replace('  }, [authUser, serverRevision, target.moduleId, targetKey]);', '  }, [authUser, serverRevision, target.moduleId]);', 1)
          p.write_text(text, encoding='utf-8')

          # Foundation deltas always preserve the safe Staff-directory projection, even for Owners/HR.
          p = Path('src/app/api/changes/route.ts')
          text = p.read_text(encoding='utf-8')
          old = '''    const access = await authorizeWorkspaceDeltaTarget(user, moduleId, requestedCollections);\n    const canReadFullStaff = canReadFullStaffData(user.role);\n    const collections = staffSafeCollections(access.collections, canReadFullStaff);\n    const delta = await getWorkspaceChanges(\n      afterRevision,\n      collections,\n      canReadFullStaff ? undefined : DIRECTORY_PROJECTION_COLLECTIONS,\n    );\n'''
          new = '''    const access = await authorizeWorkspaceDeltaTarget(user, moduleId, requestedCollections);\n    const foundationProjection = request.headers.get("x-uc-foundation-delta") === "1";\n    const canReadFullStaff = canReadFullStaffData(user.role);\n    const canReturnFullStaffRows = canReadFullStaff && !foundationProjection;\n    const collections = staffSafeCollections(access.collections, canReturnFullStaffRows);\n    const delta = await getWorkspaceChanges(\n      afterRevision,\n      collections,\n      canReturnFullStaffRows ? undefined : DIRECTORY_PROJECTION_COLLECTIONS,\n    );\n'''
          if old not in text: raise SystemExit('changes route Staff delta block missing')
          text = text.replace(old, new, 1)
          text = text.replace(
              'Vary: "Cookie, Authorization, X-UC-Delta-Module",',
              'Vary: "Cookie, Authorization, X-UC-Delta-Module, X-UC-Foundation-Delta",',
              1,
          )
          text = text.replace(
              '"X-UC-Staff-Delta": canReadFullStaff ? "full-allowed" : "directory-only",',
              '"X-UC-Staff-Delta": canReturnFullStaffRows ? "full-allowed" : "directory-only",',
              1,
          )
          p.write_text(text, encoding='utf-8')

          # Regression locks: no per-navigation foundation request; Staff stays projected.
          p = Path('tests/runtime-efficiency-hardening.test.ts')
          test = p.read_text(encoding='utf-8')
          marker = '\n});\n'
          guard = '''\n  test("syncs shared foundation only after global revision advancement and keeps Staff projected", async () => {\n    const app = await read("src/components/rdash/RDashApp.tsx");\n    const foundationSync = await read("src/components/urban-castle/WorkspaceFoundationSync.tsx");\n    const changes = await read("src/app/api/changes/route.ts");\n    expect(app).toContain("workspaceFoundationRevisionState.replace(payload.revision)");\n    expect(foundationSync).toContain("if (knownFoundationRevision >= serverRevision) return");\n    expect(foundationSync).not.toContain("targetChanged");\n    expect(foundationSync).toContain('\"X-UC-Foundation-Delta\": \"1\"');\n    expect(changes).toContain('request.headers.get("x-uc-foundation-delta") === "1"');\n    expect(changes).toContain("canReturnFullStaffRows = canReadFullStaff && !foundationProjection");\n    expect(changes).toContain("canReturnFullStaffRows ? undefined : DIRECTORY_PROJECTION_COLLECTIONS");\n  });\n'''
          idx = test.rfind(marker)
          if idx < 0: raise SystemExit('runtime efficiency describe end missing')
          p.write_text(test[:idx] + guard + test[idx:], encoding='utf-8')

          p = Path('tests/workspace-client-delta-sync.test.ts')
          test = p.read_text(encoding='utf-8')
          old = '''    expect(source).toContain('"X-UC-Delta-Filtered"');\n'''
          new = '''    expect(source).toContain('"X-UC-Delta-Filtered"');\n    expect(source).toContain('request.headers.get("x-uc-foundation-delta") === "1"');\n    expect(source).toContain("canReturnFullStaffRows");\n'''
          if old not in test: raise SystemExit('changes API delta test anchor missing')
          p.write_text(test.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Run focused regressions
        run: npx vitest run tests/runtime-efficiency-hardening.test.ts tests/workspace-client-delta-sync.test.ts tests/workspace-bootstrap-scoped-flow.test.ts tests/workspace-navigation-revalidation.test.ts
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Commit validated refinements
        run: |
          git config user.name "akarshsinghxolo-cell"
          git config user.email "akarshsinghxolo@gmail.com"
          git add src tests
          git commit -m "Finalize shared foundation revision lifecycle"
          git push origin HEAD:agent/page-entity-egress-architecture
