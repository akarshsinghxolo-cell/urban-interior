name: Apply quotation Finance move

on:
  push:
    branches:
      - agent/move-quotation-desk-to-finance

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply focused navigation change
        run: python scripts/move-quotation-desk-to-finance.py
      - name: Run focused tests
        run: |
          npm ci
          npx vitest run tests/quotation-finance-navigation.test.ts tests/module-navigation-ids.test.ts
      - name: Commit generated source
        run: |
          git rm scripts/move-quotation-desk-to-finance.py .github/workflows/apply-quotation-finance-move.yml
          git add src/lib/rdash/modules.ts src/lib/rdash/workspace-routes.ts src/lib/rdash/workspace-entity-routes.ts tests/quotation-finance-navigation.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Move Quotation Desk into Finance"
          git push
